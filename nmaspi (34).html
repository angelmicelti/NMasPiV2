  const wsInstr = XLSX.utils.aoa_to_sheet(instrData);
  wsInstr["!cols"] = [{ wch: 80 }];
  XLSX.utils.book_append_sheet(wb, wsInstr, "Instrucciones");

  XLSX.writeFile(wb, "plantilla_usuarios.xlsx");
};

// =============================================================================
// IMPORTAR USUARIOS DESDE EXCEL (crea nuevos y actualiza existentes)
// Soporta dos formatos, detectados automáticamente por los encabezados:
//   1) Plantilla propia:   Nombre | Usuario | Contraseña | Departamento | Rol
//   2) Séneca "Relación de Personal del Centro" (RelPerCen.xls): Empleado/a |
//      DNI/Pasaporte | Puesto | Fecha de toma de posesión | Fecha de cese |
//      Departamento | ... | Usuario IdEA | Cuenta Google/Microsoft | Coordinador
// =============================================================================
const _IMPORT_RANDOM_CHARS = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function _randomPassword(len = 10) {
  let pass = "";
  for (let i = 0; i < len; i++) pass += _IMPORT_RANDOM_CHARS.charAt(Math.floor(Math.random() * _IMPORT_RANDOM_CHARS.length));
  return pass;
}

// Minúsculas, sin acentos y sin signos de puntuación (comas/puntos -> espacios).
function _deaccentLower(s) {
  return String(s || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[.,;:\/]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Busca una columna del fichero de Séneca por fragmento del encabezado.
// Ej: _senecaCol(row, ["usuario idea"]) -> valor de "Usuario IdEA"
function _senecaCol(row, frags) {
  const keys = Object.keys(row);
  for (const frag of frags) {
    const k = keys.find(kk => _deaccentLower(kk).includes(frag));
    if (k !== undefined) return row[k];
  }
  return "";
}

// "Baena Espejo, María de las Mercedes" -> "María de las Mercedes Baena Espejo"
function _invertirEmpleado(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  const idx = s.indexOf(",");
  if (idx < 0) return s;
  return (s.slice(idx + 1).trim() + " " + s.slice(0, idx).trim()).trim();
}

// Acepta "dd/mm/yyyy" (texto) o número de serie de Excel.
function _parseFechaDMY(s) {
  if (typeof s === "number" && isFinite(s)) {
    const d = new Date(Math.round((s - 25569) * 86400000));
    return isNaN(d) ? null : d;
  }
  const m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.exec(String(s || "").trim());
  if (!m) return null;
  let y = parseInt(m[3], 10);
  if (y < 100) y += 2000;
  const d = new Date(y, parseInt(m[2], 10) - 1, parseInt(m[1], 10));
  return isNaN(d) ? null : d;
}

function _formatDMY(d) {
  if (!d) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
}

// Empareja un departamento del fichero con uno del centro:
//   1) coincidencia exacta (sin acentos ni puntuación): "Matematicas" -> "Matemáticas"
//   2) prefijo: "Lengua Castellana y Literatura" -> "Lengua Castellana"
//   3) primera palabra (única candidata): "Geografía e Historia" -> "Geografía, Historia y Religión"
//      (los nombres ANTIGUOS exactos resuelven antes, por DEPARTAMENTOS_ALIAS,
//       dentro de _normalizarDepartamento)
function _matchDeptByPrefix(raw) {
  const n = _deaccentLower(raw);
  if (!n) return "";
  let hit = DEPARTAMENTOS.find(d => _deaccentLower(d) === n);
  if (hit) return hit;
  hit = DEPARTAMENTOS.find(d => n.startsWith(_deaccentLower(d)));
  if (hit) return hit;
  const firstTok = n.split(" ")[0];
  if (firstTok && firstTok.length >= 4) {
    const cands = DEPARTAMENTOS.filter(d => _deaccentLower(d).split(" ")[0] === firstTok);
    if (cands.length === 1) return cands[0];
  }
  return "";
}

// Departamento del fichero de Séneca. LA COLUMNA «DEPARTAMENTO» MANDA: se usa siempre
// que encaje con algún departamento del centro (Idiomas, Arte, Ciencias Naturales,
// Matematicas sin acento, renombres como «Geografía e Historia»…). El puesto solo se
// usa como último recurso si la columna Departamento está vacía o no encaja con ninguno.
function _mapSenecaDepartamento(dept, puesto) {
  return _normalizarDepartamento(dept) || _normalizarDepartamento(puesto) || "";
}

// ¿Es el fichero de Séneca "Relación de Personal del Centro"?
function _isSenecaRelPerCen(rows) {
  const first = rows[0] || {};
  const keys = Object.keys(first).map(k => _deaccentLower(k));
  const has = (frag) => keys.some(k => k.includes(frag));
  return has("empleado") || has("usuario idea");
}

// ¿Debe conservarse el rol 'admin' de un usuario existente aunque el fichero diga
// 'profesor'? La importación del RelPerCen marca a todo el mundo como profesor:
// JAMÁS debe rebajar a un administrador (ni al propio admin que importa).
// Comportamiento general: manda el rol almacenado en el perfil (y ser quien importa).
function _importConservaAdmin(existing, newRol, isSelf) {
  if (String(newRol || "").toLowerCase() === "admin") return false; // promover nunca se bloquea
  if (!existing) return false;
  if ((existing.role || "") === "admin") return true;              // ya es admin en su perfil
  if (isSelf) return true;                                         // es quien está importando
  return false;
}

// Convierte las filas del RelPerCen en usuarios de la app.
// Devuelve { usuarios: [{nombre, apellidos, username, pass, rol, departamento, _fila}], omitidos: [motivos] }
// "apellidos" es el valor EXACTO previo a la coma del campo Empleado/a de Séneca
// ("RUIZ DE SANTA QUITER GARCÍA, Alfonsa" -> "RUIZ DE SANTA QUITER GARCÍA") y sirve
// para ordenar las listas de usuarios por apellidos sin heurísticas.
function _mapSenecaRows(rows, { skipCesePasado, passInicial }) {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const usuarios = [];
  const omitidos = [];
  rows.forEach((r, i) => {
    const fila = i + 2; // +1 encabezado, +1 para numeración humana
    const empleado = String(_senecaCol(r, ["empleado"])).trim();
    if (!empleado) { omitidos.push(`Fila ${fila}: omitida (Empleado/a vacío)`); return; }
    const nombre = _invertirEmpleado(empleado);
    const ciEmp = empleado.indexOf(",");
    const apellidos = ciEmp > 0 ? empleado.slice(0, ciEmp).trim() : "";
    let username = normalizeUsername(String(_senecaCol(r, ["usuario idea"]) || ""));
    if (username && !isValidUsername(username)) username = "";
    if (!username) username = suggestUsernameFromNombre(nombre);
    if (!username || !isValidUsername(username)) { omitidos.push(`Fila ${fila} (${nombre}): omitida, sin Usuario IdEA válido`); return; }
    const cese = _parseFechaDMY(_senecaCol(r, ["cese"]));
    if (cese && cese < hoy) {
      if (skipCesePasado) { omitidos.push(`Fila ${fila} (${nombre}): omitida, cese el ${_formatDMY(cese)}`); return; }
    }
    const departamento = _mapSenecaDepartamento(String(_senecaCol(r, ["departamento"])), String(_senecaCol(r, ["puesto"])));
    // Contraseña por defecto: el propio Usuario IdEA (Firebase exige >= 6 caracteres;
    // si fuera más corta, se genera una aleatoria). Con passInicial común, manda la común.
    const pass = passInicial || (username.length >= 6 ? username : _randomPassword(10));
    usuarios.push({
      nombre,
      apellidos,
      username,
      pass,
      rol: "profesor",
      departamento,
      _fila: fila,
    });
  });
  return { usuarios, omitidos };
}

// Ganchos de depuración/pruebas (no interfieren con la app).
window._senecaDebug = {
  isSeneca: _isSenecaRelPerCen,

  aliasDept: DEPARTAMENTOS_ALIAS,

window._copyImportCreds = async (btn) => {
  const text = window._importCredsText || "";
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* sin más */ }
    ta.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = "✓ Copiadas";
    btn.disabled = true;
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2000);
  }
};

window._importUsuariosExcel = async () => {
  const fileInput = document.getElementById("iuFile");
  const resultDiv = document.getElementById("iuResult");
  if (!fileInput || !resultDiv) return;
  // Escribe el progreso/resultado re-consultando el nodo actual: si algo re-renderizó
  // la vista en mitad de la importación, el nodo capturado al principio estaría
  // desconectado y el mensaje visible se quedaría congelado.
  const setProgress = (html) => {
    const el = document.getElementById("iuResult");
    if (el) el.innerHTML = html;
  };
  if (!fileInput.files.length) { setProgress('<div class="text-red-600 text-sm">Selecciona un archivo Excel primero.</div>'); return; }
  if (typeof XLSX === "undefined") { setProgress('<div class="text-red-600 text-sm">Error: librería XLSX no cargada.</div>'); return; }

  setProgress('<div class="text-blue-600 text-sm">Procesando archivo…</div>');

  try {
    const file = fileInput.files[0];
    const data = new Uint8Array(await file.arrayBuffer());
    const wb = XLSX.read(data, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    if (!ws) { setProgress('<div class="text-red-600 text-sm">El archivo no tiene hojas.</div>'); return; }
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
    if (rows.length === 0) { setProgress('<div class="text-red-600 text-sm">El archivo no tiene filas de datos.</div>'); return; }

    const credenciales = []; // {username, pass} de los usuarios NUEVOS creados (solo formato Séneca)
    let usuarios;
    let omitidos = [];

    // Detectar formato: plantilla propia vs Séneca "Relación de Personal del Centro"
    if (_isSenecaRelPerCen(rows)) {
      const passInicial = String(document.getElementById("iuPass")?.value || "").trim();
      if (passInicial && passInicial.length < 6) {
        setProgress('<div class="text-red-600 text-sm">La contraseña inicial debe tener al menos 6 caracteres (o déjala vacía para generar una aleatoria distinta por usuario).</div>');
        return;
      }
      const skipCese = !!document.getElementById("iuSkipCese")?.checked;
      const mapped = _mapSenecaRows(rows, { skipCesePasado: skipCese, passInicial });
      usuarios = mapped.usuarios;
      omitidos = mapped.omitidos;
      if (usuarios.length === 0) {
        setProgress(`<div class="text-red-600 text-sm"><strong>No se encontró personal importable en el fichero de Séneca.</strong><br>${omitidos.map(escapeHtml).join("<br>") || "Comprueba que es la «Relación de Personal del Centro» y que tiene filas de datos."}</div>`);
        return;
      }
    } else {
      const findCol = (row, names) => {
        const keys = Object.keys(row);
        for (const name of names) {
          const found = keys.find(k => k.toLowerCase().trim() === name.toLowerCase());
          if (found !== undefined) return row[found];
        }
        return "";
      };

      usuarios = rows.map(r => ({
        nombre: String(findCol(r, ["Nombre", "Nombre y apellidos", "Nombre y Apellidos"])).trim(),
        apellidos: String(findCol(r, ["Apellidos", "apellidos", "Surname"])).trim(),
        username: normalizeUsername(String(findCol(r, ["Usuario", "usuario", "user"]))),
        pass: String(findCol(r, ["Contraseña", "Password", "contraseña", "password"])).trim(),
        rol: String(findCol(r, ["Rol", "rol", "role"])).trim().toLowerCase() || "profesor",
        // Como en la rama Séneca: el valor del fichero se NORMALIZA contra los
        // departamentos del centro (acentos, variantes, prefijos). Si el
        // departamento del fichero ya no existe en el centro (p. ej. eliminado
        // del listado), queda vacío y se puede asignar a mano después.
        departamento: _normalizarDepartamento(String(findCol(r, ["Departamento", "departamento", "Depto"])).trim()),
      })).filter(u => u.nombre && u.username && u.pass);

      if (usuarios.length === 0) {
        setProgress('<div class="text-red-600 text-sm">No se encontraron usuarios válidos. Revisa las columnas Nombre, Usuario y Contraseña.</div>');
        return;
      }
    }

    // Validación previa
    const errores = [];
    const seen = new Set();
    usuarios.forEach((u, i) => {
      if (u.nombre.length < 3) errores.push(`Fila ${i + 2}: nombre demasiado corto`);
      if (!isValidUsername(u.username)) errores.push(`Fila ${i + 2}: usuario "${escapeHtml(u.username)}" no válido (3-30 caracteres: minúsculas, números, punto, guion o guion bajo)`);
      if (u.pass.length < 6) errores.push(`Fila ${i + 2}: contraseña demasiado corta`);
      if (u.rol && !["profesor", "admin"].includes(u.rol)) errores.push(`Fila ${i + 2}: rol "${escapeHtml(u.rol)}" no válido (profesor o admin)`);
      if (u.departamento && !DEPARTAMENTOS.includes(u.departamento)) errores.push(`Fila ${i + 2}: departamento "${escapeHtml(u.departamento)}" no pertenece al centro`);
      if (seen.has(u.username)) errores.push(`Fila ${i + 2}: usuario "${escapeHtml(u.username)}" duplicado en el archivo`);
      seen.add(u.username);
    });
    if (errores.length > 0) {
      setProgress(`<div class="text-red-600 text-sm"><strong>Errores en el archivo:</strong><br>${errores.slice(0, 20).join("<br>")}${errores.length > 20 ? `<br>…y ${errores.length - 20} más` : ""}</div>`);
      return;
    }

    // Separar nuevos y existentes (por nombre de usuario)
    const findByUsername = (uname) => state.usuarios.find(u =>
      (u.username && normalizeUsername(u.username) === uname) ||
      (!u.username && localPartOf(u.email || "") === uname)
    );
    const toCreate = usuarios.filter(u => !findByUsername(u.username));
    const toUpdate = usuarios.filter(u => !!findByUsername(u.username));

    let creados = 0, recuperados = 0, actualizados = 0, sinCambios = 0, fallidos = 0;
    const log = [];
    // Bloquea re-renders de la vista mientras la importación trabaja (ver safeRenderMain)
    window._usuariosImportRunning = true;

    for (let i = 0; i < toCreate.length; i++) {
      const u = toCreate[i];
      setProgress(`<div class="text-blue-600 text-sm">Creando ${i + 1}/${toCreate.length}: ${escapeHtml(u.username)}…</div>`);
      try {
        const res = await createUsuarioByAdmin({ nombre: u.nombre, apellidos: u.apellidos || "", username: u.username, departamento: u.departamento, rol: u.rol, password: u.pass });
        if (res && res._recuperado) {
          // Cuenta Auth residual de un borrado anterior, reutilizada con la contraseña indicada.
          recuperados++;
          log.push(`↻ RECUPERADO: ${u.username} (${u.nombre}) — cuenta de acceso existente reutilizada, perfil recreado`);
          credenciales.push({ username: u.username, pass: u.pass });
        } else {
          creados++;
          log.push(`✓ NUEVO: ${u.username} (${u.nombre})`);
          credenciales.push({ username: u.username, pass: u.pass });
        }
      } catch (e) {
        fallidos++;
        log.push(`✗ ${u.username}: ${e.message || e.code || "error"}`);
      }
    }

    for (let i = 0; i < toUpdate.length; i++) {
      const u = toUpdate[i];
      setProgress(`<div class="text-blue-600 text-sm">Actualizando ${i + 1}/${toUpdate.length}: ${escapeHtml(u.username)}…</div>`);
      try {
        const existing = findByUsername(u.username);
        const existingUid = existing.uid || existing.id;
        const isSelf = existingUid === (state.user?.uid || "");
        // La importación marca a todo el mundo como profesor: jamás rebajar a un admin
        // (ni al propio admin que importa — actualiza su perfil y el snapshot del perfil
        // propio re-renderizaría la vista en mitad de la importación).
        const conservaAdmin = _importConservaAdmin(existing, u.rol, isSelf);
        const updates = {};
        const cambios = [];
        if ((existing.displayName || "") !== u.nombre) { updates.displayName = u.nombre; cambios.push("nombre"); }
        if (!conservaAdmin && (existing.role || "profesor") !== u.rol) {
          updates.role = u.rol;
          cambios.push("rol");
        }
        if ((existing.department || "") !== u.departamento) { updates.department = u.departamento; cambios.push("departamento"); }
        if ((existing.apellidos || "") !== (u.apellidos || "")) { updates.apellidos = u.apellidos || ""; cambios.push("apellidos"); }
        if (!existing.username) { updates.username = u.username; cambios.push("usuario de acceso"); }
        if (cambios.length > 0) {
          await updateUserProfile(existingUid, updates);
          if (!existing.username) {
            await ensureUsernameMapping({ uid: existingUid, email: existing.email || usernameToEmail(u.username), username: u.username });
          }
          actualizados++;
          log.push(`↻ ACTUALIZADO: ${u.username} (${cambios.join(", ")}${conservaAdmin ? "; rol admin conservado" : ""})`);
        } else {
          sinCambios++;
          log.push(`= SIN CAMBIOS: ${u.username}${conservaAdmin ? " (rol admin conservado)" : ""}`);
        }
      } catch (e) {
        fallidos++;
        log.push(`✗ ${u.username}: ${e.message || e.code || "error"}`);
      }
    }

    refreshUsuariosNow();
    window._importCredsText = credenciales.map(c => `${c.username} — ${c.pass}`).join("\n");
    setProgress(`
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm">
        <strong class="text-emerald-700">✓ ${creados} nuevos</strong>
        ${recuperados > 0 ? ` · <strong class="text-blue-700">↻ ${recuperados} recuperados (cuenta existente reutilizada)</strong>` : ""}
        ${actualizados > 0 ? ` · <strong class="text-blue-700">↻ ${actualizados} actualizados</strong>` : ""}
        ${sinCambios > 0 ? ` · <strong class="text-slate-500">= ${sinCambios} sin cambios</strong>` : ""}
        ${fallidos > 0 ? ` · <strong class="text-red-600">✗ ${fallidos} fallos</strong>` : ""}
        <br><br><strong>Detalle:</strong><br>
        ${log.map(l => escapeHtml(l)).join("<br>")}
      </div>
      ${omitidos.length > 0 ? `
      <div class="mt-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg p-2 leading-relaxed">
        <strong>Filas omitidas:</strong><br>${omitidos.map(escapeHtml).join("<br>")}
      </div>` : ""}
      ${credenciales.length > 0 ? `
      <div class="mt-2 bg-amber-50 border border-amber-200 rounded-lg p-3">
        <strong class="text-amber-800 text-sm">Contraseñas de los ${credenciales.length} usuarios nuevos</strong>
        <div class="text-xs text-slate-600 mt-0.5">Cópialas o guárdalas ahora: solo se muestran esta vez. Comunícaselas a cada persona para su primer acceso.</div>
        <div class="mt-2 font-mono text-xs bg-white border border-amber-200 rounded p-2 leading-relaxed max-h-48 overflow-auto">${credenciales.map(c => `${escapeHtml(c.username)} — ${escapeHtml(c.pass)}`).join("<br>")}</div>
        <button data-action="copy-import-creds" class="mt-2 px-3 py-1.5 rounded-md border border-amber-300 bg-white hover:bg-amber-100 text-xs font-medium">Copiar credenciales</button>
      </div>` : ""}`);
  } catch (e) {
    console.error("[_importUsuariosExcel] Error:", e);
    setProgress(`<div class="text-red-600 text-sm">Error al procesar el archivo: ${escapeHtml(e.message || String(e))}</div>`);
  } finally {
    window._usuariosImportRunning = false;
  }
};

window._saveEditUser = async () => {
  const uid = document.getElementById("edituser-uid").value;
  const nombre = document.getElementById("edituser-nombre").value.trim();
  const departamento = document.getElementById("edituser-departamento").value;
  const rol = document.querySelector('input[name="edituser-rol"]:checked')?.value || "profesor";
  const err = document.getElementById("edituser-error");
  err.classList.add("hidden");

  const u = state.usuarios.find(x => (x.uid || x.id) === uid);
  if (!u) { err.textContent = "No se encontró el usuario."; err.classList.remove("hidden"); return; }
  if (nombre.length < 3) { err.textContent = "Indica el nombre completo del profesor/a."; err.classList.remove("hidden"); return; }
  if (!departamento) { err.textContent = "Selecciona el departamento."; err.classList.remove("hidden"); return; }

  const eraAdminEdit = esUsuarioAdmin(u);

  const btn = document.getElementById("edituser-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Guardando…`;

  try {
    // Si el nombre cambió, recalcula la clave de apellidos: "Apellidos, Nombre" usa la
    // parte previa a la coma; en orden natural se vacía y la ordenación usa la heurística
    // (dos últimas palabras), que sigue al nombre editado.
    let apellidosEdit;
    if ((u.displayName || "") !== nombre) {
      const ci = nombre.indexOf(",");
      apellidosEdit = ci > 0 ? nombre.slice(0, ci).trim() : "";
    }
    const updatesEdit = { displayName: nombre, department: departamento, role: rol };
    if (apellidosEdit !== undefined) updatesEdit.apellidos = apellidosEdit;
    await updateUserProfile(uid, updatesEdit);
    window._closeEditUserDialog();
    const idx = state.usuarios.findIndex(x => (x.uid === uid || x.id === uid));
    if (idx >= 0) state.usuarios[idx] = { ...state.usuarios[idx], displayName: nombre, department: departamento, role: rol, updatedAt: Date.now(), ...(apellidosEdit !== undefined ? { apellidos: apellidosEdit } : {}) };
    // Bandera pública de "existe administrador": si el rol de admin ha cambiado con la
    // edición, recalcularla. Si tras el cambio NO queda ningún administrador, se inicia
    // el protocolo de creación (el panel reaparecerá en la pantalla de login).
    if (eraAdminEdit !== (rol === "admin")) {
      const quedanOtrosAdmins = state.usuarios.some(x => esUsuarioAdmin(x) && (x.uid || x.id) !== uid);
      if (rol === "admin" || quedanOtrosAdmins) {
        await markAdminExists();
      } else {
        await markNoAdmins();
        window._forzarProtocoloAdmin = true;
      }
    }
    refreshUsuariosNow();
    // Si el admin se edita a sí mismo, refrescar la cabecera
    if (uid === state.user?.uid) {
      state.userProfile = { ...(state.userProfile || {}), displayName: nombre, department: departamento, role: rol };
      renderAppShell();
    }
  } catch (e) {
    console.error("[_saveEditUser] Error:", e);
    err.textContent = "Error al guardar: " + (e.code || e.message) + ". Verifica las reglas de Firestore.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios`;
  }
};

window._genTempPass = () => {

  const chars = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let pass = "";
  for (let i = 0; i < 10; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
  const targets = ["nuPass", "nuPass2", "rp-pass", "rp-pass2"];
  targets.forEach((id) => {
    const el = document.getElementById(id);

};

window._saveNewUsuario = async () => {
  const nombre = document.getElementById("nuNombre")?.value.trim() || "";
  const username = normalizeUsername(document.getElementById("nuUser")?.value);
  const departamento = document.getElementById("nuDepto")?.value || "";
  const rol = document.getElementById("nuRol")?.value || "profesor";
  const password = document.getElementById("nuPass")?.value || "";
  const password2 = document.getElementById("nuPass2")?.value || "";
  const err = document.getElementById("nu-error");
  err.classList.add("hidden");
  const showError = (m) => { err.textContent = m; err.classList.remove("hidden"); };

  if (nombre.length < 3) { showError("Indica el nombre completo del profesor/a."); return; }
  if (!username) { showError("Indica el nombre de usuario con el que entrará (ej: mgarcia)."); return; }
  if (!isValidUsername(username)) { showError("El nombre de usuario no es válido (3-30 caracteres: letras minúsculas, números, punto, guion o guion bajo)."); return; }
  if (!departamento) { showError("Selecciona el departamento."); return; }
  if (password.length < 6) { showError("La contraseña debe tener al menos 6 caracteres."); return; }
  if (password !== password2) { showError("Las contraseñas no coinciden."); return; }

  // Comprobar disponibilidad del nombre de usuario (lista local + mapeo en Firestore)
  if (state.usuarios.some(u =>
    (u.username && normalizeUsername(u.username) === username) ||
    (!u.username && localPartOf(u.email || "") === username))) {
    showError(`El nombre de usuario "${username}" ya está en uso. Elige otro.`);
    return;
  }
  try {
    const taken = await getDoc(doc(db, USERNAMES_COLLECTION, username));
    if (taken.exists()) {
      // ¿Mapeo residual? Si el perfil al que apunta ya no existe (borrado), el
      // nombre está libre de facto y el alta lo re-vincula (misma cuenta Auth).
      const mappedUid = taken.data()?.uid || "";
      let perfilVivo = true;
      if (mappedUid) {
        try { perfilVivo = (await getDoc(doc(db, USUARIOS_COLLECTION, mappedUid))).exists(); } catch (e) { perfilVivo = true; }
      }
      if (perfilVivo) {
        showError(`El nombre de usuario "${username}" ya está en uso. Elige otro.`);
        return;
      }
      console.warn("[alta] Mapeo residual sin perfil para '" + username + "': nombre reutilizable.");
    }
  } catch (e) {
    console.warn("[_saveNewUsuario] No se pudo comprobar la disponibilidad:", e.code || e.message);
  }

  const btn = document.getElementById("nu-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Creando…`;

  try {
    await createUsuarioByAdmin({ nombre, username, departamento, rol, password });
    // Limpiar formulario
    ["nuNombre", "nuUser", "nuPass", "nuPass2"].forEach(id => { const el = document.getElementById(id); if (el) { el.value = ""; el.dataset.touched = ""; } });
    document.getElementById("nuDepto").value = "";
    document.getElementById("nuRol").value = "profesor";
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear usuario`;
    setTimeout(() => {
      alert(`Usuario creado correctamente.\n\nNombre: ${nombre}\nUsuario de acceso: ${username}\nDepartamento: ${departamento}\nRol: ${rol === "admin" ? "Administrador" : "Profesor/a"}\nContraseña: ${password}\n\nComunica estos datos al profesor/a por un canal seguro.`);
    }, 100);
    refreshUsuariosNow();
    setTimeout(() => refreshUsuariosNow(), 1500);
  } catch (e) {
    console.error("[_saveNewUsuario] Error:", e);
    const map = {
      "auth/email-already-in-use": "Ese nombre de usuario ya está en uso. Elige otro.",
      "auth/weak-password": "La contraseña es demasiado débil (mínimo 6 caracteres).",
      "auth/network-request-failed": "Sin conexión. Revisa tu red.",
      "auth/operation-not-allowed": "Firebase Authentication no tiene habilitado Email/Password.",
      "permission-denied": "Se creó la cuenta pero no se pudo guardar el perfil (revisa las reglas de Firestore).",
    };
    showError(e.code ? (map[e.code] || `Error: ${e.message}`) : (e.message || "Error desconocido"));
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear usuario`;
  }
};

window._confirmDeleteUsuario = async (uid, nombre) => {
  const confirmText = document.getElementById("deluser-confirm").value.trim();
  const err = document.getElementById("deluser-error");
  err.classList.add("hidden");
  if (confirmText !== "ELIMINAR") {
    err.textContent = "Debes escribir ELIMINAR (en mayúsculas) para confirmar.";
    err.classList.remove("hidden");
    return;
  }
  const btn = document.getElementById("deluser-btn");
  const esSelf = uid === state.user?.uid;
  const eraAdmin = esUsuarioAdmin(state.usuarios.find(x => (x.uid || x.id) === uid));
  const quedaraSinAdmins = eraAdmin && !state.usuarios.some(x => esUsuarioAdmin(x) && (x.uid || x.id) !== uid);
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Eliminando…`;
  try {
    // ANTES del borrado: si no va a quedar ningún administrador, bajar la bandera
    // pública ahora (la escritura necesita que el perfil del admin que borra aún
    // exista para que las reglas de Firestore autoricen el cambio).
    if (quedaraSinAdmins) {
      await markNoAdmins();
      window._forzarProtocoloAdmin = true;
    }
    const report = await deleteUsuarioCascade(uid);
    // Quitar el usuario de la lista local sin esperar al siguiente snapshot
    state.usuarios = state.usuarios.filter(x => (x.uid || x.id) !== uid);
    window._closeDeleteUsuarioDialog();
    let msg = `Usuario "${nombre}" eliminado.\n\n`;
    msg += `Evidencias Lector borradas: ${report.evidenciasLector}\n`;
    msg += `Evidencias RM borradas: ${report.evidenciasRM}\n`;
    msg += `Perfil eliminado: ${report.perfil ? "Sí" : "No"}\n`;
    if (report.errors.length > 0) {
      msg += `\nErrores parciales:\n${report.errors.join("\n")}\n`;
    }
    msg += `\nRecuerda: para eliminar la cuenta de acceso, ve a Firebase Console → Authentication → Users.`;
    if (quedaraSinAdmins) {
      msg += `\n\n⚠ No queda ningún administrador en el centro.`;
      msg += `\nAl cerrar la sesión se iniciará el protocolo para crear uno nuevo.`;
    }
    if (esSelf) {
      alert(msg);
      // Cuenta eliminada: cerrar sesión. onAuthStateChanged mostrará la pantalla
      // de login, con el protocolo de creación de administrador si no queda ninguno.
      await signOut(auth);
      return;
    }
    alert(msg);
    // Forzar refresco de datos
    refreshUsuariosNow();
    refreshEvidenciasNow("all");
  } catch (e) {
    console.error(e);
    err.textContent = `Error al eliminar: ${e.message || e.code || "desconocido"}`;
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> Eliminar definitivamente`;
  }
};

// =============================================================================
// Activa un modo en el que la tabla muestra una casilla por fila. El admin marca
// usuarios, pulsa «Eliminar seleccionados» y confirma escribiendo ELIMINAR. Cada
// usuario se borra con el MISMO borrado en cascada que el borrado individual
// (deleteUsuarioCascade: evidencias Lector/RM + perfil + mapeo usernames).
// Reglas de seguridad que respeta el proceso:
//   · La cuenta propia (si está marcada) se borra LA ÚLTIMA: las reglas de
//     Firestore exigen que el administrador que borra siga existiendo en
//     «usuarios» mientras elimina a los demás.
//   · Si entre los marcados están TODOS los administradores, se baja la bandera
//     pública config_public/bootstrap (hasAdmin=false) ANTES de borrar nada, para
//     que al cerrar la sesión la pantalla de acceso ofrezca automáticamente el
//     protocolo de creación del primer administrador.
//   · La operación se confirma escribiendo ELIMINAR y muestra un resumen final
//     (eliminados, evidencias borradas y fallos parciales, si los hubiera).

window._toggleBulkDeleteMode = () => {
  state.bulkDeleteMode = !state.bulkDeleteMode;
  if (!state.bulkDeleteMode) state.bulkSel.clear();
  _syncBulkUI();
  window._renderUsersTable && window._renderUsersTable();
};

// Sincroniza barra de acciones, columna de casillas y botón de activación con el
// estado del modo (sin re-render de la sección: los acordeones no se mueven).
function _syncBulkUI() {
  const on = !!state.bulkDeleteMode;
  const bar = document.getElementById("bulk-bar");
  if (bar) bar.classList.toggle("hidden", !on);
  const th = document.getElementById("th-bulk");
  if (th) th.classList.toggle("hidden", !on);
  const lbl = document.getElementById("btn-bulk-mode-label");
  if (lbl) lbl.textContent = on ? "Salir de la selección" : "Selección múltiple";
  const btn = document.getElementById("btn-bulk-mode");
  if (btn) {
    btn.classList.toggle("bg-red-600", on);
    btn.classList.toggle("text-white", on);
    btn.classList.toggle("hover:bg-red-700", on);
    btn.classList.toggle("border-red-600", on);
    btn.classList.toggle("bg-white", !on);
    btn.classList.toggle("text-red-700", !on);
    btn.classList.toggle("border-red-300", !on);
    btn.classList.toggle("hover:bg-red-50", !on);
  }
  _updateBulkBar();
}

// Refresca contador y estado del botón «Eliminar seleccionados»
function _updateBulkBar() {
  const c = document.getElementById("bulk-count");
  if (c) c.textContent = String(state.bulkSel.size);
  const del = document.getElementById("bulk-del-btn");
  if (del) del.disabled = state.bulkSel.size === 0;
}

// Marca/desmarca la casilla de una fila (invocado desde el onchange del checkbox)
window._bulkToggle = (cb) => {
  const uid = cb?.dataset?.uid;
  if (!uid) return;
  if (cb.checked) state.bulkSel.add(uid); else state.bulkSel.delete(uid);
  const tr = cb.closest("tr");
  if (tr) tr.classList.toggle("bg-red-50/70", cb.checked);
  _updateBulkBar();
};

// Selecciona los usuarios VISIBLES (los que pasan el buscador y el filtro de rol
// activos) REEMPLAZANDO la selección anterior, igual que hacen los botones absolutos
// «Todos» y «Todos menos yo». Con exceptMe=true se excluye la cuenta propia.
window._bulkSelectVisible = (exceptMe = false) => {
  state.bulkSel.clear();
  _usuariosVisiblesTabla().forEach((u) => {
    const uid = u.uid || u.id;
    if (exceptMe && uid === state.user?.uid) return;
    state.bulkSel.add(uid);
  });
  window._renderUsersTable && window._renderUsersTable();
  _updateBulkBar();
};

window._bulkClearSelection = () => {
  state.bulkSel.clear();
  window._renderUsersTable && window._renderUsersTable();
  _updateBulkBar();
};

window._closeBulkDeleteDialog = () => {
  document.getElementById("bulk-delete-dialog")?.remove();
};

window._openBulkDeleteDialog = () => {
  if (!isAdmin()) return;
  if (state.bulkSel.size === 0) return;
  document.getElementById("bulk-delete-dialog")?.remove();

  const uids = [...state.bulkSel];
  const sel = state.usuarios.filter((u) => uids.includes(u.uid || u.id));
  const nAdmins = sel.filter(esUsuarioAdmin).length;
  const adminsActuales = state.usuarios.filter(esUsuarioAdmin).map((u) => u.uid || u.id);
  const quedaraSinAdmins = adminsActuales.length > 0 && adminsActuales.every((uid) => state.bulkSel.has(uid));
  const incluyeSelf = !!state.user?.uid && state.bulkSel.has(state.user.uid);
  // Recuento sobre TODAS las evidencias (el borrado afecta a todos los cursos escolares)
  const evLector = sel.reduce((a, u) => a + _todasEvidenciasLector.filter((e) => e.createdBy === (u.uid || u.id)).length, 0);
  const evRM = sel.reduce((a, u) => a + _todasEvidenciasRM.filter((e) => e.createdBy === (u.uid || u.id)).length, 0);

  const lista = sel.slice().sort(_compareUsuariosPorApellidos).map((u) => {
    const uid = u.uid || u.id;
    const esAdmin = esUsuarioAdmin(u);
    const esSelf = uid === state.user?.uid;
    return `<li class="flex items-center justify-between gap-2 py-0.5">
      <span class="truncate">${escapeHtml(u.displayName || "Sin nombre")} <span class="font-mono text-[10px] text-slate-400">@${escapeHtml(u.username || "—")}</span>${esSelf ? ' <span class="text-[10px] text-blue-600 font-semibold">(tú)</span>' : ""}</span>
      ${esAdmin ? '<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 font-semibold shrink-0">Admin</span>' : ""}
    </li>`;
  }).join("");

  const overlay = document.createElement("div");
  overlay.id = "bulk-delete-dialog";
  overlay.className = "fixed inset-0 z-50 flex items-center justify-center p-3";

  overlay.innerHTML = `
    <div class="absolute inset-0 dialog-overlay" data-action="close-bulk-delete-dialog"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md sm:max-w-lg max-h-[90vh] overflow-y-auto fade-in">
      <div class="p-5 border-b border-slate-200">
        <h2 class="text-lg font-bold text-red-700 flex items-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Eliminación masiva de usuarios
        </h2>
        <p class="text-sm text-slate-500 mt-1">Esta acción no se puede deshacer.</p>
      </div>
      <div class="p-5 space-y-3">
        <div class="bg-red-50 border border-red-200 rounded-lg p-3">
          <p class="text-sm font-semibold text-red-800">Se eliminarán <strong>${uids.length}</strong> usuario(s):</p>
          <ul class="text-xs text-red-700 mt-2 max-h-36 overflow-y-auto list-none pl-1 space-y-0.5">${lista}</ul>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
          <p class="text-sm font-semibold text-slate-800 mb-2">Se eliminará permanentemente:</p>
          <ul class="text-xs text-slate-600 space-y-1 list-disc pl-5">
            <li><strong>${evLector}</strong> evidencia(s) del Plan Lector</li>
            <li><strong>${evRM}</strong> evidencia(s) del Plan de Razonamiento Matemático</li>
            <li>Los perfiles (departamento, rol, etc.) y los accesos por nombre de usuario</li>
          </ul>
        </div>

        ${nAdmins > 0 ? `
        <div class="bg-rose-50 border border-rose-200 rounded-lg p-3">
          <p class="text-xs font-semibold text-rose-800">${nAdmins} administrador${nAdmins === 1 ? "" : "es"} entre los seleccionados</p>
          ${quedaraSinAdmins
            ? '<p class="text-xs text-rose-700 mt-1">Al eliminarlos NO quedará ningún administrador. Al cerrar la sesión, la app iniciará automáticamente el <strong>protocolo de creación de un nuevo administrador</strong> en la pantalla de acceso.</p>'
            : '<p class="text-xs text-rose-700 mt-1">Seguirá quedando algún administrador en el centro.</p>'}
        </div>` : ""}

        ${incluyeSelf ? `
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
          <p class="text-xs font-semibold text-blue-800">Estás incluyendo tu propia cuenta</p>
          <p class="text-xs text-blue-700 mt-1">Tu cuenta se eliminará LA ÚLTIMA (las reglas exigen que el administrador siga existiendo mientras borra a los demás) y, al terminar, se cerrará tu sesión automáticamente.</p>
        </div>` : ""}

        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 flex items-start gap-2">
          <svg class="w-4 h-4 text-amber-600 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          <div class="text-xs text-amber-800">
            <p class="font-semibold">Importante: las cuentas de acceso seguirán existiendo</p>
            <p class="mt-1">Por seguridad, las cuentas de Firebase Authentication no se pueden eliminar desde la aplicación. Sin perfil, ya no podrán usar la aplicación aunque la cuenta siga existiendo.</p>
            <p class="mt-1.5">Para eliminarlas completamente, ve a <a href="https://console.firebase.google.com/project/iesvdv-96a18/authentication/users" target="_blank" rel="noopener" class="underline font-medium">Firebase Console → Authentication → Users</a> y bórralas manualmente.</p>

window._confirmBulkDelete = async () => {
  const confirmText = document.getElementById("bulkdel-confirm")?.value.trim();
  const err = document.getElementById("bulkdel-error");
  err.classList.add("hidden");
  if (confirmText !== "ELIMINAR") {
    err.textContent = "Debes escribir ELIMINAR (en mayúsculas) para confirmar.";
    err.classList.remove("hidden");
    return;
  }
  const btn = document.getElementById("bulkdel-btn");
  const selfUid = state.user?.uid;
  // Copia de la selección con la cuenta propia AL FINAL: las reglas de Firestore
  // exigen que el administrador que borra siga existiendo en «usuarios» mientras
  // elimina a los demás.
  const uids = [...state.bulkSel].sort((a, b) => (a === selfUid ? 1 : 0) - (b === selfUid ? 1 : 0));
  const incluyeSelf = !!selfUid && uids.includes(selfUid);
  const nombres = new Map(state.usuarios.map((u) => [u.uid || u.id, u.displayName || u.username || u.uid || "—"]));
  const adminsActuales = state.usuarios.filter(esUsuarioAdmin).map((u) => u.uid || u.id);
  const quedaraSinAdmins = adminsActuales.length > 0 && adminsActuales.every((uid) => state.bulkSel.has(uid));

  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60" stroke-dashoffset="20"/></svg> Preparando…`;

  // Si va a quedar el centro sin administradores, bajar la bandera pública AHORA
  // (la escritura necesita que el perfil del admin que borra aún exista).
  if (quedaraSinAdmins) {
    try {
      await markNoAdmins();
      window._forzarProtocoloAdmin = true;
    } catch (e) {
      console.warn("[bulk-delete] No se pudo bajar la bandera hasAdmin:", e?.code || e?.message);
    }
  }

  const resultados = [];
  for (let i = 0; i < uids.length; i++) {
    const uid = uids[i];
    btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60" stroke-dashoffset="20"/></svg> Eliminando ${i + 1}/${uids.length}…`;
    try {
      const rep = await deleteUsuarioCascade(uid);
      resultados.push({ uid, ok: !!rep.perfil && rep.errors.length === 0, rep });
    } catch (e) {
      resultados.push({ uid, ok: false, rep: { perfil: false, evidenciasLector: 0, evidenciasRM: 0, errors: [String(e?.code || e?.message || e)] } });
    }
    // Optimismo local: quitar de la lista y de la selección. El diálogo sigue
    // abierto, así que renderUsuariosDynamic no pisa la tabla hasta el final.
    state.usuarios = state.usuarios.filter((x) => (x.uid || x.id) !== uid);
    state.bulkSel.delete(uid);
  }

  window._closeBulkDeleteDialog();

  const ok = resultados.filter((r) => r.ok);
  const fallidos = resultados.filter((r) => !r.ok);
  const totLector = ok.reduce((a, r) => a + (r.rep.evidenciasLector || 0), 0);
  const totRM = ok.reduce((a, r) => a + (r.rep.evidenciasRM || 0), 0);
  const selfBorrado = incluyeSelf && resultados.some((r) => r.uid === selfUid && r.ok);

  let msg = `Eliminación masiva completada.\n\nUsuarios eliminados: ${ok.length} de ${uids.length}\nEvidencias Lector borradas: ${totLector}\nEvidencias RM borradas: ${totRM}\n`;
  if (fallidos.length > 0) {
    msg += `\nNO se pudieron eliminar (${fallidos.length}):\n`;
    fallidos.forEach((r) => {
      msg += `· ${nombres.get(r.uid) || r.uid}: ${(r.rep.errors && r.rep.errors[0]) || "error desconocido"}\n`;
    });
  }
  msg += `\nRecuerda: las cuentas de acceso solo se pueden eliminar desde Firebase Console → Authentication → Users.`;
  if (quedaraSinAdmins && ok.length > 0) {
    msg += `\n\n⚠ No queda ningún administrador en el centro.`;
    msg += `\nAl cerrar la sesión se iniciará el protocolo para crear uno nuevo.`;
  }

  if (fallidos.length > 0) {
    // Reintentos: permanecer en el modo con los fallidos ya marcados
    state.bulkDeleteMode = true;
    fallidos.forEach((r) => state.bulkSel.add(r.uid));
  } else {
    state.bulkDeleteMode = false;
    state.bulkSel.clear();
  }
  _syncBulkUI();
  window._renderUsersTable && window._renderUsersTable();

  alert(msg);

  if (selfBorrado) {
    // La propia cuenta se eliminó: cerrar sesión. onAuthStateChanged mostrará la
    // pantalla de acceso (con el protocolo de nuevo admin si no queda ninguno).
    await signOut(auth);
    return;
  }
  // Refrescar datos (usuarios + evidencias) y sincronizar contador de cabecera
  refreshUsuariosNow();
  refreshEvidenciasNow("all");
  const cnt = document.getElementById("usuarios-count");
  if (cnt) cnt.textContent = String(state.usuarios.length);
  const listadoCnt = document.getElementById("acc-listado-count");
  if (listadoCnt) listadoCnt.textContent = String(state.usuarios.length);
};

window._setCursoActivo = (cursoId) => {
  if (!cursoId || cursoId === "auto") {
    state.forcedCursoId = null;
    try { localStorage.removeItem("forcedCursoId"); } catch (e) {}
  } else {
    state.forcedCursoId = cursoId;
    try { localStorage.setItem("forcedCursoId", cursoId); } catch (e) {}
  }
  // Re-filtrar las evidencias para mostrar solo las del curso activo elegido
  filtrarEvidenciasPorCursoActivo();
  // Forzar re-render completo de la shell
  // Usar setTimeout(0) para asegurar que el state se actualiza antes del render
  setTimeout(() => {
    renderAppShell();
  }, 0);
};

window._importProfesores = async (destinoId, origenId) => {
  if (!confirm(`¿Importar el profesorado del curso ${origenId} al curso ${destinoId}?\n\nEsto añadirá a todos los profesores asignados en ${origenId} al curso ${destinoId}.`)) return;
  try {
    const profesoresOrigen = state.profesoresPorCurso[origenId] || [];
    if (profesoresOrigen.length === 0) {
      alert(`El curso ${origenId} no tiene profesores asignados. No hay nada que importar.`);
      return;
    }
    // Combinar con los existentes en destino (sin duplicados)
    const profesoresDestino = state.profesoresPorCurso[destinoId] || [];
    const combined = Array.from(new Set([...profesoresDestino, ...profesoresOrigen]));
    // Guardar en Firestore
    await setDoc(doc(db, "curso_profesores", destinoId), {
      cursoId: destinoId,
      profesores: combined,
      updatedAt: Date.now(),
    }, { merge: true });
    state.profesoresPorCurso[destinoId] = combined;
    alert(`Importados ${profesoresOrigen.length} profesor(es) de ${origenId} a ${destinoId}.\n\nTotal profesores en ${destinoId}: ${combined.length}`);
    renderMain();
  } catch (e) {
    console.error(e);
    alert(`Error al importar profesores: ${e.message || e.code || "desconocido"}`);
  }
};

window._saveCursoProfesores = async () => {
  const err = document.getElementById("curso-prof-error");
  err.classList.add("hidden");
  const holder = document.getElementById("curso-prof-curso-id-holder");
  const cursoId = holder?.dataset.cursoId;
  if (!cursoId) { err.textContent = "No se pudo determinar el curso."; err.classList.remove("hidden"); return; }

  const checked = Array.from(document.querySelectorAll('#curso-prof-list input[type="checkbox"]:checked'))
    .map(cb => cb.dataset.ref).filter(Boolean);
  const manual = String(document.getElementById("curso-prof-manual")?.value || "")
    .split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  const list = Array.from(new Set([...checked, ...manual]));

  const btn = document.getElementById("curso-prof-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Guardando…`;
  try {
    await setDoc(doc(db, "curso_profesores", cursoId), {
      cursoId,
      profesores: list,
      updatedAt: Date.now(),
    }, { merge: true });
    // Actualizar el estado local al instante (la suscripción lo confirmará)
    state.profesoresPorCurso[cursoId] = list;
    window._closeCursoProfesoresDialog();
    renderMain();
    setTimeout(() => alert(`Profesorado del curso ${cursoId} actualizado (${list.length} asignado/s).`), 80);
  } catch (e) {
    console.error("[_saveCursoProfesores] Error:", e);
    err.textContent = "Error al guardar: " + (e.code || e.message) + ". Comprueba las reglas de Firestore para 'curso_profesores'.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar asignación`;
  }
};

window._createCurso = async () => {
  const yearStr = document.getElementById("curso-year").value;
  const year = parseInt(yearStr);
  const err = document.getElementById("curso-error");
  err.classList.add("hidden");
  if (!year || year < 2025 || year > 2099) {
    err.textContent = "Introduce un año válido entre 2025 y 2099.";
    err.classList.remove("hidden");
    return;
  }
  const label = `${year}-${year + 1}`;
  if (state.cursos.some(c => c.id === label)) {
    err.textContent = `El curso ${label} ya existe.`;
    err.classList.remove("hidden");
    return;
  }
  const { start, end } = getSchoolYearBounds(label);
  const planStart = computePlanStartForYear(label);
  const planEndD = normalizeDate(planStart);
  planEndD.setDate(planEndD.getDate() + 36 * 7 + 4);
  const planEnd = dateToISO(planEndD);
  const evaluaciones = generateEvaluacionesForCurso({ planStart, planEnd });

  const btn = document.getElementById("curso-create-btn");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Creando…`;
  try {
    await createCurso({ id: label, label, start, end, planStart, planEnd, evaluaciones });
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear curso`;
    renderMain();
  } catch (e) {
    console.error(e);
    err.textContent = "Error al crear el curso. Inténtalo de nuevo.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear curso`;
  }
};

window._deleteCurso = async (id) => {

  try {

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-slate-600 leading-relaxed">
          Al cambiar las fechas de inicio o fin, las <strong>semanas se recalculan automáticamente</strong> (criterio del centro: la semana de la fecha de inicio cuenta como la 1ª). Después puedes ajustar las semanas a mano si lo necesitas.
        </div>

        <div id="cal-summary" class="text-sm"></div>
        <div id="cal-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"></div>
      </div>

      <div class="p-4 border-t border-slate-200 flex justify-end gap-2 sticky bottom-0 bg-white rounded-b-2xl">
        <button data-action="close-calendario-dialog" class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-medium">Cancelar</button>
        <button data-action="save-calendario" class="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white text-sm font-semibold flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar calendario
        </button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  window._calRenderRows();
  window._calUpdateSummary();

  // Delegación de eventos: recalcular semanas al cambiar fechas, sincronizar el borrador
  overlay.addEventListener("input", (e) => {
    const t = e.target;
    if (!t.id) return;
    const mStart = t.id.match(/^cal-ev-start-(\d+)$/);
    const mEnd = t.id.match(/^cal-ev-end-(\d+)$/);
    if (mStart || mEnd) {
      const i = parseInt((mStart || mEnd)[1], 10);
      const s = document.getElementById(`cal-ev-start-${i}`)?.value || "";
      const en = document.getElementById(`cal-ev-end-${i}`)?.value || "";
      const auto = computeWeeksFromRange(s, en);
      if (auto > 0) {
        const wInput = document.getElementById(`cal-ev-weeks-${i}`);
        if (wInput) wInput.value = auto;
        if (window._calDraft?.evals[i]) window._calDraft.evals[i].weeks = auto;
      }
    }
    window._calSyncFromDOM();
    window._calUpdateSummary();
  });
};

// Pinta las filas de evaluaciones a partir del borrador
window._calRenderRows = () => {
  const box = document.getElementById("cal-rows");
  if (!box || !window._calDraft) return;
  const canRemove = window._calDraft.evals.length > 1;
  box.innerHTML = window._calDraft.evals.map((ev, i) => `
    <div class="bg-white border border-slate-200 rounded-xl p-3">
      <div class="flex items-center justify-between gap-2 mb-2">
        <span class="text-xs font-bold text-indigo-700">Evaluación ${i + 1}</span>
        <button data-action="cal-remove-ev" data-idx="${i}" ${canRemove ? "" : "disabled"} class="text-[11px] px-2 py-1 rounded-md border ${canRemove ? "border-red-200 bg-red-50 text-red-600 hover:bg-red-100" : "border-slate-200 bg-slate-50 text-slate-300 cursor-not-allowed"} transition">Quitar</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-[1fr_auto_auto_auto] gap-2 items-end">
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Nombre</label>
          <input id="cal-ev-name-${i}" type="text" value="${escapeHtml(ev.name || "")}" placeholder="Ej: Primera Evaluación" class="w-full h-10 px-3 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Inicio</label>
          <input id="cal-ev-start-${i}" type="date" value="${escapeHtml(ev.start || "")}" class="w-full sm:w-[150px] h-10 px-2 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Fin</label>
          <input id="cal-ev-end-${i}" type="date" value="${escapeHtml(ev.end || "")}" class="w-full sm:w-[150px] h-10 px-2 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Semanas</label>
          <input id="cal-ev-weeks-${i}" type="number" min="1" max="60" value="${parseInt(ev.weeks, 10) || 1}" class="w-full sm:w-[90px] h-10 px-2 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm font-semibold" />
        </div>
      </div>
    </div>`).join("");
};

// Lee los valores actuales del formulario y los guarda en el borrador
window._calSyncFromDOM = () => {
  const d = window._calDraft;
  if (!d) return;
  const ps = document.getElementById("cal-plan-start")?.value;
  const pe = document.getElementById("cal-plan-end")?.value;
  if (ps !== undefined) d.planStart = ps;
  if (pe !== undefined) d.planEnd = pe;
  d.evals.forEach((ev, i) => {
    ev.name = document.getElementById(`cal-ev-name-${i}`)?.value ?? ev.name;
    ev.start = document.getElementById(`cal-ev-start-${i}`)?.value ?? ev.start;
    ev.end = document.getElementById(`cal-ev-end-${i}`)?.value ?? ev.end;
    const w = parseInt(document.getElementById(`cal-ev-weeks-${i}`)?.value, 10);
    if (Number.isFinite(w) && w >= 1) ev.weeks = w;
  });
};

// Validación: devuelve una lista de errores (bloquean el guardado) y de avisos (informativos)
window._calValidate = () => {
  const d = window._calDraft;
  const errors = [];
  const warnings = [];
  if (!d) return { errors: ["El diálogo no está inicializado."], warnings };
  if (!d.planStart || !d.planEnd) errors.push("Indica las fechas del plan del curso.");
  else if (normalizeDate(d.planEnd) < normalizeDate(d.planStart)) errors.push("El fin del plan no puede ser anterior a su inicio.");

  const evals = d.evals;
  if (evals.length === 0) errors.push("Debe haber al menos una evaluación.");
  evals.forEach((ev, i) => {
    const label = ev.name?.trim() || `Evaluación ${i + 1}`;
    if (!ev.start || !ev.end) errors.push(`${label}: faltan fechas de inicio o fin.`);
    else if (normalizeDate(ev.end) < normalizeDate(ev.start)) errors.push(`${label}: la fecha de fin es anterior a la de inicio.`);
    if (!(parseInt(ev.weeks, 10) >= 1)) errors.push(`${label}: las semanas deben ser 1 o más.`);
  });

  // Solapamientos (ordenadas por fecha de inicio)
  const sorted = evals.map((ev, i) => ({ ...ev, i })).filter(ev => ev.start && ev.end).sort((a, b) => normalizeDate(a.start) - normalizeDate(b.start));
  for (let k = 1; k < sorted.length; k++) {
    const prev = sorted[k - 1], cur = sorted[k];
    if (normalizeDate(cur.start) <= normalizeDate(prev.end)) {
      errors.push(`«${prev.name?.trim() || `Evaluación ${prev.i + 1}`}» y «${cur.name?.trim() || `Evaluación ${cur.i + 1}`}» se solapan en el calendario.`);
    }
  }

  // Avisos no bloqueantes
  if (d.planStart) {
    const ps = normalizeDate(d.planStart);
    if (!isNaN(ps.getTime()) && ps.getDay() !== 1) warnings.push("El inicio del plan no cae en lunes: las semanas correrán de ese día en adelante (se recomienda lunes).");
  }
  return { errors, warnings: warnings.filter(Boolean) };
};

// Resumen en vivo: total de semanas y estado de validación
window._calUpdateSummary = () => {
  const box = document.getElementById("cal-summary");
  if (!box || !window._calDraft) return;
  window._calSyncFromDOM();
  const d = window._calDraft;
  const total = totalWeeksOfEvals(d.evals);
  const { errors, warnings } = window._calValidate();
  const chips = d.evals.map((ev, i) => {
    const w = parseInt(ev.weeks, 10) || 0;
    const ok = ev.start && ev.end && normalizeDate(ev.end) >= normalizeDate(ev.start);
    return `<span class="text-[11px] px-2 py-0.5 rounded-full ${ok ? "bg-white border border-indigo-200 text-slate-700" : "bg-red-50 border border-red-200 text-red-600"}">${escapeHtml(ev.name?.trim() || `Evaluación ${i + 1}`)}: ${w} sem</span>`;
  }).join(" ");
  box.innerHTML = `
    <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 space-y-1.5">
      <p class="text-sm font-semibold text-slate-800">Total del plan: <span class="text-indigo-700">${total} semanas</span></p>
      <div class="flex flex-wrap gap-1.5">${chips}</div>
      ${warnings.map(w => `<p class="text-[11px] text-amber-700">⚠️ ${escapeHtml(w)}</p>`).join("")}
      ${errors.length ? `<ul class="list-disc pl-5 text-[11px] text-red-600 space-y-0.5">${errors.map(e => `<li>${escapeHtml(e)}</li>`).join("")}</ul>` : `<p class="text-[11px] text-emerald-700 font-medium">✓ El calendario es coherente y se puede guardar.</p>`}
    </div>`;
  return { errors, warnings };
};

window._calAddEv = () => {
  const d = window._calDraft;
  if (!d) return;
  window._calSyncFromDOM();
  // Nueva evaluación a continuación de la última (misma duración que la anterior)
  const last = d.evals[d.evals.length - 1];
  let start = "";
  if (last?.end) {
    const s = normalizeDate(last.end);
    s.setDate(s.getDate() + 3); // pequeño hueco, mismo criterio que el generador por defecto
    start = dateToISO(s);
  }
  const weeks = Math.max(1, parseInt(last?.weeks, 10) || 11);
  let end = "";
  if (start) {
    const e = normalizeDate(start);
    e.setDate(e.getDate() + Math.max(0, (weeks - 1) * 7));
    end = dateToISO(e);
  }
  d.evals.push({ name: `Evaluación ${d.evals.length + 1}`, start, end, weeks });
  window._calRenderRows();
  window._calUpdateSummary();
};

window._calRemoveEv = (idx) => {
  const d = window._calDraft;
  if (!d || d.evals.length <= 1) return;
  window._calSyncFromDOM();
  d.evals.splice(idx, 1);
  window._calRenderRows();
  window._calUpdateSummary();
};

window._calResetDefault = () => {
  const d = window._calDraft;
  if (!d) return;
  window._calSyncFromDOM();
  const planStart = d.planStart || computePlanStartForYear(d.cursoId);
  if (!planStart) { alert("No se pudo determinar el inicio del plan."); return; }
  d.planStart = planStart;
  const peInput = document.getElementById("cal-plan-start");
  if (peInput) peInput.value = planStart;
  // «Por defecto» = calendario incluido en DEFAULT_CURSOS para ese curso (p. ej. el
  // histórico 14/11/11 de 2025-2026 o el equivalente de 2026-2027); si no hay default,
  // se genera 14/11/11 desde el inicio del plan.
  const defCurso = DEFAULT_CURSOS.find(c => c.id === d.cursoId);
  const base = (defCurso?.evaluaciones?.length ? defCurso.evaluaciones : generateEvaluacionesForCurso({ planStart }));
  d.evals = base.map(e => ({ name: e.name || "", start: e.start || "", end: e.end || "", weeks: parseInt(e.weeks, 10) || computeWeeksFromRange(e.start, e.end) || 1 }));
  window._calRenderRows();
  window._calUpdateSummary();
};

window._closeCalendarioDialog = () => {
  document.getElementById("calendario-dialog")?.remove();
  window._calDraft = null;
};

window._saveCalendario = async () => {
  const d = window._calDraft;
  if (!d) return;
  window._calSyncFromDOM();
  const { errors } = window._calValidate();
  const errBox = document.getElementById("cal-error");
  if (errors.length) {
    errBox.textContent = "No se puede guardar: " + errors.join(" ");
    errBox.classList.remove("hidden");
    return;
  }
  errBox.classList.add("hidden");

  // Aviso si el inicio del plan no es lunes (no bloquea)
  const ps = normalizeDate(d.planStart);
  if (!isNaN(ps.getTime()) && ps.getDay() !== 1) {
    if (!confirm("El inicio del plan no cae en lunes. ¿Guardar de todos modos?")) return;
  }

  // Nombres por defecto si se dejaron vacíos
  const evaluaciones = d.evals.map((ev, i) => ({
    name: ev.name?.trim() || `Evaluación ${i + 1}`,
    start: ev.start,
    end: ev.end,
    weeks: parseInt(ev.weeks, 10) || 1,
  }));

  try {
    // setDoc con merge: conserva start/end del curso escolar, createdAt, etc.
    await setDoc(doc(db, CURSOS_COLLECTION, d.cursoId), {
      planStart: d.planStart,
      planEnd: d.planEnd,
      evaluaciones,
      updatedAt: Date.now(),
    }, { merge: true });
    // Actualizar la copia local mientras llega la suscripción
    const local = state.cursos.find(c => c.id === d.cursoId);
    if (local) { local.planStart = d.planStart; local.planEnd = d.planEnd; local.evaluaciones = evaluaciones; }
    window._closeCalendarioDialog();
    renderMain();
  } catch (e) {
    console.error("[saveCalendario] Error:", e);
    errBox.textContent = "Error al guardar en Firestore: " + (e.code || e.message) + ". Revisa las reglas de la colección " + CURSOS_COLLECTION + ".";
    errBox.classList.remove("hidden");
  }
};

function attachHandlers() {
  // Inicializar el contenedor de fechas del informe si estamos en esa vista
  if (state.view.name === "informes") {
    window._renderFechasContainer();
  }
  // Poblar la tabla de usuarios (la vista solo devuelve el HTML; las filas se
  // insertan aquí, después de montar la vista en el DOM). Sin esto, el listado
  // aparecería vacío aunque hubiera usuarios registrados.
  if (state.view.name === "gestion-usuarios") {
    window._renderUsersTable && window._renderUsersTable();
  }
}

// Restaurar curso forzado desde localStorage (si el admin lo estableció)
try {
  const saved = localStorage.getItem("forcedCursoId");
  if (saved) state.forcedCursoId = saved;
} catch (e) { console.warn("No se pudo leer forcedCursoId:", e); }

// Auth state observer
onAuthStateChanged(auth, async (user) => {
  // Capturar el usuario local para evitar race conditions
  const localUser = user;
  state.user = localUser;
  window._sesionHuerfanaGestionada = false;
  if (localUser) {
    // v2.17: tras el login (venga o no de un logout) la app SIEMPRE comienza en
    // «Inicio». Antes, state.view conservaba la última vista de la sesión anterior
    // (del usuario que cerró sesión, que puede ser otro distinto): quien salió
    // estando en Informes o en un curso volvía a entrar directamente ahí, y si el
    // usuario nuevo no es admin caía en «Acceso restringido». Se resetean también
    // los estados efímeros de vista (el mismo reset que hace _go) y el modo de
    // borrado masivo, para que cada sesión empiece limpia.
    state.view = { name: "home" };
    state.navHistory = []; // cada sesión empieza sin historial de «Volver» (v2.24)
    state.openEvals = new Set();
    state.filter = { type: "all", value: "" };
    state.showReports = false;
    state.showHelp = {};
    state.bulkDeleteMode = false;
    state.bulkSel = new Set();
    state.informeConfig = { period: "semanal" };
    try { window.scrollTo(0, 0); } catch (e) { /* sin scroll disponible */ }
    try {
      const profile = await ensureUserProfile(localUser);
      // Verificar que el usuario no haya cambiado durante el await
      if (state.user !== localUser) return;
      state.userProfile = profile;
      // Si durante el arranque falló alguna operación de acceso por reglas
      // desactualizadas, ahora ya se sabe el rol: mostrar el aviso si es admin.
      _mostrarAvisoReglasSiToca();
      // v2.13: si la lista de usuarios ya está cargada, migrar ya los renombres de
      // departamento (antes de este punto puede no conocerse aún el rol).
      _migrarDepartamentosFirestore(state.usuarios).catch((e) => console.warn("[migración departamentos]", e));
    } catch (e) {
      if (state.user !== localUser) return;
      console.error("Error cargando perfil:", e);
      state.userProfile = {
        id: localUser.uid, uid: localUser.uid, email: localUser.email || "",
        displayName: localUser.displayName || "Profesor/a", role: "profesor", department: "",
      };
    }
  } else {
    state.userProfile = null;
  }
  state.loading = false;
  setupGlobalSync();
  render();
});

// NOTA: Las suscripciones a Firestore se configuran en setupGlobalSync() dentro del
// onAuthStateChanged anterior. Esto garantiza que se re-crean cada vez que el usuario
// inicia sesión, con los permisos correctos.

// =============================================================================
// AVISO DE VERSIÓN NUEVA (PWA desactualizada)
// =============================================================================
// Compara la versión en ejecución con la del fichero desplegado (fetch sin caché).
// Si difieren, el dispositivo está ejecutando una copia antigua guardada por el
// service worker: se muestra un aviso persistente con botón de recarga. Así se
// evita el clásico "no veo los cambios" por caché de la PWA.
function _showUpdateBanner(deployed) {
  if (document.getElementById("update-banner")) return;
  const bar = document.createElement("div");
  bar.id = "update-banner";
  bar.className = "fixed bottom-0 inset-x-0 z-[60] bg-amber-500 text-white shadow-lg";
  bar.innerHTML = `
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex flex-wrap items-center gap-2 text-sm">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="font-semibold">Versión nueva disponible (v${escapeHtml(deployed)}).</span>
      <span class="opacity-90">Estás viendo la v${escapeHtml(APP_VERSION)} guardada en caché.</span>
      <button id="btn-update-reload" class="ml-auto px-3 py-1.5 rounded-lg bg-white/95 hover:bg-white text-amber-700 text-xs font-bold">Recargar ahora</button>
    </div>`;
  document.body.appendChild(bar);
  const btn = document.getElementById("btn-update-reload");
  if (btn) btn.onclick = () => location.reload();
}

async function _checkDeployedVersion() {
  try {
    if (location.protocol === "file:") return; // sin servidor no hay versión desplegada
    const base = location.href.split("#")[0];
    const url = base + (base.includes("?") ? "&" : "?") + "nc=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return;
    const txt = await res.text();
    const m = txt.match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] && m[1] !== APP_VERSION) _showUpdateBanner(m[1]);
  } catch (e) { /* silencio: offline o entorno sin servidor */ }
}
setTimeout(_checkDeployedVersion, 2500);
setInterval(_checkDeployedVersion, 120000);

// =============================================================================
// MANIFEST PWA (construido por JS)
// =============================================================================
// Un data: URI estático con JSON "crudo" lo rompe el navegador: al resolver la
// URL, el carácter «#» de los colores (#ffffff) abre un FRAGMENTO de URL y el
// JSON llega truncado ("Manifest: Line 1, column 121, Syntax error").
// Construirlo aquí con encodeURIComponent garantiza un JSON válido.
(function _buildManifest() {
  const link = document.getElementById("manifest-link");
  if (!link) return;
  const iconSvg = (size, rx, fontSize, textY) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}">` +
    `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">` +
    `<stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#10b981"/>` +
    `</linearGradient></defs>` +
    `<rect width="${size}" height="${size}" rx="${rx}" fill="url(#g)"/>` +
    `<text x="${size / 2}" y="${textY}" font-family="Arial" font-size="${fontSize}" font-weight="bold" fill="white" text-anchor="middle">ñ+π</text></svg>`;
  const icon = (size, rx, fontSize, textY) => ({
    src: "data:image/svg+xml," + encodeURIComponent(iconSvg(size, rx, fontSize, textY)),
    sizes: `${size}x${size}`,
    type: "image/svg+xml",
    purpose: "any",
  });
  const manifest = {
    name: "Planes IES — Lector y RM",
    short_name: "Planes IES",
    start_url: ".",
    display: "standalone",
    background_color: "#ffffff",
    theme_color: "#3f51b5",
    lang: "es-ES",
    orientation: "any",
    icons: [icon(192, 42, 84, 126), icon(512, 112, 224, 336)],
  };
  link.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
})();

// Service Worker externo (sw.js). Solo se registra servido por http(s): desde
// file:// el navegador rechaza el registro (origen 'null') y solo llenaría la
// consola de errores.
const _swRegistrable = "serviceWorker" in navigator &&
  (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1");
if ("serviceWorker" in navigator && location.protocol === "file:") {
  console.info("[SW] Sin registro: la app se está ejecutando como archivo local (file://). Ábrela desde GitHub Pages o un servidor local para tener PWA, caché y aviso de versiones.");
}
if (_swRegistrable) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => {
        if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
      })
      .catch(err => console.warn("[SW] Registro fallido:", err));
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!window._swReloaded) {
      window._swReloaded = true;
      window.location.reload();
    }
  });
}

// Render inicial
console.info(`[nmaspi] Gestión de usuarios v${APP_VERSION} — alta y acceso solo con usuario y contraseña.`);
render();
</script>
