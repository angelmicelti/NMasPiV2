document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  try {
    switch (action) {
      // --- Gestión de usuarios: el admin crea las cuentas ---
      case "close-edit-user-dialog":
        window._closeEditUserDialog && window._closeEditUserDialog();
        break;
      case "save-edit-user":
        window._saveEditUser && window._saveEditUser();
        break;
      case "save-new-usuario":

      case "gen-temp-pass":

        break;

      case "gen-import-pass":
        window._genImportPass && window._genImportPass();
        break;
      case "copy-import-creds":
        window._copyImportCreds && window._copyImportCreds(btn);

        window._openEditUserDialog && window._openEditUserDialog(btn.dataset.uid, btn.dataset.nombre, btn.dataset.email, btn.dataset.departamento, btn.dataset.role, btn.dataset.username);

      case "reset-pass":
        window._openResetPassDialog && window._openResetPassDialog(btn.dataset.uid);
        break;
      case "close-reset-pass-dialog":
        window._closeResetPassDialog && window._closeResetPassDialog();
        break;
      case "confirm-reset-pass":
        window._confirmResetPass && window._confirmResetPass(btn.dataset.uid);

      case "delete-user":
        window._openDeleteUsuarioDialog && window._openDeleteUsuarioDialog(btn.dataset.uid, btn.dataset.nombre, btn.dataset.email, btn.dataset.username);
        break;
      case "close-delete-user-dialog":
        window._closeDeleteUsuarioDialog && window._closeDeleteUsuarioDialog();
        break;
      case "confirm-delete-usuario":
        window._confirmDeleteUsuario && window._confirmDeleteUsuario(btn.dataset.uid, btn.dataset.nombre);
        break;
      // --- Eliminación masiva de usuarios (solo admin) ---

        window._toggleBulkDeleteMode && window._toggleBulkDeleteMode();
        break;
      case "bulk-select-all":
        window._bulkSelectVisible && window._bulkSelectVisible(false);

      case "bulk-select-except-me":

      case "edit-ev-lector":

        break;
      case "view-ev-lector":

      case "fb-mode-list":

        break;
      case "save-feedback":

        break;

        break;
      case "fb-delete":

        window._viewEvidenciaRM && window._viewEvidenciaRM(btn.dataset.id, btn.dataset.sesion, btn.dataset.materia, btn.dataset.actividad, btn.dataset.codigo);
        break;
      case "close-ev-rm":
        window._closeEvRMDialog && window._closeEvRMDialog();
        break;
      case "save-ev-rm":
        window._saveEvRM && window._saveEvRM();
        break;
      case "delete-ev-rm":
        window._deleteEvRM && window._deleteEvRM();
        break;
      // --- Informes PDF (vista RM) ---
      case "generate-subject-pdf":
        window._generateSubjectPDF && window._generateSubjectPDF(btn.dataset.cursoId, btn.dataset.cursoNombre);
        break;
      case "generate-trimestre-pdf":
        window._generateTrimestrePDF && window._generateTrimestrePDF(btn.dataset.cursoId, btn.dataset.cursoNombre);
        break;
      default:
        console.warn("[click] Acción no reconocida:", action);
    }
  } catch (err) {
    console.error("[click] Error en acción '" + action + "':", err);
    alert("Error al ejecutar '" + action + "': " + (err.message || err));
  }
});

// Helper: escapar HTML para prevenir XSS en datos introducidos por usuarios
function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Función: obtener una actividad de Lengua específica del curso, seleccionada aleatoriamente
function getActividadLenguaRM(cursoId, weekNum) {
  const actividades = ACTIVIDADES_LENGUA_RM[cursoId];
  if (!actividades || actividades.length === 0) return null;
  // Usar weekNum como semilla para que cada semana tenga una actividad distinta pero determinista
  const idx = (weekNum - 1) % actividades.length;
  return actividades[idx];
}

// Renombres de departamentos: el nombre ANTIGUO que llegue en un fichero de
// importación o que siga guardado en perfiles creados antes del renombre se
// normaliza al nombre vigente. La clave es el nombre antiguo tal cual se guardó.
const DEPARTAMENTOS_ALIAS = {
  "Geografía e Historia": "Geografía, Historia y Religión",
};

// Normaliza el departamento guardado en un perfil o recibido de un fichero:
// 1) renombres exactos (DEPARTAMENTOS_ALIAS); 2) nombre vigente tal cual;
// 3) emparejamiento flexible con el listado (acentos/comas/prefijo). Si nada
// encaja devuelve "" (asignable a mano desde edición).
function _normalizarDepartamento(d) {
  const s = String(d || "").trim();
  if (!s) return "";
  if (DEPARTAMENTOS_ALIAS[s]) return DEPARTAMENTOS_ALIAS[s];
  if (DEPARTAMENTOS.includes(s)) return s;
  return _matchDeptByPrefix(s);
}

// exactamente con una clave de DEPARTAMENTOS_ALIAS y que tengan uid.
function _departamentosPendientesMigracion(items) {
  const pendientes = [];
  (items || []).forEach((u) => {
    if (!u) return;
    const uid = u.uid || u.id;
    const antiguo = String(u.department || "").trim();
    const nuevo = antiguo ? (DEPARTAMENTOS_ALIAS[antiguo] || "") : "";
    if (uid && nuevo && nuevo !== antiguo) pendientes.push({ uid, from: antiguo, to: nuevo });
  });
  return pendientes;
}

let _migracionDeptEnCurso = false;
const _migracionDeptFallidos = new Set(); // uids fallidos en esta sesión: no reintentar en cada snapshot

// Persiste en Firestore el nombre vigente para los perfiles detectados por
// _departamentosPendientesMigracion. Solo actúa con sesión iniciada y rol admin
// (las reglas exigen perfil admin vivo para actualizar perfiles ajenos) y es
// BEST-EFFORT: con permission-denied avisa de reglas desactualizadas y no
// reintenta esos uids hasta la próxima sesión. Idempotente: los snapshots
// posteriores ya no encuentran pendientes y no escriben nada.
async function _migrarDepartamentosFirestore(items) {
  const pendientes = _departamentosPendientesMigracion(items).filter((p) => !_migracionDeptFallidos.has(p.uid));
  if (pendientes.length === 0 || !state.user || _migracionDeptEnCurso) return { escritos: 0, omitidos: 0 };
  if (!isAdmin()) return { escritos: 0, omitidos: pendientes.length };
  _migracionDeptEnCurso = true;
  let escritos = 0, omitidos = 0;
  try {
    // Tandas de writeBatch (límite de Firestore: 500 operaciones por tanda)
    for (let i = 0; i < pendientes.length; i += 500) {
      const tanda = pendientes.slice(i, i + 500);
      try {
        const batch = writeBatch(db);
        tanda.forEach((p) => {
          batch.update(doc(db, USUARIOS_COLLECTION, p.uid), { department: p.to, updatedAt: Date.now() });
        });
        await batch.commit();
        escritos += tanda.length;
      } catch (e) {
        // Reintento INDIVIDUAL: que un perfil borrado a medias no tumbe la tanda entera
        for (const p of tanda) {
          try {
            await updateDoc(doc(db, USUARIOS_COLLECTION, p.uid), { department: p.to, updatedAt: Date.now() });
            escritos++;
          } catch (e2) {
            omitidos++;
            _migracionDeptFallidos.add(p.uid);
            if ((e2.code || "") === "permission-denied") avisoReglasDesactualizadas("usuarios");
          }
        }
      }
    }
    if (escritos > 0) {
      console.info(`[migración departamentos] ${escritos} perfil(es) actualizados en Firestore al nombre vigente del departamento.`);
    }
  } catch (e) {
    console.warn("[migración departamentos] Error inesperado:", e && (e.code || e.message || e));
  } finally {
    _migracionDeptEnCurso = false;
  }
  return { escritos, omitidos };
}

function normalizeDate(s) {
  if (!s || typeof s !== "string") return new Date(NaN);
  const parts = s.split("-");
  if (parts.length < 3) return new Date(NaN);
  const [y, m, d] = parts.map(Number);
  return new Date(y, m - 1, d);
}

// --- Utilidades de cursos escolares ---
// Un curso escolar empieza el 1 de septiembre de un año y termina el 31 de agosto del año siguiente.
// Ejemplo: el curso "2025-2026" va del 2025-09-01 al 2026-08-31.
function computeSchoolYearLabel(date) {
  const d = date instanceof Date ? date : new Date();
  const y = d.getFullYear();
  const m = d.getMonth(); // 0 = enero, 8 = septiembre
  // Si estamos entre enero y agosto, pertenecemos al curso que empezó el septiembre anterior
  if (m < 8) return `${y - 1}-${y}`;
  return `${y}-${y + 1}`;
}

function getSchoolYearBounds(label) {
  const [startYear] = label.split("-").map(Number);
  return {
    start: `${startYear}-09-01`,
    end: `${startYear + 1}-08-31`,
  };
}

// El plan empieza el lunes más próximo al 15 de septiembre (criterio histórico del
// centro: 2025-2026 -> lunes 15/09/2025; 2026-2027 -> lunes 14/09/2026).
function computePlanStartForYear(label) {
  const { start } = getSchoolYearBounds(label);
  const d = normalizeDate(start);
  d.setDate(d.getDate() + 14); // 15 de septiembre
  const dow = d.getDay(); // 0=dom, 1=lun
  const diff = dow >= 5 ? 8 - dow : 1 - dow; // lunes más próximo (viernes/sábado -> la semana siguiente)
  d.setDate(d.getDate() + diff);
  return dateToISO(d);
}

function getCurrentCurso() {
  // 1) Si el admin ha forzado un curso, usarlo
  if (state.forcedCursoId) {
    let curso = (state.cursos).find(c => c.id === state.forcedCursoId);
    if (curso) return curso;
  }
  // 2) Auto-detección por fecha
  const label = computeSchoolYearLabel(new Date());
  // Buscar en state.cursos
  if (state.cursos && state.cursos.length > 0) {
    let curso = state.cursos.find(c => c.id === label || c.label === label);
    if (curso) return curso;
    // Si no existe el curso actual en Firestore, usar DEFAULT_CURSOS si existe
    const defaultCurso = DEFAULT_CURSOS.find(c => c.id === label);
    if (defaultCurso) return defaultCurso;
    // Si no, usar el más reciente de Firestore
    return state.cursos.slice().sort((a, b) => (b.id || "").localeCompare(a.id || ""))[0];
  }
  // Si no hay cursos en Firestore, usar DEFAULT_CURSOS
  return DEFAULT_CURSOS.find(c => c.id === label) || DEFAULT_CURSOS[0];
}

function getEvaluacionesForCurso(curso) {
  if (curso?.evaluaciones?.length) return curso.evaluaciones;
  // Comportamiento general: generar los trimestres (14/11/11 semanas) a partir de la
  // fecha de inicio del plan del curso. Sustituye al antiguo array EVALUATIONS con
  // fechas fijas del curso 2025-2026, que daba fechas equivocadas a otros cursos.
  return generateEvaluacionesForCurso({ planStart: getPlanStartForCurso(curso) });
}

function getPlanStartForCurso(curso) {
  if (curso?.planStart) return curso.planStart;
  // Comportamiento general: derivar la fecha del curso escolar (lunes más próximo
  // al 15 de septiembre, criterio histórico del centro). Sustituye a la antigua
  // constante PLAN_START (fecha fija del curso 2025-2026).
  const etiqueta = String(curso?.id || curso?.label || "");
  const label = /^\d{4}-\d{4}$/.test(etiqueta) ? etiqueta : computeSchoolYearLabel(new Date());
  return computePlanStartForYear(label);
}

function dateToISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function formatDateES(d) {
  if (!d || isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
}
function getWeekDates(weekNumber) {
  const curso = getCurrentCurso();
  const planStart = getPlanStartForCurso(curso);
  const start = normalizeDate(planStart);
  start.setDate(start.getDate() + (weekNumber - 1) * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 4);
  return { start, end };
}
function getEvaluationForWeek(weekNumber) {
  const curso = getCurrentCurso();
  const evals = getEvaluacionesForCurso(curso);
  let cumul = 0;
  for (let i = 0; i < evals.length; i++) {
    if (weekNumber <= cumul + evals[i].weeks) return i;
    cumul += evals[i].weeks;
  }
  return evals.length - 1;
}
function getReadingHour(weekNumber) {
  return ((weekNumber - 1) % 6) + 1;
}
function getDaysOfWeek(weekStart) {
  const days = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}

// -----------------------------------------------------------------------------
// ACCESO SOLO POR NOMBRE DE USUARIO (el administrador crea las cuentas)
// -----------------------------------------------------------------------------
// Firebase Authentication exige un identificador con formato de correo, así que
// las cuentas creadas por el administrador usan un correo INTERNO sintético:
//   <usuario>@iesvdv.planes
// Ese correo nunca se muestra ni se usa para entrar: el login resuelve el
// nombre de usuario contra la colección `usernames` y, si no existe mapeo,
// intenta directamente el correo sintético equivalente.
const USERNAME_DOMAIN = "iesvdv.planes";
function usernameToEmail(u) {
  return `${normalizeUsername(u)}@${USERNAME_DOMAIN}`;
}
function isSyntheticEmail(email) {
  return !!email && String(email).toLowerCase().endsWith("@" + USERNAME_DOMAIN);
}

// Sugiere un nombre de usuario a partir del nombre y apellidos.
// Ej: "María García Pérez" -> "mgarcia"; "Juan López" -> "jlopez"
function suggestUsernameFromNombre(nombre) {
  const deaccent = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const parts = deaccent(String(nombre || "")).toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "";
  const first = parts[0].replace(/[^a-z0-9]/g, "");
  let candidate = first;
  if (parts.length > 1) {
    const last = parts[1].replace(/[^a-z0-9]/g, "");
    if (last) candidate = first.slice(0, 8) + last.slice(0, 12);
  }
  return candidate.slice(0, 30);
}

function localPartOf(email) {
  if (!email || typeof email !== "string") return "";
  const at = email.indexOf("@");
  return at > 0 ? email.slice(0, at) : "";
}

function normalizeUsername(s) {
  return String(s || "").trim().toLowerCase();
}

// 3-30 caracteres: empieza por letra/número, admite punto, guion y guion bajo.
function isValidUsername(s) {
  return /^[a-z0-9][a-z0-9._-]{2,29}$/.test(normalizeUsername(s));
}

// Resuelve un nombre de usuario al correo de la cuenta. Devuelve:
//   { email }         -> mapeo encontrado
//   { notFound: true }-> no existe ese nombre de usuario
//   { blocked: true } -> no se pudo consultar (reglas sin publicar / red)
async function resolveUsernameToEmail(username) {
  const uname = normalizeUsername(username);
  if (!uname) return { notFound: true };
  try {
    const snap = await getDoc(doc(db, USERNAMES_COLLECTION, uname));
    if (snap.exists()) {
      const data = snap.data() || {};
      if (data.email) return { email: data.email };
    }
    return { notFound: true };
  } catch (e) {
    console.warn("[login] No se pudo resolver el nombre de usuario:", e.code || e.message);
    return { blocked: true };
  }
}

// Crea/actualiza el mapeo username -> email. Best-effort: no lanza errores
// (si falla, el usuario seguirá pudiendo entrar con su correo).
async function ensureUsernameMapping({ uid, email, username }) {
  const uname = normalizeUsername(username);
  if (!uname || !uid || !email) return false;
  try {
    const ref = doc(db, USERNAMES_COLLECTION, uname);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const data = snap.data() || {};
      // Nombre tomado por otra cuenta: no sobrescribir.
      if (data.uid && data.uid !== uid) {
        console.warn("[usernames] Nombre de usuario ocupado por otro uid:", uname);
        return false;
      }
      if (data.email === email && data.uid === uid) return true; // ya correcto
    }
    await setDoc(ref, { username: uname, email, uid, updatedAt: Date.now() }, { merge: true });
    return true;
  } catch (e) {
    console.warn("[usernames] No se pudo crear el mapeo de acceso:", e.code || e.message);
    if ((e.code || "") === "permission-denied") avisoReglasDesactualizadas("usernames");
    return false;
  }
}

// Normaliza la lista de profesorado asignado de un curso: acepta strings (uid,
// correo o nombre) y objetos { uid | email | id | nombre }. Devuelve strings.
function normalizeProfesoresRefList(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(item => {
    if (!item) return null;
    if (typeof item === "string") return item.trim();
    if (typeof item === "object") {
      const ref = item.uid || item.email || item.id || item.nombre || item.displayName;
      return ref ? String(ref).trim() : null;
    }
    return String(item).trim();
  }).filter(Boolean);
}

// Resuelve un identificador de profesorado asignado (uid, id de doc, correo,
// nombre de usuario o nombre) al perfil correspondiente en state.usuarios.
function findUsuarioByRef(ref) {
  if (!ref) return null;
  const r = String(ref).trim().toLowerCase();
  return state.usuarios.find(u =>
    (u.uid && String(u.uid).toLowerCase() === r) ||
    (u.id && String(u.id).toLowerCase() === r) ||
    (u.email && String(u.email).toLowerCase() === r) ||
    (u.username && String(u.username).toLowerCase() === r) ||
    (u.displayName && String(u.displayName).toLowerCase() === r)
  ) || null;
}

// Fusiona los cursos de Firestore con DEFAULT_CURSOS, sin duplicados.
// Así, el curso 2025-2026 (que está en DEFAULT_CURSOS) siempre aparece,
// aunque no exista en Firestore.
function mergeCursos(firestoreItems) {
  if (!firestoreItems || firestoreItems.length === 0) {
    return DEFAULT_CURSOS.map(c => ({ ...c }));
  }
  const existingIds = new Set(firestoreItems.map(c => c.id));
  const defaults = DEFAULT_CURSOS.filter(c => !existingIds.has(c.id));
  return [...firestoreItems, ...defaults];
}

// Los cursos por defecto están disponibles DESDE EL ARRANQUE, sin esperar a
// Firestore (ni a iniciar sesión): el calendario de trimestres, los selectores
// de curso y el diálogo «Configurar» funcionan incluso en la pantalla de login.
// Antes, state.cursos quedaba vacío hasta que la suscripción traía datos (y la
// suscripción ya no se crea sin sesión), así que el diálogo no encontraba el curso.
state.cursos = mergeCursos(state.cursos);

// --- Aislamiento por curso escolar (v2.15) ---
// Cada evidencia se etiqueta al crearla con el curso escolar activo (campo
// `cursoEscolar`, p. ej. "2025-2026"). Las suscripciones traen TODAS las
// evidencias (así no hacen falta índices compuestos ni cambios de reglas) y el
// AISLAMIENTO se hace en memoria: state.evidenciasLector / state.evidenciasRM
// contienen SOLO las del curso activo (el forzado por el admin en Cursos
// Escolares o el autodetectado por fecha). Los datos antiguos sin etiqueta se
// infieren del campo `fecha` (Plan Lector) o de `createdAt` (RM), sin escribir
// nada en Firestore.
function cursoEscolarActivo() {
  try {
    const c = getCurrentCurso();
    return c?.label || c?.id || computeSchoolYearLabel(new Date());
  } catch (e) {
    return computeSchoolYearLabel(new Date());
  }
}

function cursoEscolarDeEvidencia(e) {
  if (e && typeof e.cursoEscolar === "string" && /^\d{4}-\d{4}$/.test(e.cursoEscolar)) return e.cursoEscolar;
  if (e && typeof e.fecha === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.fecha)) {
    return computeSchoolYearLabel(new Date(e.fecha + "T12:00:00"));
  }
  const t = Number(e && e.createdAt);
  return computeSchoolYearLabel(new Date(Number.isFinite(t) && t > 0 ? t : Date.now()));
}

// --- CRUD Usuarios ---
// Lee el perfil de un usuario por su uid. Si no existe, lo crea con valores por defecto
// (rol profesor; el admin se concede solo desde Gestión de usuarios o el protocolo del
// primer administrador). Si la escritura falla por permisos de Firestore, no se lanza
// error; se devuelve un perfil sintético para no bloquear la sesión.
async function ensureUserProfile(user, extra = {}) {
  if (!user) return null;
  const ref = doc(db, USUARIOS_COLLECTION, user.uid);
  const email = user.email || "";

  let snap;
  try {
    snap = await getDoc(ref);
  } catch (e) {
    console.warn("[ensureUserProfile] No se pudo leer el perfil de Firestore:", e.code || e.message);
    // Devolver un perfil sintético basado en Auth + email. El rol no se puede saber
    // sin Firestore: se asume profesor hasta que la lectura funcione.
    return {
      id: user.uid,
      uid: user.uid,
      email,
      displayName: user.displayName || email.split("@")[0] || "Profesor/a",
      role: "profesor",
      department: extra.department || "",
      _synthetic: true,
    };
  }

  if (snap.exists()) {
    const data = snap.data();
    // Renombres de departamento (v2.13): el perfil propio se muestra con el nombre
    // vigente aunque Firestore aún guarde el antiguo (la migración lo persistirá).
    if (data.department) data.department = _normalizarDepartamento(data.department);

    // Auto-reparación del acceso por nombre de usuario: si el perfil tiene (o se le
    // puede derivar) un nombre de usuario y el mapeo no existe, crearlo. Así, quien
    // entra una vez con su correo podrá entrar después solo con su usuario.
    try {
      const uname = normalizeUsername(data.username) || normalizeUsername(extra.username) || localPartOf(email);
      if (uname) {
        if (data.username !== uname) {
          try { await setDoc(ref, { ...data, username: uname, updatedAt: Date.now() }, { merge: true }); } catch (e) {}
        }
        await ensureUsernameMapping({ uid: user.uid, email, username: uname });
        data.username = uname;
      }
    } catch (e) {
      console.warn("[ensureUserProfile] Mapeo de nombre de usuario:", e.code || e.message);
    }

    // Si este usuario es administrador, marcar la bandera pública hasAdmin
    // (oculta el protocolo de crear el primer administrador) y apagar el modo
    // de recuperación si estaba activo.
    if (data.role === "admin") {
      window._forzarProtocoloAdmin = false;
      await markAdminExists();
    }

    return { id: snap.id, ...data };
  }

  // Crear perfil por defecto
  const unameNew = normalizeUsername(extra.username) || localPartOf(email);
  const profile = {
    uid: user.uid,
    email,
    displayName: user.displayName || email.split("@")[0] || "Profesor/a",
    role: "profesor",
    department: extra.department || "",
    ...(unameNew ? { username: unameNew } : {}),
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  try {
    await setDoc(ref, profile);
    // Crear también el mapeo de acceso por nombre de usuario (best-effort)
    if (unameNew) {
      await ensureUsernameMapping({ uid: user.uid, email, username: unameNew });
    }
    // Si el perfil nuevo es admin, marcar hasAdmin
    if (profile.role === "admin") {
      window._forzarProtocoloAdmin = false;
      await markAdminExists();
    }
  } catch (e) {
    console.warn("[ensureUserProfile] No se pudo crear el perfil en Firestore:", e.code || e.message);
    profile._synthetic = true;
  }
  return { id: user.uid, ...profile };
}

async function updateUserProfile(uid, data) {
  const ref = doc(db, USUARIOS_COLLECTION, uid);
  const snap = await getDoc(ref);
  const existing = snap.exists() ? snap.data() : {};
  const merged = { ...existing, ...data, uid, updatedAt: Date.now() };
  await setDoc(ref, merged, { merge: true });
  return { id: uid, ...merged };
}

// Crear un nuevo usuario desde el panel de administración.
// El administrador indica SOLO: nombre, usuario, contraseña, departamento y rol.
// La cuenta de Firebase Auth se crea con un correo interno sintético
// (<usuario>@iesvdv.planes) que nadie usa ni ve: el acceso es por usuario+contraseña.
// Usa la instancia secundaria de Firebase Auth para NO cerrar la sesión del admin.
async function createUsuarioByAdmin({ nombre, apellidos, username, departamento, rol, password }) {
  const uname = normalizeUsername(username);
  if (!nombre || nombre.length < 3) throw new Error("Falta el nombre completo.");
  if (!uname || !isValidUsername(uname)) throw new Error("Nombre de usuario no válido (3-30 caracteres: letras, números, punto, guion o guion bajo).");
  if (!password || password.length < 6) throw new Error("La contraseña debe tener al menos 6 caracteres.");

  const email = usernameToEmail(uname);

  // 1) Crear cuenta en Firebase Auth con la instancia secundaria.
  // recuperado = la cuenta Auth ya existía (residual de un borrado: la app no
  // puede eliminar cuentas de Authentication) y la contraseña ENCAJA, así que
  // se REUTILIZA el mismo uid y se recrean perfil + mapeo de acceso.
  let newUid;
  let recuperado = false;
  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    newUid = cred.user.uid;
    try { await updateProfile(cred.user, { displayName: nombre }); } catch (e) { console.warn("No se pudo actualizar displayName:", e); }
    try { await secondaryAuth.signOut(); } catch (e) { console.warn("No se pudo cerrar sesión secundaria:", e); }
  } catch (e) {
    if (e.code === "auth/email-already-in-use") {
      // La cuenta Auth ya existe: cuenta residual tras un borrado (los perfiles y
      // el mapeo se eliminan, la cuenta de Authentication no) o nombre ocupado.
      // Si la contraseña indicada ENTRA en la cuenta, se reutiliza y el alta
      // continúa con el mismo uid (re-vinculando perfil y mapeo).
      let reusado = null;
      try {
        const cred = await signInWithEmailAndPassword(secondaryAuth, email, password);
        reusado = cred.user;
      } catch (e2) { /* contraseña distinta u otro problema: no reutilizable */ }
      if (reusado) {
        recuperado = true;
        newUid = reusado.uid;
        try { await updateProfile(reusado, { displayName: nombre }); } catch (e2) { console.warn("No se pudo actualizar displayName:", e2); }
        try { await secondaryAuth.signOut(); } catch (e3) { console.warn("No se pudo cerrar sesión secundaria:", e3); }
      } else {
        throw new Error(
          `El usuario "${uname}" ya tiene cuenta de acceso con OTRA contraseña: al borrar el perfil, la cuenta de Authentication NO se elimina y su contraseña sigue siendo la que tenía ANTES del borrado. ` +
          `Opciones: (1) da el alta de nuevo escribiendo ESA contraseña (la de antes) y la cuenta se reutilizará automáticamente; ` +
          `(2) si no la recuerdas, borra la cuenta ${email} en Firebase Console → Authentication → Users y vuelve a crear el usuario con la contraseña que quieras; ` +
          `(3) o usa Herramientas avanzadas → «Reparar perfil» si conoces su contraseña actual.`
        );
      }
    } else {
      throw e;
    }
  }

  // 2) Crear el perfil en Firestore usando el uid de la cuenta (nueva o reutilizada)
  const profile = {
    uid: newUid,
    email,
    displayName: nombre,
    apellidos: apellidos || "", // clave de ordenación por apellidos (importación Séneca)
    username: uname,
    role: rol || "profesor",
    department: departamento || "",
    createdAt: Date.now(),
    updatedAt: Date.now(),
    createdBy: state.user?.uid || null,
  };
  try {
    const ref = doc(db, USUARIOS_COLLECTION, newUid);
    // Si ya existiera un perfil para esa cuenta (estado local desactualizado),
    // se actualiza en lugar de machacarlo: se conserva el alta original.
    let prev = null;
    try { prev = await getDoc(ref); } catch (e) { prev = null; }
    if (prev && prev.exists()) {
      const antes = prev.data() || {};
      profile.createdAt = antes.createdAt || profile.createdAt;
      if (antes.previousUid) profile.previousUid = antes.previousUid; // no perder marcas de rescate
      await setDoc(ref, profile, { merge: true });
    } else {
      await setDoc(ref, profile);
    }
    // Mapeo de acceso por nombre de usuario (best-effort, no bloquea el alta)
    await ensureUsernameMapping({ uid: newUid, email, username: uname });
    if (profile.role === "admin") await markAdminExists();
  } catch (e) {
    console.error("[createUsuarioByAdmin] Error al crear perfil en Firestore:", e.code || e.message);
    throw new Error("Se creó la cuenta pero NO se pudo crear el perfil en Firestore. " +
      "Error: " + (e.code || e.message) + ". " +
      "Verifica que las reglas de Firestore permiten al admin crear documentos en 'usuarios'. " +
      "Copia las reglas desde el panel de la sección Usuarios.");
  }
  return { id: newUid, ...profile, _recuperado: recuperado };
}

// Eliminar un usuario y TODA la información que ha generado (borrado en cascada).
// NOTA: No se puede eliminar la cuenta de Firebase Auth desde el cliente (requiere Admin SDK).
// Por tanto, esta función:
//   1) Borra todas las evidencias_lector donde createdBy == uid
//   2) Borra todas las evidencias_rm donde createdBy == uid
//   3) Borra el documento usuarios/{uid}
//   4) Devuelve un informe de lo que se ha borrado
// La cuenta de Auth seguirá existiendo; el admin deberá eliminarla manualmente desde
// Firebase Console si quiere un borrado completo.
async function deleteUsuarioCascade(uid) {
  const report = { uid, evidenciasLector: 0, evidenciasRM: 0, perfil: false, errors: [] };

  // 1) Borrar evidencias Lector
  try {
    const qLector = query(collection(db, LECTOR_COLLECTION), where("createdBy", "==", uid));
    const snapLector = await getDocs(qLector);
    const batchLector = [];
    snapLector.forEach((d) => {
      batchLector.push(deleteDoc(doc(db, LECTOR_COLLECTION, d.id)));
    });
    await Promise.all(batchLector);
    report.evidenciasLector = batchLector.length;
  } catch (e) {
    console.error("Error borrando evidencias Lector:", e);
    report.errors.push(`Lector: ${e.code || e.message}`);
  }

  // 2) Borrar evidencias RM
  try {
    const qRM = query(collection(db, RM_COLLECTION), where("createdBy", "==", uid));
    const snapRM = await getDocs(qRM);
    const batchRM = [];
    snapRM.forEach((d) => {
      batchRM.push(deleteDoc(doc(db, RM_COLLECTION, d.id)));
    });
    await Promise.all(batchRM);
    report.evidenciasRM = batchRM.length;
  } catch (e) {
    console.error("Error borrando evidencias RM:", e);
    report.errors.push(`RM: ${e.code || e.message}`);
  }

  // 3) Borrar el perfil del usuario
  try {
    await deleteDoc(doc(db, USUARIOS_COLLECTION, uid));
    report.perfil = true;
  } catch (e) {
    console.error("Error borrando perfil:", e);
    report.errors.push(`Perfil: ${e.code || e.message}`);
  }

  // 4) Borrar el mapeo de acceso por nombre de usuario (si lo tenía)
  try {
    const u = state.usuarios.find(x => (x.uid || x.id) === uid);
    const uname = normalizeUsername(u?.username);
    if (uname) {
      await deleteDoc(doc(db, USERNAMES_COLLECTION, uname));
      report.usernameMapping = uname;
    }
  } catch (e) {
    console.warn("Error borrando mapeo de usuario:", e.code || e.message);
  }

  return report;
}

window._closeResetPassDialog = () => {
  document.getElementById("reset-pass-dialog")?.remove();
};

window._confirmResetPass = async (uid) => {
  const u = state.usuarios.find(x => (x.uid || x.id) === uid);
  if (!u) return;
  const pass = document.getElementById("rp-pass")?.value || "";
  const pass2 = document.getElementById("rp-pass2")?.value || "";
  const err = document.getElementById("rp-error");
  err.classList.add("hidden");
  if (uid === state.user?.uid) { err.textContent = "No puedes restablecer tu propia contraseña desde aquí."; err.classList.remove("hidden"); return; }
  if (pass.length < 6) { err.textContent = "La contraseña debe tener al menos 6 caracteres."; err.classList.remove("hidden"); return; }
  if (pass !== pass2) { err.textContent = "Las contraseñas no coinciden."; err.classList.remove("hidden"); return; }

  const uname = normalizeUsername(u.username) || localPartOf(u.email);
  if (!isValidUsername(uname)) {
    err.textContent = "Este usuario no tiene un nombre de usuario válido. Edítalo primero en «Editar usuario».";
    err.classList.remove("hidden");
    return;
  }

  const btn = document.getElementById("rp-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Restableciendo…`;
  const _btnReset = () => { btn.disabled = false; btn.innerHTML = `Restablecer contraseña`; };

  // PRE-VUELO (antes de crear NADA en Authentication): con reglas desactualizadas
  // el paso de re-vincular el mapeo fallaría DESPUÉS de crear la cuenta, dejando
  // un restablecimiento a medias (cuenta nueva huérfana y, a efectos del login,
  // contraseña sin cambiar). Se comprueba lectura y escritura de «usernames».
  try {
    const mapSnap = await getDoc(doc(db, USERNAMES_COLLECTION, uname));
    if (mapSnap.exists()) {
      const md = mapSnap.data() || {};
      if (md.uid && md.uid !== uid) {
        err.textContent = `El usuario "${uname}" está vinculado a otra cuenta. Contacta con soporte técnico.`;
        err.classList.remove("hidden");
        _btnReset();
        return;
      }
    }
  } catch (e) {
    console.warn("[_confirmResetPass] No se pudo comprobar el mapeo:", e.code || e.message);
    if ((e.code || "") === "permission-denied") {
      avisoReglasDesactualizadas("usernames");
      err.textContent = "Las reglas de Firestore publicadas están desactualizadas (no incluyen la colección «usernames»). Publica las reglas nuevas — Gestión de usuarios → «Copiar reglas» → Firebase Console → Firestore → Rules — y vuelve a intentarlo. NO se ha cambiado nada.";
      err.classList.remove("hidden");
      _btnReset();
      return;
    }
  }
  try {
    // Prueba inocua de escritura (merge) sobre el mismo documento que se re-vinculará después.
    await setDoc(doc(db, USERNAMES_COLLECTION, uname), { updatedAt: Date.now() }, { merge: true });
  } catch (e) {
    console.warn("[_confirmResetPass] Pre-vuelo de escritura en usernames:", e.code || e.message);
    if ((e.code || "") === "permission-denied") {
      avisoReglasDesactualizadas("usernames");
      err.textContent = "Las reglas de Firestore publicadas están desactualizadas (no permiten actualizar «usernames»). Publica las reglas nuevas — Gestión de usuarios → «Copiar reglas» → Firebase Console → Firestore → Rules — y vuelve a intentarlo. NO se ha creado ninguna cuenta ni cambiado ninguna contraseña.";
      err.classList.remove("hidden");
      _btnReset();
      return;
    }
  }

  // Restablecimientos anteriores INTERRUMPIDOS: si un intento previo se quedó a
  // medias (p. ej. por reglas desactualizadas), existe un perfil con previousUid
  // apuntando a este usuario y una cuenta Auth ya creada. Se REUTILIZA (el proceso
  // es idempotente) en lugar de acumular cuentas nuevas.
  let newUid = null, newEmail = null, cuentaReutilizada = false;
  try {
    const prevSnap = await getDocs(query(collection(db, USUARIOS_COLLECTION), where("previousUid", "==", uid)));
    let rescate = null;
    prevSnap.forEach((d) => {
      const dd = d.data() || {};
      if (!rescate || (dd.passwordResetAt || 0) > (rescate.passwordResetAt || 0)) rescate = { id: d.id, ...dd };
    });
    if (rescate && rescate.email) {
      try {
        const cred2 = await signInWithEmailAndPassword(secondaryAuth, rescate.email, pass);
        newUid = cred2.user.uid;
        newEmail = rescate.email;
        cuentaReutilizada = true;
        // Sincronizar la contraseña con la tecleada en este intento (sesión recién
        // iniciada: el cambio está permitido). Es un no-op si coincide.
        try { await updatePassword(cred2.user, pass); } catch (e3) { console.warn("[resetPass] Sincronización de contraseña de la cuenta de rescate:", e3.code || e3.message); }
        try { await updateProfile(cred2.user, { displayName: u.displayName || uname }); } catch (e3) {}
        try { await secondaryAuth.signOut(); } catch (e3) {}
      } catch (e2) {
        // La contraseña tecleada no es la de la cuenta de rescate (o la cuenta ya
        // no existe): se descarta el perfil residual y abajo se crea una cuenta nueva.
        console.warn("[resetPass] Cuenta de rescate no reutilizable:", e2.code || e2.message);
        try { await deleteDoc(doc(db, USUARIOS_COLLECTION, rescate.id)); } catch (e3) {}
      }
      // Cualquier OTRO rescate interrumpido del mismo usuario se descarta (perfiles
      // duplicados); sus cuentas Auth residuales solo se pueden limpiar desde
      // Firebase Console → Authentication.
      prevSnap.forEach((d) => {
        if (d.id !== newUid && (!rescate || d.id !== rescate.id)) {
          deleteDoc(doc(db, USUARIOS_COLLECTION, d.id)).catch(() => {});
        }
      });
    }
  } catch (e1) { console.warn("[resetPass] Búsqueda de restablecimientos a medias:", e1.code || e1.message); }

  try {
    if (!newUid) {
      // 1) Nueva cuenta Auth con correo sintético único (el original sigue ocupado)
      const suffix = Date.now().toString(36);
      newEmail = `${uname}-r${suffix}@${USERNAME_DOMAIN}`.toLowerCase();
      const cred = await createUserWithEmailAndPassword(secondaryAuth, newEmail, pass);
      newUid = cred.user.uid;
      try { await updateProfile(cred.user, { displayName: u.displayName || uname }); } catch (e) {}
      try { await secondaryAuth.signOut(); } catch (e) {}

      // 2) Nuevo perfil con los mismos datos (marcado con el uid anterior)
      const oldProfile = { ...u };
      delete oldProfile.id;
      delete oldProfile._synthetic;
      const newProfile = {
        ...oldProfile,
        uid: newUid,
        email: newEmail,
        username: uname,
        createdAt: u.createdAt || Date.now(),
        updatedAt: Date.now(),
        passwordResetAt: Date.now(),
        passwordResetBy: state.user?.uid || null,
        previousUid: uid,
      };
      await setDoc(doc(db, USUARIOS_COLLECTION, newUid), newProfile);
    } else {
      // 2b) Cuenta de rescate reutilizada: el perfil ya existe; solo sincronizar
      // los metadatos del restablecimiento.
      try {
        await setDoc(doc(db, USUARIOS_COLLECTION, newUid), {
          passwordResetAt: Date.now(),
          passwordResetBy: state.user?.uid || null,
          updatedAt: Date.now(),
        }, { merge: true });
      } catch (e) {}
    }

    // 3) Re-vincular el mapeo de acceso: el MISMO usuario pasa a apuntar a la
    //    nueva cuenta (el perfil antiguo se elimina al final del proceso).
    try {
      await setDoc(doc(db, USERNAMES_COLLECTION, uname), {
        username: uname,
        email: newEmail,
        uid: newUid,
        updatedAt: Date.now(),
      }, { merge: true });
    } catch (e) {
      console.error("[resetPass] No se pudo re-vincular el mapeo:", e.code || e.message);
      throw new Error("No se pudo actualizar el acceso del usuario (" + (e.code || e.message) + "). La contraseña NO ha cambiado.");
    }

    // 4) Trasladar sus evidencias al nuevo uid
    let movidasLector = 0, movidasRM = 0;
    try {
      const qL = query(collection(db, LECTOR_COLLECTION), where("createdBy", "==", uid));
      const snapL = await getDocs(qL);
      const ops = [];
      snapL.forEach((d) => ops.push(updateDoc(doc(db, LECTOR_COLLECTION, d.id), { createdBy: newUid, updatedAt: Date.now() })));
      await Promise.all(ops);
      movidasLector = ops.length;
    } catch (e) { console.warn("[resetPass] Evidencias lector:", e.code || e.message); }
    try {
      const qRM = query(collection(db, RM_COLLECTION), where("createdBy", "==", uid));
      const snapRM = await getDocs(qRM);
      const ops = [];
      snapRM.forEach((d) => ops.push(updateDoc(doc(db, RM_COLLECTION, d.id), { createdBy: newUid, updatedAt: Date.now() })));
      await Promise.all(ops);
      movidasRM = ops.length;
    } catch (e) { console.warn("[resetPass] Evidencias RM:", e.code || e.message); }

    // 5) Actualizar referencias en curso_profesores (uid antiguo -> nuevo)
    try {
      const snapCP = await getDocs(collection(db, "curso_profesores"));
      const ops = [];
      snapCP.forEach((d) => {
        const data = d.data() || {};
        const lista = Array.isArray(data.profesores) ? data.profesores : null;
        if (lista && lista.some(x => String(x).trim().toLowerCase() === uid.toLowerCase())) {
          const nueva = lista.map(x => String(x).trim().toLowerCase() === uid.toLowerCase() ? newUid : x);
          ops.push(updateDoc(doc(db, "curso_profesores", d.id), { profesores: nueva, updatedAt: Date.now() }));
        }
      });
      await Promise.all(ops);
    } catch (e) { console.warn("[resetPass] curso_profesores:", e.code || e.message); }

    // 6) Eliminar el perfil antiguo
    try { await deleteDoc(doc(db, USUARIOS_COLLECTION, uid)); } catch (e) { console.warn("[resetPass] Perfil antiguo:", e.code || e.message); }

    window._closeResetPassDialog();
    refreshUsuariosNow();
    setTimeout(() => {
      alert(`Contraseña restablecida correctamente.${cuentaReutilizada ? "\n\n(Se ha completado el restablecimiento anterior que había quedado a medias.)" : ""}\n\nUsuario: @${uname}\nNombre: ${u.displayName || ""}\nEvidencias trasladadas: ${movidasLector} (Lector) · ${movidasRM} (RM)\n\nComunica la nueva contraseña al profesor/a por un canal seguro.`);
    }, 100);
  } catch (e) {
    console.error("[_confirmResetPass] Error:", e);
    const map = {
      "auth/weak-password": "La contraseña es demasiado débil (mínimo 6 caracteres).",
      "auth/network-request-failed": "Sin conexión. Revisa tu red.",
      "auth/operation-not-allowed": "Firebase Authentication no tiene habilitado Email/Password.",
      "permission-denied": "Faltan permisos de Firestore para completar el proceso. Publica las reglas nuevas: Gestión de usuarios → «Copiar reglas» → Firebase Console → Firestore → Rules (deben incluir las colecciones «usernames» y «config_public»).",
    };
    err.textContent = map[e.code] || ("Error al restablecer: " + (e.message || e.code || "desconocido"));
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `Restablecer contraseña`;
  }
};

function subscribeAllUsuarios(cb) {
  // IMPORTANTE: sin orderBy. Firestore EXCLUYE silenciosamente los documentos que no
  // tienen el campo por el que se ordena. Los perfiles creados manualmente en la
  // consola o por versiones antiguas pueden carecer de `createdAt`, y por eso no
  // aparecían en la lista (ni en los cursos). Se ordena en cliente.
  const q = collection(db, USUARIOS_COLLECTION);
  return onSnapshot(q, (snap) => {
    const items = [];
    snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
    sortUsuarios(items);
    // v2.13: persistir en Firestore los renombres de departamento (best-effort)
    _migrarDepartamentosFirestore(items).catch((e) => console.warn("[migración departamentos]", e));
    cb(items, null);
  }, (err) => {
    console.error("subscribeUsuarios:", err);
    if ((err.code || "") === "permission-denied") avisoReglasDesactualizadas("usuarios");
    // Pasar el error para que la UI pueda mostrar instrucciones
    cb([], err);
  });
}

// Crea (o re-crea) la suscripción en tiempo real a la lista de usuarios con el
// tratamiento común de estado/UI. Se usa en el arranque de sesión, en la
// re-suscripción periódica y tras una comprobación de reglas superada (v2.16),
// para que la lista se recupere SIN recargar la página.
function _crearSubUsuarios(tag) {
  try { subs.usuarios && subs.usuarios(); } catch (e) {}
  subs.usuarios = subscribeAllUsuarios((items, err) => {
    state.usuarios = items || [];
    state.usuariosError = err || null;
    if (!err) state.usuariosLastUpdated = Date.now();
    if (state.user && state.view.name === "gestion-usuarios") {
      // Solo tabla + contador: reconstruir la vista cerraría el acordeón de importación
      renderUsuariosDynamic(tag || "usuarios-snapshot");
    } else if (state.user && state.view.name === "informes") {
      safeRenderMain(tag || "usuarios-snapshot");
    }
  });
}

// Orden CANÓNICO de la lista de usuarios en memoria: POR APELLIDOS (comportamiento
// general aplicado a TODOS los listados). Así, cualquier vista que recorra
// state.usuarios en orden verá la lista alfabética aunque no reordene por su cuenta
// (antes se ordenaba por fecha de alta y ese era el motivo de que algún listado
// apareciera sin orden). Desempate: el alta más reciente primero.
function sortUsuarios(items) {
  // Capa de datos: normaliza renombres de departamento en los perfiles ya cargados
  // (p. ej. «Geografía e Historia» -> «Geografía, Historia y Religión») en MEMORIA.
  // La PERSISTENCIA en Firestore la hace la migración automática
  // (_migrarDepartamentosFirestore), enganchada a la suscripción, al refresco
  // puntual y a la carga del perfil.
  items.forEach((u) => { if (u && u.department) u.department = _normalizarDepartamento(u.department); });
  items.sort((a, b) => {
    const cmp = _compareUsuariosPorApellidos(a, b);
    if (cmp !== 0) return cmp;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

// -----------------------------------------------------------------------------
// ACTUALIZACIÓN DIRIGIDA de la vista de gestión de usuarios
// -----------------------------------------------------------------------------
// Las actualizaciones automáticas de la lista (snapshot en tiempo real, polling de
// 30 s, refresco al volver a la pestaña) NO deben re-renderizar la vista completa:
// reconstruir el DOM cerraría los acordeones abiertos y borraría el archivo Excel
// ya seleccionado en el panel de importación. Solo se actualizan el contador y la
// tabla. renderMain() queda reservado para la navegación.
function renderUsuariosDynamic(reason = "") {
  if (!state.user || state.view.name !== "gestion-usuarios") return;
  if (isDialogOpen()) return;
  // Si aparece un error de permisos hay que montar el aviso completo (no está en el DOM)
  const err = state.usuariosError;
  if (err && (err.code === "permission-denied" || /permission/i.test(err.message || ""))) {
    renderMain();
    return;
  }
  try {
    const countEl = document.getElementById("usuarios-count");
    if (countEl) countEl.textContent = String(state.usuarios.length);
    const listadoCount = document.getElementById("acc-listado-count");
    if (listadoCount) listadoCount.textContent = String(state.usuarios.length);
    window._renderUsersTable && window._renderUsersTable();
  } catch (e) {
    console.warn("renderUsuariosDynamic:", e);
  }
}

// Guarda/restaura el estado efímero del panel de gestión de usuarios alrededor de
// un re-render completo: acordeones abiertos, valores escritos en los campos,
// resultado de la última importación y archivo Excel seleccionado. Sin esto, un
// re-render cerraría el acordeón de importación y perdería el archivo elegido.
function snapshotGestionUsuariosUI() {
  if (state.view.name !== "gestion-usuarios") return null;
  const main = document.getElementById("main-content");
  if (!main || !main.querySelector("details")) return null;
  const snap = { details: [], fields: {}, iuResult: "", file: null };
  main.querySelectorAll("details").forEach((d) => snap.details.push(d.open));
  main.querySelectorAll("input, select, textarea").forEach((el) => {
    if (!el.id || el.type === "file") return;
    snap.fields[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  const res = main.querySelector("#iuResult");
  if (res) snap.iuResult = res.innerHTML;
  const f = main.querySelector("#iuFile");
  if (f && f.files && f.files[0]) snap.file = f.files[0];
  return snap;
}

function restoreGestionUsuariosUI(snap) {
  if (!snap) return;
  const main = document.getElementById("main-content");
  if (!main) return;
  main.querySelectorAll("details").forEach((d, i) => { if (snap.details[i]) d.open = true; });
  Object.entries(snap.fields || {}).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === "checkbox") el.checked = val;
    else if (el.value !== val) el.value = val;
  });
  const res = document.getElementById("iuResult");
  if (res && snap.iuResult) res.innerHTML = snap.iuResult;
  if (snap.file) {
    const f = document.getElementById("iuFile");
    if (f) {
      try {
        const dt = new DataTransfer();
        dt.items.add(snap.file);
        f.files = dt.files;
      } catch (e) { /* Navegador sin DataTransfer: no se puede reasignar */ }
    }
  }
}

// Acordeones EXCLUYENTES (vista de Gestión de usuarios y cualquier otro grupo marcado
// con data-acc-grupo): solo puede haber uno desplegado a la vez; abrir uno cierra los
// demás del mismo grupo. El evento "toggle" no burbujea, por eso se escucha en la
// fase de captura sobre document. Los acordeones se muestran replegados de inicio.
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.open) return;
  const grupo = d.getAttribute("data-acc-grupo");
  if (!grupo) return;
  document.querySelectorAll(`details[data-acc-grupo="${grupo}"]`).forEach((otro) => {
    if (otro !== d && otro.open) otro.open = false;
  });
}, true);
// Expuesto para las pruebas de humo (no interfiere con la app)
window._usuariosUI = {
  snapshot: snapshotGestionUsuariosUI,
  restore: restoreGestionUsuariosUI,
  // Gancho de pruebas: permite tomar un snapshot aunque la vista activa no sea gestion-usuarios
  snapshotForTests: () => {
    const prev = state.view.name;
    state.view.name = "gestion-usuarios";
    try { return snapshotGestionUsuariosUI(); } finally { state.view.name = prev; }
  },
  // Ganchos de pruebas: poblar/leer la lista de usuarios sin pasar por Firestore
  setUsuarios: (arr) => { state.usuarios = arr || []; },
  // Gancho de pruebas: simular la sesión (state.user) para probar flujos de "uno mismo"
  setUser: (u) => { state.user = u || null; },
  // Gancho de pruebas: aplicar el orden canónico (por apellidos) a un array exterior
  sortUsuarios: (arr) => sortUsuarios(arr || []),
  getState: () => state,
};

// Lectura puntual (one-shot) de la colección usuarios. Útil para forzar refresco
// cuando la suscripción en tiempo real no dispara el callback (pestaña en segundo
// plano, conexión intermitente, etc.).
async function refreshUsuariosNow() {
  if (state.usuariosRefreshing) {
    return;
  }
  state.usuariosRefreshing = true;
  try {
    // Sin orderBy (ver comentario en subscribeAllUsuarios): evita excluir perfiles
    // sin el campo createdAt.
    const q = collection(db, USUARIOS_COLLECTION);
    const snap = await getDocs(q);
    const items = [];
    snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
    sortUsuarios(items);
    state.usuarios = items;
    state.usuariosError = null;
    state.usuariosLastUpdated = Date.now();
    // v2.13: persistir en Firestore los renombres de departamento (best-effort)
    _migrarDepartamentosFirestore(items).catch((e) => console.warn("[migración departamentos]", e));
    // Actualización dirigida (contador + tabla): NO renderMain(), que cerraría
    // los acordeones y perdería el archivo del panel de importación.
    renderUsuariosDynamic("refresh-usuarios");
  } catch (err) {
    console.error("[refreshUsuariosNow] Error:", err.code || err.message);
    state.usuariosError = err;
    renderUsuariosDynamic("refresh-usuarios-error");
  } finally {
    state.usuariosRefreshing = false;
  }
}

// Suscripción al propio perfil del usuario. Si un admin cambia el rol o departamento
// de este usuario desde otra pestaña, el cambio se refleja aquí en tiempo real.
function subscribeOwnProfile(uid, cb) {
  const ref = doc(db, USUARIOS_COLLECTION, uid);
  return onSnapshot(ref, (snap) => {
    if (snap.exists()) {
      cb({ id: snap.id, ...snap.data() }, null);
    } else {
      cb(null, null);
    }
  }, (err) => {
    console.warn("subscribeOwnProfile error:", err.code || err.message);
    cb(null, err);
  });
}

// Refresco puntual de evidencias (red de seguridad)
async function refreshEvidenciasNow(which = "all") {
  try {
    if (which === "all" || which === "lector") {
      const q = query(collection(db, LECTOR_COLLECTION), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      const items = [];
      snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
      _todasEvidenciasLector = items;
    }
    if (which === "all" || which === "rm") {
      const q = query(collection(db, RM_COLLECTION), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      const items = [];
      snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
      _todasEvidenciasRM = items;
    }
    filtrarEvidenciasPorCursoActivo();
    safeRenderMain("evidencias-refresh");
  } catch (err) {
    console.error("refreshEvidenciasNow:", err);
  }
}

// =============================================================================
// SINCRONIZACIÓN GLOBAL EN TIEMPO REAL
// =============================================================================
// Esta función configura TODAS las suscripciones en tiempo real y las redes de
// seguridad (polling periódico + refresco al volver a la pestaña).
// Se llama una vez al iniciar la app y se re-configura cuando el usuario inicia sesión.
function setupGlobalSync() {
  // Limpiar suscripciones y timers previos
  Object.values(subs).forEach(s => { try { s && s(); } catch (e) {} });
  Object.values(timers).forEach(t => { if (t) clearInterval(t); });
  subs.lector = subs.rm = subs.aportaciones = subs.usuarios = subs.cursos = subs.ownProfile = subs.cursoProfesores = null;
  timers.usuarios = timers.lector = timers.rm = timers.cursos = null;

  // SIN SESIÓN INICIADA (pantalla de login): no suscribir nada. Las reglas de
  // Firestore exigen request.auth != null para estas colecciones; suscribirse
  // sin usuario solo llenaba la consola de "Missing or insufficient permissions"
  // al arrancar y al cerrar sesión. Cuando alguien inicia sesión, el observer
  // onAuthStateChanged vuelve a llamar aquí y se suscribe todo con permisos.
  if (!state.user) return;

  // 1) Suscripción en tiempo real a evidencias Lector
  subs.lector = subscribeAllLector((items) => {
    _todasEvidenciasLector = items || [];
    filtrarEvidenciasPorCursoActivo();
    // Re-renderizar en cualquier vista que muestre datos de Lector
    if (state.user && ["cronograma-lector", "informes", "plan-lector"].includes(state.view.name)) {
      safeRenderMain("lector-snapshot");
    }
  });

  // 2) Suscripción en tiempo real a evidencias RM
  subs.rm = subscribeAllRM((items) => {
    _todasEvidenciasRM = items || [];
    filtrarEvidenciasPorCursoActivo();
    if (state.user && ["curso-rm", "informes", "razonamiento-matematico"].includes(state.view.name)) {
      safeRenderMain("rm-snapshot");
    }
  });

  // 2c) Suscripción en tiempo real a las aportaciones de «Feedback entre compañer@s»
  // (v2.21). Si el diálogo del feedback está abierto, se refresca su lista en vivo
  // sin cerrarlo (safeRenderMain no re-renderiza con un diálogo abierto).
  subs.aportaciones = subscribeAllAportaciones((items) => {
    _todasAportaciones = items || [];
    filtrarAportacionesPorCursoActivo();
    if (state.user && ["recursos-cl", "recursos-rm"].includes(state.view.name)) {
      safeRenderMain("aportaciones-snapshot");
    }
    if (document.getElementById("feedback-dialog") && window._renderFeedbackList) {
      try { window._renderFeedbackList(); } catch (e) {}
    }
  });

  // 3) Suscripción en tiempo real a usuarios
  _crearSubUsuarios("usuarios-snapshot");

  // 4) Suscripción en tiempo real a cursos escolares
  subs.cursos = subscribeAllCursos((items) => {
    state.cursos = mergeCursos(items);
    // Con los cursos ya cargados puede cambiar el curso activo (p. ej. un
    // forcedCursoId que solo existe en Firestore): re-filtrar las evidencias.
    filtrarEvidenciasPorCursoActivo();
    if (state.user && ["cursos-escolares", "informes", "cronograma-lector", "curso-rm"].includes(state.view.name)) {
      safeRenderMain("cursos-snapshot");
    }
  });

  // 4b) Suscripción en tiempo real a curso_profesores (asignación de profesores por curso)
  try {
    const qProf = collection(db, "curso_profesores");
    subs.cursoProfesores = onSnapshot(qProf, (snap) => {
      const map = {};
      snap.forEach((d) => {
        const data = d.data();
        // Clave del mapa = id del curso. Se usa el campo cursoId si existe y, si no,
        // el propio id del documento (así los documentos creados manualmente en la
        // consola, que a menudo solo tienen el array `profesores`, también se leen).
        const key = data.cursoId || d.id;
        map[key] = normalizeProfesoresRefList(data.profesores);
      });
      state.profesoresPorCurso = map;
      if (state.user && state.view.name === "cursos-escolares") safeRenderMain("curso-profesores-snapshot");
    }, (err) => {
      console.warn("subscribeCursoProfesores:", err.code || err.message);
    });
  } catch (e) {
    console.warn("No se pudo suscribir a curso_profesores:", e);
  }

  // 5) Suscripción al propio perfil (si hay usuario logueado)
  if (state.user) {
    subs.ownProfile = subscribeOwnProfile(state.user.uid, (profile, err) => {
      if (profile) {
        state.userProfile = profile;
        // Si se registró un aviso de reglas ANTES de cargar el perfil (la
        // denegación puede llegar antes que el perfil), reintentar ahora que ya
        // se conoce el rol.
        _mostrarAvisoReglasSiToca();
        safeRenderMain("own-profile-snapshot");
      } else if (!err && state.user && state.userProfile && !state.userProfile._synthetic) {
        // El perfil existía (se cargó de Firestore) y ha DEJADO de existir: alguien
        // borró esta cuenta con la sesión abierta (auto-borrado, otro admin o
        // consola). Cerrar la sesión automáticamente; antes esto dejaba una sesión
        // sin permisos, errores "insufficient permissions" en cadena y un falso
        // aviso de reglas desactualizadas.
        _cerrarSesionHuerfana();
      }
    });
  }

  // 6) Polling periódico como red de seguridad
  // Usuarios: cada 30 segundos (por si la suscripción en tiempo real falla silenciosamente)
  timers.usuarios = setInterval(() => {
    if (state.user && isAdmin()) {
      refreshUsuariosNow();
    }
  }, 30000);

  // Evidencias: cada 60 segundos
  timers.lector = setInterval(() => {
    if (state.user) refreshEvidenciasNow("lector");
  }, 60000);
  timers.rm = setInterval(() => {
    if (state.user) refreshEvidenciasNow("rm");
  }, 60000);

  // 7) Refresco al volver a la pestaña (visibility change)
  // El onSnapshot puede morir silenciosamente tras un error de permisos; al volver
  // a la pestaña forzamos una lectura puntual para garantizar datos frescos.
  document.addEventListener("visibilitychange", handleVisibilityChange);
}

// Handler de visibility change (definido fuera para poder quitarlo si hace falta)
function handleVisibilityChange() {
  if (document.visibilityState === "visible" && state.user) {
    // Si había un aviso de reglas pintado, comprobar en segundo plano si las
    // reglas ya se publicaron (p. ej. el admin las acaba de publicar en otra pestaña)
    _sondearReglasSiBanner();
    // La pestaña acaba de volver a estar visible: refrescar todo
    refreshEvidenciasNow("all");
    if (isAdmin()) refreshUsuariosNow();
    // Re-suscribir por si las suscripciones anteriores murieron
    // (lo hacemos solo si hace más de 5 min que no se re-configura, para no abusar)
    if (!subs._lastResubscribe || Date.now() - subs._lastResubscribe > 5 * 60 * 1000) {
      // Re-crear las suscripciones en tiempo real (no las propias, que se re-crean en setupGlobalSync)
      try { subs.lector && subs.lector(); } catch (e) {}
      try { subs.rm && subs.rm(); } catch (e) {}
      try { subs.usuarios && subs.usuarios(); } catch (e) {}
      try { subs.cursos && subs.cursos(); } catch (e) {}
      subs.lector = subscribeAllLector((items) => {
        _todasEvidenciasLector = items || [];
        filtrarEvidenciasPorCursoActivo();
        if (state.user && ["cronograma-lector", "informes", "plan-lector"].includes(state.view.name)) safeRenderMain("lector-resubscribe");
      });
      subs.rm = subscribeAllRM((items) => {
        _todasEvidenciasRM = items || [];
        filtrarEvidenciasPorCursoActivo();
        if (state.user && ["curso-rm", "informes", "razonamiento-matematico"].includes(state.view.name)) safeRenderMain("rm-resubscribe");
      });
      _crearSubUsuarios("usuarios-resubscribe");
      subs.cursos = subscribeAllCursos((items) => {
        state.cursos = mergeCursos(items);
        filtrarEvidenciasPorCursoActivo();
        if (state.user && ["cursos-escolares", "informes", "cronograma-lector", "curso-rm"].includes(state.view.name)) safeRenderMain("cursos-resubscribe");
      });
      subs._lastResubscribe = Date.now();
    }
  }
}

// --- CRUD Cursos Escolares ---
function subscribeAllCursos(cb) {
  // Sin orderBy: evita excluir documentos de curso que no tengan el campo `id`
  // (p. ej. creados manualmente). Orden equivalente al anterior, en cliente.
  const q = collection(db, CURSOS_COLLECTION);
  return onSnapshot(q, (snap) => {
    const items = [];
    snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
    items.sort((a, b) => (b.id || "").localeCompare(a.id || ""));
    cb(items);
  }, (err) => {
    console.error("subscribeCursos:", err);
    // Si Firestore falla o está vacío, usar el curso por defecto
    cb(DEFAULT_CURSOS.map(c => ({ ...c })));
  });
}

async function createCurso(data) {
  const ref = doc(db, CURSOS_COLLECTION, data.id);
  const payload = { ...data, createdAt: Date.now(), updatedAt: Date.now() };
  await setDoc(ref, payload, { merge: true });
  return { id: data.id, ...payload };
}

async function deleteCurso(id) {
  return deleteDoc(doc(db, CURSOS_COLLECTION, id));
}

// Genera las evaluaciones por defecto para un curso nuevo (14/11/11 semanas a partir del planStart)
function generateEvaluacionesForCurso(curso) {
  const planStart = curso.planStart;
  const start = normalizeDate(planStart);
  const ev1End = new Date(start); ev1End.setDate(ev1End.getDate() + 14 * 7 - 1);
  const ev2Start = new Date(ev1End); ev2Start.setDate(ev2Start.getDate() + 3); // pequeño hueco
  const ev2End = new Date(ev2Start); ev2End.setDate(ev2End.getDate() + 11 * 7 - 1);
  const ev3Start = new Date(ev2End); ev3Start.setDate(ev3Start.getDate() + 3);
  const ev3End = new Date(ev3Start); ev3End.setDate(ev3End.getDate() + 11 * 7 - 1);
  return [
    { name: "Primera Evaluación", start: dateToISO(start), end: dateToISO(ev1End), weeks: 14 },
    { name: "Segunda Evaluación", start: dateToISO(ev2Start), end: dateToISO(ev2End), weeks: 11 },
    { name: "Tercera Evaluación", start: dateToISO(ev3Start), end: dateToISO(ev3End), weeks: 11 },
  ];
}

// Semanas que cubre un rango de fechas, contando la semana de inicio como la 1ª
// (mismo criterio histórico del centro: 15/09→19/12 = 14 semanas). Coincide con
// floor(días/7) + 1. Se usa para sugerir las semanas al configurar el calendario.
function computeWeeksFromRange(startISO, endISO) {
  const s = normalizeDate(startISO);
  const e = normalizeDate(endISO);
  if (isNaN(s.getTime()) || isNaN(e.getTime()) || e < s) return 0;
  const days = Math.round((e - s) / 86400000);
  return Math.max(1, Math.floor(days / 7) + 1);
}

// Total de semanas del plan según las evaluaciones configuradas
function totalWeeksOfEvals(evals) {
  return (evals || []).reduce((a, e) => a + (parseInt(e.weeks, 10) || 0), 0);
}

// Texto "14, 11 y 11" a partir de las evaluaciones (para ayudas y cabeceras)
function evaluacionesWeeksText(evals) {
  const w = (evals || []).map(e => parseInt(e.weeks, 10) || 0);
  if (w.length === 0) return "0";
  if (w.length === 1) return String(w[0]);
  if (w.length === 2) return `${w[0]} y ${w[1]}`;
  return `${w.slice(0, -1).join(", ")} y ${w[w.length - 1]}`;
}

// Evaluaciones a mostrar para un curso, con fallback al calendario histórico
function getEvaluacionesDisplay(curso) {
  const evals = getEvaluacionesForCurso(curso);
  return evals.map(e => ({ ...e }));
}

// Utilidades de calendario expuestas (consola y pruebas)
window._fechaUtils = { computeWeeksFromRange, totalWeeksOfEvals, evaluacionesWeeksText, generateEvaluacionesForCurso, getEvaluacionesDisplay, getCurrentCurso, getEvaluacionesForCurso, computePlanStartForYear, computeSchoolYearLabel };

    // se omite: sabemos con certeza que no queda ninguno y la bandera podría estar
    // desactualizada o ilegible.
    if (!window._forzarProtocoloAdmin) {

    try {
      const email = usernameToEmail(username);
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: nombre });
      // Perfil de administrador en Firestore
      await setDoc(doc(db, USUARIOS_COLLECTION, cred.user.uid), {
        uid: cred.user.uid,
        email,
        displayName: nombre,
        username,
        role: "admin",
        department: "",
        createdAt: Date.now(),
        updatedAt: Date.now(),
      });
      await ensureUsernameMapping({ uid: cred.user.uid, email, username });
      await markAdminExists();
      window._forzarProtocoloAdmin = false;
      // onAuthStateChanged cargará el perfil y entrará en la app automáticamente
    } catch (e) {
      console.error("[bootstrap] Error:", e);
      if (e.code === "auth/email-already-in-use") {
        // La cuenta Auth ya existe de un intento anterior. Intentar recuperarla.
        try {
          const email = usernameToEmail(username);
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          await updateProfile(cred.user, { displayName: nombre });
          const existingSnap = await getDoc(doc(db, USUARIOS_COLLECTION, cred.user.uid));
          if (!existingSnap.exists()) {
            await setDoc(doc(db, USUARIOS_COLLECTION, cred.user.uid), {
              uid: cred.user.uid,
              email,
              displayName: nombre,
              username,
              role: "admin",
              department: "",
              createdAt: Date.now(),
              updatedAt: Date.now(),
            });
          }
          await ensureUsernameMapping({ uid: cred.user.uid, email, username });
          await markAdminExists();
          window._forzarProtocoloAdmin = false;
        } catch (signInErr) {
          if (signInErr.code === "auth/invalid-credential" || signInErr.code === "auth/wrong-password") {
            showBootError(
              "Ese usuario ya tiene cuenta de acceso con OTRA contraseña: al borrar su perfil, la cuenta de Authentication NO llegó a borrarse y su contraseña sigue siendo la ANTERIOR al borrado. " +
              "Escribe en este formulario esa contraseña (la de antes de borrarlo) y el alta la reutilizará automáticamente. " +
              "Si no la recuerdas: Firebase Console → Authentication → Users → borra la cuenta " + usernameToEmail(username) + " y vuelve a crearlo aquí con la contraseña que prefieras."
            );
          } else {
            showBootError("Error: " + (signInErr.message || signInErr.code));
          }
          btn.disabled = false;
          btn.innerHTML = "Crear administrador inicial";
        }
      } else if (e.code === "auth/weak-password") {
        showBootError("Contraseña demasiado débil (mínimo 6 caracteres).");
        btn.disabled = false;
        btn.innerHTML = "Crear administrador inicial";
      } else if (e.code === "auth/operation-not-allowed") {
        showBootError("El método Email/Password está deshabilitado en Firebase. Entra en Firebase Console → Authentication → Sign-in method y habilítalo.");
        btn.disabled = false;
        btn.innerHTML = "Crear administrador inicial";
      } else if (e.code === "permission-denied" || (e.message || "").includes("permission")) {
        showBootError("Permiso denegado al crear el perfil. Publica las reglas de Firestore actualizadas (incluyen la colección 'config_public'): están disponibles en la sección Usuarios tras entrar.");
        btn.disabled = false;

// Comprueba (sin autenticar) si hay que ofrecer el protocolo del primer administrador.
// Se muestra si la bandera pública config_public/bootstrap indica que NO hay admin, o si
// la app ha detectado directamente que no queda ninguno (modo de recuperación forzado).
// Si la bandera no se puede leer (reglas sin publicar), se asume que ya hay admin.
async function checkBootstrapNeeded() {
  const panel = document.getElementById("bootstrap-panel");
  if (!panel) return;
  if (window._forzarProtocoloAdmin) {
    panel.classList.remove("hidden");
    return;
  }
  try {
    const snap = await getDoc(doc(db, CONFIG_PUBLIC_COLLECTION, "bootstrap"));
    const hasAdmin = snap.exists() && snap.data()?.hasAdmin === true;
    panel.classList.toggle("hidden", hasAdmin);
  } catch (e) {
    console.warn("[bootstrap] No se pudo comprobar si hay administradores:", e.code || e.message);
    panel.classList.add("hidden");
  }
}

// -----------------------------------------------------------------------------
// NAVEGACIÓN (v2.24): «Volver» flotante + pila de vistas.
// - _go(view): navega APILANDO la vista actual en state.navHistory (tope 30).
// - _goBack(): desapila y vuelve a la vista anterior; si la pila está vacía, Inicio.
// - No se apila si la vista destino es la MISMA pantalla (nombre + cursoId).
// - La pila se vacía al iniciar sesión (reset de la sesión en onAuthStateChanged).
// -----------------------------------------------------------------------------
const NOMBRE_VISTA = {
  "home": "Inicio",
  "plan-lector": "Plan Lector",
  "cronograma-lector": "Cronograma",
  "recursos-cl": "Recursos de Lectura",
  "razonamiento-matematico": "Razonamiento Matemático",
  "curso-rm": "Curso",
  "recursos-rm": "Recursos de RM",
  "mi-perfil": "Mi Perfil",
  "informes": "Informes de Uso",
  "gestion-usuarios": "Gestión de Usuarios",
  "cursos-escolares": "Cursos Escolares",
};
// Etiqueta legible de una vista (con parámetros: curso-rm muestra el nombre del curso)
function etiquetaVista(view) {
  if (!view) return "";
  if (view.name === "curso-rm" && view.cursoId) {
    const c = RM_CURSOS.find(x => x.id === view.cursoId);
    return c?.nombre || view.cursoId;
  }
  return NOMBRE_VISTA[view.name] || view.name;
}
// ¿Son la misma pantalla? (mismo nombre y mismos parámetros relevantes)
function mismaVista(a, b) {
  if (a === b) return true;
  if (!a || !b) return false;
  return a.name === b.name && (a.cursoId || null) === (b.cursoId || null);
}
function navigateTo(view, { push = true } = {}) {
  if (push && !mismaVista(view, state.view)) {
    state.navHistory.push({ ...state.view });
    if (state.navHistory.length > 30) state.navHistory.shift(); // tope de seguridad
  }
  state.view = view;
  state.openEvals = new Set();
  state.filter = { type: "all", value: "" };
  state.showReports = false;
  state.showHelp = {};
  window.scrollTo({ top: 0, behavior: "smooth" });
  renderAppShell();
}
// Expose navigation helpers
window._go = (view) => navigateTo(view, { push: true });
window._goBack = () => {
  const prev = state.navHistory.pop();
  navigateTo(prev || { name: "home" }, { push: false });
};
window._closeMobileMenu = () => document.getElementById("mobile-menu")?.classList.add("hidden");
window._logout = () => signOut(auth);
