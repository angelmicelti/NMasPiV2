function viewCronogramaLector() {
  // Usar evaluaciones del curso actual
  const curso = getCurrentCurso();
  const EVALS = getEvaluacionesForCurso(curso);
  // Build schedule by evaluation
  let cumul = 0;
  const schedule = EVALS.map((ev, idx) => {
    const weeks = [];
    for (let i = 1; i <= ev.weeks; i++) {
      const wnum = cumul + i;
      const { start } = getWeekDates(wnum);
      weeks.push({
        num: wnum,
        start,
        hour: getReadingHour(wnum),
        days: getDaysOfWeek(start).map((date, di) => ({
          date,
          name: DIA_SEMANA[di],
          isoDate: dateToISO(date),
        })),
      });
    }
    cumul += ev.weeks;
    return { evalIdx: idx, eval: ev, weeks };
  });

  return `
    <div class="space-y-4">
      <div class="overflow-hidden rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-600 text-white shadow-lg p-4 sm:p-6">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h1 class="text-lg sm:text-2xl font-bold">Cronograma Plan Lector (${escapeHtml(curso.label || curso.id)})</h1>
            <p class="text-sm text-white/85 mt-1">Sesiones de lectura de 30 minutos, rotando entre 1ª y 6ª hora.</p>
          </div>
          <button data-action="toggle-help" data-key="cronograma-lector" class="bg-white/15 hover:bg-white/25 text-white border border-white/20 rounded-lg px-3 py-1.5 text-sm font-medium shrink-0 flex items-center gap-1.5">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Ayuda
          </button>
        </div>
        ${state.showHelp["cronograma-lector"] ? `
          <div class="mt-4 text-left bg-yellow-50 text-slate-800 rounded-lg p-4 text-sm space-y-2">
            <p class="font-bold">Cómo usar el cronograma</p>
            <ul class="list-disc pl-5 space-y-1 text-xs sm:text-sm">
              <li>${EVALS.length} evaluaciones (${evaluacionesWeeksText(EVALS)} semanas). Total: ${EVALS.reduce((a, e) => a + (parseInt(e.weeks, 10) || 0), 0)} semanas. Pulsa la <strong>cabecera</strong> de cada evaluación para <strong>desplegarla o plegarla</strong>.</li>
              <li>La 1ª columna indica la <strong>hora de lectura</strong> de esa semana (rotación cada 6 semanas).</li>
              <li>Pulsa la <strong>celda del día</strong> y elige tu <strong>grupo</strong> en el menú (verde = ya tiene evidencia, con el nombre de quien la registró).</li>
              <li>Rellena el formulario: nombre (ya relleno con el de tu cuenta), <strong>tipología textual</strong> y <strong>tipo de texto</strong>; observaciones opcional. Guarda con «Registrar».</li>
              <li>La celda queda <span class="text-emerald-600 font-semibold">verde</span>: <strong>✓ grupo</strong> = tuya (puedes editarla o eliminarla); <strong>🔒 grupo</strong> = de otro (solo lectura). Solo el autor o un administrador puede modificarla.</li>
              <li>Todo se guarda al momento en Firebase, asociado a tu cuenta y al curso escolar activo.</li>
            </ul>
          </div>
        ` : ""}
      </div>

      <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600">
        <span class="font-semibold">Leyenda:</span>
        <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded cell-has-evidence" style="border:1px solid #34d399"></span>Con evidencia registrada</span>
        <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded cell-no-evidence" style="border:1px solid #e2e8f0"></span>Sin registrar</span>
        <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-100 border border-blue-300"></span>Hora de lectura</span>
      </div>

      <div class="space-y-3">
        ${schedule.map((s, idx) => `
          <details ${state.openEvals.has(idx) ? "open" : ""} class="border rounded-xl overflow-hidden border-slate-200 bg-white shadow-sm" id="eval-acc-${idx}">
            <summary class="px-4 py-3 hover:bg-slate-50 bg-gradient-to-r from-blue-50 to-cyan-50 flex items-center justify-between" data-action="toggle-eval" data-idx="${idx}">
              <div class="flex items-center gap-2 text-left">
                <svg class="w-4 h-4 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="font-bold text-slate-800 text-sm sm:text-base">${s.eval.name}</span>
                <span class="text-xs text-slate-500 hidden sm:inline">(${s.eval.weeks} semanas · ${formatDateES(new Date(s.eval.start))} → ${formatDateES(new Date(s.eval.end))})</span>
              </div>
              <svg class="w-4 h-4 text-slate-400 acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </summary>
            <div class="p-2 sm:p-3 space-y-2">
              ${s.weeks.map(w => renderWeekLector(w)).join("")}
            </div>
          </details>
        `).join("")}
      </div>
    </div>`;
}

function renderWeekLector(w) {
  // Buscar evidencias para cada día de esta semana
  const daysHtml = w.days.map(d => {
    const dayEvs = state.evidenciasLector.filter(e => e.fecha === d.isoDate);
    const has = dayEvs.length > 0;
    return `
      <button data-action="open-group-menu" data-fecha="${d.isoDate}" data-hora="${w.hour}" data-semana="${w.num}" data-dia="${d.name}"
        class="relative p-1.5 rounded border text-left transition min-h-[60px] sm:min-h-[80px] ${has ? 'cell-has-evidence' : 'cell-no-evidence'}">
        <div class="flex flex-col h-full">
          <span class="text-[10px] font-semibold text-slate-600 uppercase tracking-wide">${d.name.slice(0, 3)}</span>
          <span class="text-[10px] sm:text-xs text-slate-500">${d.date.getDate()}/${d.date.getMonth() + 1}</span>
          ${has ? `
            <div class="mt-auto space-y-0.5">
              ${dayEvs.map(ev => {
                const canEdit = canEditEvidencia(ev);
                // Actividad realizada: tipología + tipo de texto
                let actividadRealizada = "";
                if (ev.tipologia) actividadRealizada += ev.tipologia;
                if (ev.tipoTexto) actividadRealizada += (actividadRealizada ? " · " : "") + ev.tipoTexto;
                return `<span data-action="${canEdit ? 'edit-ev-lector' : 'view-ev-lector'}" data-id="${ev.id}" data-stop-propagation="1"
                  class="block text-[9px] sm:text-[10px] ${canEdit ? 'text-emerald-700 bg-emerald-100 hover:bg-emerald-200 cursor-pointer' : 'text-slate-600 bg-slate-100 cursor-pointer'} rounded px-1 py-0.5"
                  title="${escapeHtml(ev.grupo)} - ${escapeHtml(ev.profesor || 'Sin nombre')}${canEdit ? ' (puedes editar)' : ' (solo lectura)'}">
                  <span class="font-semibold">${canEdit ? '✓' : '🔒'} ${escapeHtml(ev.grupo)}</span>${actividadRealizada ? `<span class="block text-[8px] sm:text-[9px] text-slate-600 truncate mt-0.5">${escapeHtml(actividadRealizada)}</span>` : ''}
                </span>`;
              }).join("")}
            </div>
          ` : `<span class="mt-auto text-[9px] sm:text-[10px] text-slate-400 inline-flex items-center gap-0.5">+ Añadir</span>`}
        </div>
      </button>`;
  }).join("");

  return `
    <div class="rounded-lg border border-slate-200 overflow-hidden bg-white">
      <div class="flex items-center justify-between px-3 py-1.5 bg-slate-50 border-b border-slate-200">
        <span class="text-xs font-bold text-slate-700">Semana ${w.num}</span>
        <span class="text-xs text-slate-500">${formatDateES(w.start)} → ${formatDateES(w.days[4].date)}</span>
      </div>
      <div class="grid grid-cols-[44px_repeat(5,1fr)] sm:grid-cols-[80px_repeat(5,1fr)] gap-0.5 p-1">
        <div class="flex flex-col items-center justify-center bg-blue-100 border border-blue-300 rounded p-1 text-center">
          <svg class="w-3 h-3 text-blue-700 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="text-[10px] sm:text-xs font-bold text-blue-700">${w.hour}ª</span>
        </div>
        ${daysHtml}
      </div>
    </div>`;
}

window._toggleEval = (idx) => {
  if (state.openEvals.has(idx)) state.openEvals.delete(idx);
  else state.openEvals.add(idx);
};

let pendingLectorCell = null;

window._openGroupMenu = (fecha, hora, semana, dia) => {
  pendingLectorCell = { fecha, hora, semana, dia };
  const evMap = new Map();
  state.evidenciasLector.forEach(e => evMap.set(`${e.fecha}|${e.grupo}`, e));

  const overlay = document.createElement("div");
  overlay.id = "group-menu-overlay";
  overlay.className = "fixed inset-0 z-50 flex items-end sm:items-center justify-center";
  overlay.innerHTML = `
    <div class="absolute inset-0 bg-black/40" data-action="close-group-menu"></div>
    <div class="relative bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-md p-5 slide-up max-h-[80vh] overflow-y-auto">
      <div class="flex items-center gap-2 mb-1">
        <svg class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>
        <h2 class="text-lg font-bold text-slate-800">Selecciona tu grupo</h2>
      </div>
      <p class="text-sm text-slate-500 mb-4">${dia}, semana ${semana} · ${formatDateES(new Date(fecha))} · ${hora}ª hora</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
        ${CLASS_GROUPS.map(g => {
          const existing = evMap.get(`${fecha}|${g}`);
          return `
            <button data-action="select-group-lector" data-grupo="${g}"
              class="p-3 rounded-lg border text-sm font-semibold transition ${existing ? 'bg-emerald-50 border-emerald-400 text-emerald-700 hover:bg-emerald-100' : 'bg-white border-slate-300 text-slate-700 hover:border-blue-400 hover:bg-blue-50'}">
              <span class="block">${g}</span>
              ${existing ? `<span class="text-[10px] font-normal text-emerald-600 mt-0.5 block">${escapeHtml(existing.profesor || "")}</span>` : ""}
            </button>`;
        }).join("")}
      </div>
    </div>`;
  document.body.appendChild(overlay);
};

window._closeGroupMenu = () => {
  document.getElementById("group-menu-overlay")?.remove();
  pendingLectorCell = null;
};

window._selectGroupLector = (grupo) => {
  if (!pendingLectorCell) return;
  const cell = pendingLectorCell;
  window._closeGroupMenu();
  openEvidenciaLectorDialog({ mode: "create", grupo, ...cell });
};

window._viewEvidenciaLector = (id) => {
  const ev = state.evidenciasLector.find(e => e.id === id);
  if (!ev) return;
  openEvidenciaLectorDialog({
    mode: "view",
    grupo: ev.grupo,
    fecha: ev.fecha,
    semana: ev.semana,
    dia: ev.dia,
    hora: ev.hora,
    existing: ev,
  });
};

window._editEvidenciaLector = (id) => {
  const ev = state.evidenciasLector.find(e => e.id === id);
  if (!ev) return;
  // Verificación de permisos: solo el creador o un admin pueden editar
  if (!canEditEvidencia(ev)) {
    alert("No tienes permiso para editar esta evidencia. Solo el profesor que la creó o un administrador pueden hacerlo.");
    return;
  }
  openEvidenciaLectorDialog({
    mode: "edit",
    grupo: ev.grupo,
    fecha: ev.fecha,
    semana: ev.semana,
    dia: ev.dia,
    hora: ev.hora,
    existing: ev,
  });
};

        ${isView ? `<p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1 mt-2 inline-flex items-center gap-1"><svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg> Solo lectura — no eres el autor</p>` : ""}

    tipoTextoSel.innerHTML = `<option value="">${t ? "Selecciona tipo" : "Primero elige tipología"}</option>` +
      (t && TIPOS_TEXTO[t] ? TIPOS_TEXTO[t].map(x => `<option value="${x}">${x}</option>`).join("") : "");

}

window._closeEvLectorDialog = () => {
  document.getElementById("ev-lector-dialog")?.remove();
  window._currentEvLector = null;
};

window._saveEvLector = async () => {
  const data = window._currentEvLector;
  if (!data) return;
  const profesor = document.getElementById("ev-lector-profesor").value.trim();
  const tipologia = document.getElementById("ev-lector-tipologia").value;
  const tipoTexto = document.getElementById("ev-lector-tipo-texto").value;
  const observacion = document.getElementById("ev-lector-obs").value.trim();
  const err = document.getElementById("ev-lector-error");
  err.classList.add("hidden");

  if (!profesor) { err.textContent = "Indica tu nombre."; err.classList.remove("hidden"); return; }
  if (!tipologia) { err.textContent = "Selecciona la tipología textual."; err.classList.remove("hidden"); return; }
  if (!tipoTexto) { err.textContent = "Selecciona el tipo de texto."; err.classList.remove("hidden"); return; }

  const btn = document.getElementById("ev-lector-save");
  btn.disabled = true;
  btn.textContent = "Guardando…";

  try {
    if (data.mode === "edit" && data.existing?.id) {
      await updateEvidenciaLector(data.existing.id, { profesor, tipologia, tipoTexto, observacion });
    } else {
      await addEvidenciaLector({
        plan: "lector", grupo: data.grupo, fecha: data.fecha, semana: data.semana,
        dia: data.dia, hora: data.hora, profesor, tipologia, tipoTexto, observacion,
      });
    }
    window._closeEvLectorDialog();
  } catch (e) {
    console.error(e);
    err.textContent = "Error al guardar. Inténtalo de nuevo.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = data.mode === "edit" ? "Guardar cambios" : "Registrar";
  }
};

window._deleteEvLector = async () => {
  const data = window._currentEvLector;
  if (!data?.existing?.id) return;
  if (!confirm("¿Seguro que deseas eliminar esta evidencia? Esta acción no se puede deshacer.")) return;
  try {
    await deleteEvidenciaLector(data.existing.id);
    window._closeEvLectorDialog();
  } catch (e) {
    console.error(e);
    alert("Error al eliminar.");
  }
};

// Sustituye a las hojas de cálculo: cada tarjeta «Feedback entre compañer@s»

// «Consultar» muestra las aportaciones del ámbito y del curso escolar activo;
// solo el autor o un administrador pueden editarlas o eliminarlas.
let _currentFeedback = null; // { tipo, mode: "form"|"list", editId }

function _feedbackSubtitulo(tipo) {
  return tipo === "rm"
    ? "Plan de Razonamiento Matemático"
    : "Plan Lector · Refuerzo de la Competencia Lingüística";
}

function _feedbackAutorNombre() {
  return state.userProfile?.displayName || state.user?.displayName || state.userProfile?.username || "";
}

function openFeedbackDialog(opts = {}) {
  _currentFeedback = { tipo: opts.tipo === "rm" ? "rm" : "lectura", mode: opts.mode === "list" ? "list" : "form", editId: opts.editId || null };
  const overlay = document.createElement("div");
  overlay.id = "feedback-dialog";
  overlay.className = "fixed inset-0 z-50 flex items-center justify-center p-3";
  overlay.innerHTML = `
    <div class="absolute inset-0 dialog-overlay" data-action="close-feedback"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md sm:max-w-lg max-h-[90vh] overflow-y-auto fade-in">
      <div id="fb-header"></div>
      <div id="fb-body"></div>
    </div>`;
  document.body.appendChild(overlay);
  _renderFeedbackHeader();
  if (_currentFeedback.mode === "form") _renderFeedbackForm();
  else _renderFeedbackList();
}

function _renderFeedbackHeader() {
  const header = document.getElementById("fb-header");
  if (!header || !_currentFeedback) return;
  const tabBase = "px-3 py-2 text-sm font-medium rounded-lg transition flex items-center gap-1.5";
  const tabOn = "bg-blue-50 text-blue-700 border border-blue-200";
  const tabOff = "text-slate-600 hover:bg-slate-100 border border-transparent";
  const n = state.feedback.filter(a => a.tipo === _currentFeedback.tipo).length;
  header.innerHTML = `
    <div class="p-5 pb-3 border-b border-slate-200">
      <div class="flex items-start justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
            Feedback entre compañer@s
          </h2>
          <p class="text-sm text-slate-500 mt-1">${_feedbackSubtitulo(_currentFeedback.tipo)} · curso ${cursoEscolarActivo()}</p>
        </div>
        <button data-action="close-feedback" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100" title="Cerrar">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="flex gap-2 mt-4">
        <button data-action="fb-mode-form" class="${tabBase} ${_currentFeedback.mode === "form" ? tabOn : tabOff}">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Añadir aportación
        </button>
        <button data-action="fb-mode-list" class="${tabBase} ${_currentFeedback.mode === "list" ? tabOn : tabOff}">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Consultar (${n})
        </button>
      </div>
    </div>`;
}

function _renderFeedbackForm() {
  const body = document.getElementById("fb-body");
  if (!body || !_currentFeedback) return;
  _currentFeedback.mode = "form";
  _renderFeedbackHeader();
  const existing = _currentFeedback.editId ? state.feedback.find(a => a.id === _currentFeedback.editId) : null;
  const tipo = existing?.tipo || _currentFeedback.tipo;
  const tituloVal = existing?.titulo || "";
  const descVal = existing?.descripcion || "";
  const urlVal = existing?.url || "";
  body.innerHTML = `
    <div class="p-5 space-y-3">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tipo de actividad *</label>
        <div class="grid gap-2 sm:grid-cols-2">
          <label class="flex items-center gap-2 p-3 rounded-lg border border-slate-300 cursor-pointer hover:bg-blue-50/40 ${tipo === "rm" ? "border-blue-300 bg-blue-50/60" : ""}">
            <input id="fb-tipo-rm" type="checkbox" ${tipo === "rm" ? "checked" : ""} class="w-4 h-4 accent-blue-600" />
            <span class="text-sm text-slate-700">${FEEDBACK_TIPOS.rm}</span>
          </label>
          <label class="flex items-center gap-2 p-3 rounded-lg border border-slate-300 cursor-pointer hover:bg-blue-50/40 ${tipo === "lectura" ? "border-blue-300 bg-blue-50/60" : ""}">
            <input id="fb-tipo-lectura" type="checkbox" ${tipo === "lectura" ? "checked" : ""} class="w-4 h-4 accent-blue-600" />
            <span class="text-sm text-slate-700">${FEEDBACK_TIPOS.lectura}</span>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Autor/a</label>
        <input id="fb-autor" type="text" value="${escapeHtml(_feedbackAutorNombre())}" disabled class="w-full h-11 px-3 rounded-lg border border-slate-300 bg-slate-50 text-slate-600 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Título de la actividad *</label>
        <input id="fb-titulo" type="text" value="${escapeHtml(tituloVal)}" maxlength="120" placeholder="Título breve que identifique la actividad" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción *</label>
        <input id="fb-descripcion" type="text" value="${escapeHtml(descVal)}" maxlength="400" placeholder="En qué consiste, cómo aplicarla, materiales…" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">URL (opcional)</label>
        <input id="fb-url" type="text" value="${escapeHtml(urlVal)}" placeholder="https://… enlace al recurso" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" />
      </div>
      <div id="fb-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"></div>
    </div>
    <div class="p-5 border-t border-slate-200 flex flex-wrap gap-2">
      <button data-action="close-feedback" class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-medium">Cancelar</button>
      <button data-action="save-feedback" id="fb-save" class="ml-auto px-4 py-2 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white text-sm font-medium">${existing ? "Guardar cambios" : "Registrar aportación"}</button>
    </div>`;

  // Exclusión mutua: siempre exactamente un tipo marcado (el otro se desmarca;
  // no se permite dejar los dos sin marcar).
  const chRM = document.getElementById("fb-tipo-rm");
  const chLect = document.getElementById("fb-tipo-lectura");
  const exclusivo = (keep, other) => {
    if (keep.checked) { other.checked = false; }
    else if (!other.checked) { keep.checked = true; } // nunca dejar los dos sin marcar
    // Reaccionar al clic del otro checkbox: si se marca, desmarcar este
    other.onchange = () => {
      if (other.checked) { keep.checked = false; }
      else if (!keep.checked) { other.checked = true; }
      _fbRefrescarResaltadoTipo();
    };
    keep.onchange = () => {
      if (keep.checked) { other.checked = false; }
      else if (!other.checked) { keep.checked = true; }
      _fbRefrescarResaltadoTipo();
    };
  };
  exclusivo(chRM, chLect);
}

function _fbRefrescarResaltadoTipo() {
  const chRM = document.getElementById("fb-tipo-rm");
  const chLect = document.getElementById("fb-tipo-lectura");
  if (!chRM || !chLect) return;
  chRM.closest("label").classList.toggle("border-blue-300", chRM.checked);
  chRM.closest("label").classList.toggle("bg-blue-50/60", chRM.checked);
  chLect.closest("label").classList.toggle("border-blue-300", chLect.checked);
  chLect.closest("label").classList.toggle("bg-blue-50/60", chLect.checked);
}

            <button data-action="fb-delete" data-id="${a.id}" class="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 text-xs font-medium">Eliminar</button>

      <button data-action="fb-add" class="ml-auto px-4 py-2 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 text-white text-sm font-medium flex items-center gap-1.5">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Añadir aportación
      </button>
    </div>`;
};

  document.getElementById("feedback-dialog")?.remove();

};

window._openFeedback = (tipo) => {
  openFeedbackDialog({ tipo: tipo === "rm" ? "rm" : "lectura", mode: "form" });
};

window._feedbackMode = (mode) => {
  if (!_currentFeedback) return;
  if (mode === "list") _renderFeedbackList();
  else { _currentFeedback.editId = null; _renderFeedbackForm(); }
};

window._editAportacion = (id) => {
  const a = state.feedback.find(x => x.id === id);
  if (!a) return;
  if (!canEditAportacion(a)) {
    alert("No tienes permiso para editar esta aportación. Solo el profesor que la registró o un administrador pueden hacerlo.");
    return;
  }
  _currentFeedback.editId = id;
  _currentFeedback.tipo = a.tipo === "rm" ? "rm" : "lectura";
  _renderFeedbackForm();
};

window._saveFeedback = async () => {
  if (!_currentFeedback) return;
  const chRM = document.getElementById("fb-tipo-rm");
  const chLect = document.getElementById("fb-tipo-lectura");
  const titulo = document.getElementById("fb-titulo").value.trim();
  const descripcion = document.getElementById("fb-descripcion").value.trim();
  const url = document.getElementById("fb-url").value.trim();
  const tipo = chRM.checked ? "rm" : (chLect.checked ? "lectura" : "");
  const err = document.getElementById("fb-error");
  err.classList.add("hidden");

  if (!tipo) { err.textContent = "Marca el tipo de actividad."; err.classList.remove("hidden"); return; }
  if (!titulo) { err.textContent = "Escribe el título de la actividad."; err.classList.remove("hidden"); return; }
  if (!descripcion) { err.textContent = "Escribe una descripción de la actividad."; err.classList.remove("hidden"); return; }
  if (url && !/^https?:\/\//i.test(url)) { err.textContent = "La URL debe empezar por http:// o https:// (o déjala vacía)."; err.classList.remove("hidden"); return; }

  const btn = document.getElementById("fb-save");
  btn.disabled = true;
  btn.textContent = "Guardando…";
  try {
    if (_currentFeedback.editId) {
      await updateAportacion(_currentFeedback.editId, { tipo, titulo, descripcion, url });
    } else {
      await addAportacion({ tipo, titulo, descripcion, url });
    }
    window._closeFeedbackDialog();
  } catch (e) {
    console.error(e);
    err.textContent = "Error al guardar. Inténtalo de nuevo.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = _currentFeedback.editId ? "Guardar cambios" : "Registrar aportación";
  }
};

window._deleteAportacion = async (id) => {
  const a = state.feedback.find(x => x.id === id);
  if (!a) return;
  if (!canEditAportacion(a)) {
    alert("No tienes permiso para eliminar esta aportación. Solo el profesor que la registró o un administrador pueden hacerlo.");
    return;
  }
  if (!confirm("¿Seguro que deseas eliminar esta aportación? Esta acción no se puede deshacer.")) return;
  try {
    await deleteAportacion(id);
    if (document.getElementById("feedback-dialog")) window._renderFeedbackList();
  } catch (e) {
    console.error(e);
    alert("Error al eliminar.");
  }
};

function viewCursoRM(cursoId) {
  const curso = RM_CURSOS.find(c => c.id === cursoId);
  if (!curso) return "<p>Curso no encontrado.</p>";

  // Materias específicas de este curso (excluyendo Matemáticas que va siempre en sesión 1)
  const cursoMaterias = (curso.materias || []).filter(m => m !== "Matemáticas");
  // Sesión 2: materias del ámbito CT (científico-tecnológico) del curso
  const materiasSesion2 = cursoMaterias.filter(m => {
    const area = MATERIA_TO_AREA[m];
    return area === "CT";
  });
  // Sesión 3: resto de materias (SL + AR)
  const materiasSesion3 = cursoMaterias.filter(m => {
    const area = MATERIA_TO_AREA[m];
    return area === "SL" || area === "AR";
  });
  // Fallback: si no hay materias CT, usar todas; si no hay SL/AR, usar todas
  if (materiasSesion2.length === 0) materiasSesion2.push(...cursoMaterias);
  if (materiasSesion3.length === 0) materiasSesion3.push(...cursoMaterias);

  // Generate schedule
  const EVALS = getEvaluacionesForCurso(getCurrentCurso());
  const totalWeeks = EVALS.reduce((a, e) => a + e.weeks, 0);
  const schedule = [];
  for (let w = 1; w <= totalWeeks; w++) {
    const { start, end } = getWeekDates(w);
    const evalIdx = getEvaluationForWeek(w);

    // Sesión 1: siempre Matemáticas
    const sesion1Actividad = ACTIVIDADES_MATEMATICAS[(w - 1) % ACTIVIDADES_MATEMATICAS.length];
    const sesion1 = { sesion: 1, materia: "Matemáticas", actividad: sesion1Actividad, codigo: `MA.C.E.${1 + ((w - 1) % 9)}.3` };

    // Sesión 2: rotación entre materias CT del curso
    const m2 = materiasSesion2[(w - 1) % materiasSesion2.length] || materiasSesion2[0];
    const sesion2 = { sesion: 2, materia: m2, actividad: `Actividad de razonamiento matemático en ${m2}`, codigo: "RM.C.E.2" };

    // Sesión 3: rotación entre materias SL/AR del curso
    const m3 = materiasSesion3[(w - 1) % materiasSesion3.length] || materiasSesion3[0];
    // Si la materia es Lengua, usar una actividad específica del PDF de la Orden de 30 de mayo de 2023
    let actividadSesion3 = `Aplicación de matemáticas en ${m3}`;
    let codigoSesion3 = "RM.C.E.3";
    if (m3 === "Lengua") {
      const actLengua = getActividadLenguaRM(cursoId, w);
      if (actLengua) {
        actividadSesion3 = actLengua;
        codigoSesion3 = "LCL.C.E.RM";
      }
    }
    const sesion3 = { sesion: 3, materia: m3, actividad: actividadSesion3, codigo: codigoSesion3 };

    schedule.push({ num: w, start, end, evalIdx, sesiones: [sesion1, sesion2, sesion3] });
  }

  // Group by evaluation (curso-específico)
  const scheduleByEval = EVALS.map((ev, idx) => ({
    eval: ev,
    semanas: schedule.filter(s => s.evalIdx === idx),
  }));

  // All subjects (for filter)
  const allSubjects = new Set();
  schedule.forEach(s => s.sesiones.forEach(ses => allSubjects.add(ses.materia)));
  const subjectsArr = Array.from(allSubjects).sort();

  // Filter function
  function isVisible(sesion) {
    if (state.filter.type === "all") return true;
    if (state.filter.type === "subject") return sesion.materia === state.filter.value;
    if (state.filter.type === "ambito") return AMBITOS[state.filter.value]?.materias.includes(sesion.materia);
    return true;
  }

  // Counts for chart
  const counts = {};
  state.evidenciasRM.forEach(e => {
    if (e.cursoId === cursoId) counts[e.materia] = (counts[e.materia] || 0) + 1;
  });
  const totalEv = Object.values(counts).reduce((a, b) => a + b, 0);

  // Evidencia helper
  function getEv(grupo, semana, sesion) {
    return state.evidenciasRM.find(e => e.cursoId === cursoId && e.grupo === grupo && e.semana === semana && e.sesion === sesion);
  }

  return `
    <div class="space-y-4">
      <div class="overflow-hidden rounded-2xl bg-gradient-to-br ${curso.gradiente} text-white shadow-lg p-4 sm:p-6">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h1 class="text-lg sm:text-2xl font-bold">Plan de Razonamiento Matemático (${curso.nombre})</h1>
            <p class="text-sm text-white/85 mt-1">Cronograma interactivo · ${totalWeeks} semanas · 3 sesiones/semana</p>
          </div>
          <button onclick="window._go({name:'razonamiento-matematico'})" class="shrink-0 px-3 py-2 rounded-lg bg-white/15 hover:bg-white/25 text-white text-sm font-medium flex items-center gap-1.5 transition border border-white/20">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Volver
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2 text-sm font-semibold text-slate-700">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filtrar
          </div>
          <button data-action="toggle-reports" class="px-3 py-1.5 rounded-md text-sm font-medium ${state.showReports ? 'bg-slate-800 text-white' : 'border border-slate-300 hover:bg-slate-50'}">
            <svg class="w-4 h-4 inline mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Informes
          </button>
        </div>
        <div class="space-y-2">
          <p class="text-xs font-semibold text-slate-600">Por asignatura:</p>
          <div class="flex flex-wrap gap-1.5">
            <button data-action="set-filter" data-filter-type="all" data-filter-value="" class="h-8 px-3 rounded-md text-xs font-medium ${state.filter.type === 'all' ? 'bg-slate-800 text-white' : 'border border-slate-300 hover:bg-slate-50'}">↺ Mostrar todo</button>
            ${subjectsArr.map(s => {
              const active = state.filter.type === "subject" && state.filter.value === s;
              const color = SUBJECT_COLORS[s] || "#64748B";
              return `<button data-action="set-filter" data-filter-type="subject" data-filter-value="${s}" class="h-8 px-3 rounded-md text-xs font-medium transition" style="${active ? `background:${color};color:white` : `border:1px solid ${color};color:${color}`}">${s}</button>`;
            }).join("")}
          </div>
        </div>
        <div class="space-y-2 mt-3">
          <p class="text-xs font-semibold text-slate-600">Por ámbito:</p>
          <div class="flex flex-wrap gap-1.5">
            ${["CT", "SL", "AR"].map(a => `
              <button data-action="set-filter" data-filter-type="ambito" data-filter-value="${a}" class="h-8 px-3 rounded-md text-xs font-medium ${state.filter.type === 'ambito' && state.filter.value === a ? 'bg-slate-800 text-white' : 'border border-slate-300 hover:bg-slate-50'}">${a} · ${AMBITOS[a].nombre}</button>
            `).join("")}
          </div>
        </div>
      </div>

      ${state.showReports ? renderReportsPanel(curso, schedule) : ""}

      ${totalEv > 0 ? renderDistributionChart(counts, totalEv) : ""}

      <div class="space-y-3">
        ${scheduleByEval.map((g, idx) => `
          <details ${state.openEvals.has(idx) ? "open" : ""} class="border rounded-xl overflow-hidden border-slate-200 bg-white shadow-sm">
            <summary class="px-4 py-3 hover:bg-slate-50 bg-gradient-to-r from-purple-50 to-indigo-50 flex items-center justify-between" data-action="toggle-eval" data-idx="${idx}">
              <div class="flex items-center gap-2 text-left">
                <svg class="w-4 h-4 text-purple-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="font-bold text-slate-800 text-sm sm:text-base">${g.eval.name}</span>
                <span class="text-xs text-slate-500 hidden sm:inline">(${g.eval.weeks} semanas)</span>
              </div>
              <svg class="w-4 h-4 text-slate-400 acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </summary>
            <div class="p-2 sm:p-3 space-y-2">
              ${g.semanas.map(sem => renderWeekRM(sem, curso, isVisible, getEv)).join("")}
            </div>
          </details>
        `).join("")}
      </div>
    </div>`;
}

function renderWeekRM(sem, curso, isVisible, getEv) {
  const sesionesHtml = sem.sesiones.map(s => {
    if (!isVisible(s)) {
      return `<div class="rounded border border-dashed border-slate-200 p-3 text-center text-xs text-slate-400">Sesión ${s.sesion} · Oculta por filtro</div>`;
    }
    const color = SUBJECT_COLORS[s.materia] || "#64748B";
    // Recoger actividades realizadas de los grupos que tienen registro en esta sesión
    const gruposConEv = curso.grupos.map(g => {
      const ev = getEv(g, sem.num, s.sesion);
      return ev ? { grupo: g, ev } : null;
    }).filter(Boolean);
    const tieneActividadesRealizadas = gruposConEv.length > 0;
    return `
      <div class="rounded-lg border border-slate-200 p-3 bg-white" style="border-left: 4px solid ${color}">
        <div class="flex items-start justify-between mb-1">
          <span class="text-[10px] font-bold uppercase tracking-wide text-slate-500">Sesión ${s.sesion}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded" style="background:${color}20;color:${color}">${s.materia}</span>
        </div>
        ${tieneActividadesRealizadas
          ? gruposConEv.map(({ grupo, ev }) => `

window._generateSubjectPDF = (cursoId, cursoNombre) => {
  const subject = document.getElementById("rpt-subject").value;
  if (!subject) { alert("Selecciona una materia."); return; }
  const eval1 = document.getElementById("rpt-eval1").checked;
  const eval2 = document.getElementById("rpt-eval2").checked;
  const eval3 = document.getElementById("rpt-eval3").checked;

  const evs = state.evidenciasRM.filter(e => e.cursoId === cursoId && e.materia === subject);

  // Usar evaluaciones del curso actual en vez de constantes globales
  const EVALS = getEvaluacionesForCurso(getCurrentCurso());
  const totalWeeks = EVALS.reduce((a, e) => a + e.weeks, 0);

  // Materias específicas del curso
  const curso = RM_CURSOS.find(c => c.id === cursoId);
  const cursoMaterias = (curso?.materias || []).filter(m => m !== "Matemáticas");
  const materiasSesion2 = cursoMaterias.filter(m => MATERIA_TO_AREA[m] === "CT");
  const materiasSesion3 = cursoMaterias.filter(m => MATERIA_TO_AREA[m] === "SL" || MATERIA_TO_AREA[m] === "AR");
  if (materiasSesion2.length === 0) materiasSesion2.push(...cursoMaterias);
  if (materiasSesion3.length === 0) materiasSesion3.push(...cursoMaterias);

  const schedule = [];
  for (let w = 1; w <= totalWeeks; w++) {
    const { start } = getWeekDates(w);
    const evalIdx = getEvaluationForWeek(w);
    if ((evalIdx === 0 && !eval1) || (evalIdx === 1 && !eval2) || (evalIdx === 2 && !eval3)) continue;
    const m2 = materiasSesion2[(w - 1) % materiasSesion2.length] || materiasSesion2[0];
    const m3 = materiasSesion3[(w - 1) % materiasSesion3.length] || materiasSesion3[0];
    schedule.push({ num: w, start, sesiones: [
      { sesion: 1, materia: "Matemáticas", actividad: "", codigo: "" },
      { sesion: 2, materia: m2, actividad: "", codigo: "" },
      { sesion: 3, materia: m3, actividad: "", codigo: "" },
    ] });
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text(`Informe RM - ${cursoNombre}`, 14, 18);
  doc.setFontSize(11);
  doc.text(`Materia: ${subject}`, 14, 26);
  doc.text(`Evaluaciones: ${[eval1 && "1ª", eval2 && "2ª", eval3 && "3ª"].filter(Boolean).join(", ")}`, 14, 32);
  doc.text(`Evidencias registradas: ${evs.length}`, 14, 38);

  const rows = [];
  schedule.forEach(s => {
    const sesion = s.sesiones.find(x => x.materia === subject);
    if (!sesion) return;
    const evsIn = evs.filter(e => e.semana === s.num && e.sesion === sesion.sesion);
    if (evsIn.length === 0) {
      rows.push([`S${s.num}`, sesion.sesion, formatDateES(s.start), "—", "—", "Sin registrar"]);
    } else {
      evsIn.forEach(e => {
        rows.push([`S${s.num}`, sesion.sesion, formatDateES(s.start), e.grupo, e.profesor, e.actividadRealizada]);
      });
    }
  });

  doc.autoTable({
    head: [["Semana", "Sesión", "Inicio", "Grupo", "Profesor", "Actividad"]],
    body: rows,
    startY: 44,
    styles: { fontSize: 9, cellPadding: 2 },
    headStyles: { fillColor: [79, 70, 229] },
  });

  doc.save(`informe_RM_${cursoId}_${subject.replace(/\s+/g, "_")}.pdf`);
};

window._generateTrimestrePDF = (cursoId, cursoNombre) => {
  const tri1 = document.getElementById("rpt-tri1").checked;
  const tri2 = document.getElementById("rpt-tri2").checked;
  const tri3 = document.getElementById("rpt-tri3").checked;
  const wanted = [];
  if (tri1) for (let i = 1; i <= 14; i++) wanted.push(i);
  if (tri2) for (let i = 15; i <= 25; i++) wanted.push(i);
  if (tri3) for (let i = 26; i <= 36; i++) wanted.push(i);
  if (wanted.length === 0) { alert("Selecciona al menos un trimestre."); return; }

  const evs = state.evidenciasRM.filter(e => e.cursoId === cursoId && wanted.includes(e.semana));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text(`Informe RM por Trimestre - ${cursoNombre}`, 14, 18);
  doc.setFontSize(11);
  doc.text(`Trimestres: ${[tri1 && "1º (S1-S14)", tri2 && "2º (S15-S25)", tri3 && "3º (S26-S36)"].filter(Boolean).join(", ")}`, 14, 26);
  doc.text(`Evidencias: ${evs.length}`, 14, 32);

  const rows = evs.sort((a, b) => a.semana - b.semana || a.sesion - b.sesion).map(e => [
    `S${e.semana}`, e.sesion, e.grupo, e.materia, e.profesor, e.actividadRealizada, e.observacion || "",
  ]);

  doc.autoTable({
    head: [["Semana", "Ses.", "Grupo", "Materia", "Profesor", "Actividad", "Obs."]],
    body: rows,
    startY: 38,
    styles: { fontSize: 8, cellPadding: 2 },
    headStyles: { fillColor: [79, 70, 229] },
  });

  doc.save(`informe_RM_${cursoId}_trimestres.pdf`);
};

function renderDistributionChart(counts, total) {
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const radius = 60;
  const circ = 2 * Math.PI * radius;
  let acc = 0;
  const segments = entries.map(([materia, count]) => {
    const fraction = count / total;
    const dash = fraction * circ;
    const offset = acc;
    acc += dash;
    return { materia, count, dash, offset };
  });

  return `
    <div class="bg-white rounded-xl border border-slate-200 p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <h3 class="text-sm font-bold text-slate-800">Distribución por materia (${total} evidencias)</h3>
      </div>
      <div class="flex flex-col sm:flex-row items-center gap-4">
        <svg width="160" height="160" viewBox="0 0 160 160" class="shrink-0">
          <circle cx="80" cy="80" r="${radius}" fill="none" stroke="#e2e8f0" stroke-width="20" />
          ${segments.map(s => `
            <circle cx="80" cy="80" r="${radius}" fill="none"
              stroke="${SUBJECT_COLORS[s.materia] || "#64748B"}" stroke-width="20"
              stroke-dasharray="${s.dash} ${circ - s.dash}"
              stroke-dashoffset="${-s.offset}"
              transform="rotate(-90 80 80)" />
          `).join("")}
          <text x="80" y="76" text-anchor="middle" fill="#1e293b" style="font-size:22px;font-weight:bold">${total}</text>
          <text x="80" y="92" text-anchor="middle" fill="#64748b" style="font-size:10px">total</text>
        </svg>
        <div class="flex-1 w-full grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">
          ${segments.map(s => `
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-sm shrink-0" style="background:${SUBJECT_COLORS[s.materia] || "#64748B"}"></span>
              <span class="text-slate-700 truncate flex-1">${s.materia}</span>
              <span class="font-bold text-slate-800">${s.count} (${Math.round((s.count / total) * 100)}%)</span>
            </div>
          `).join("")}
        </div>
      </div>
    </div>`;
}

window._closeEvRMDialog = () => {
  document.getElementById("ev-rm-dialog")?.remove();
  window._currentEvRM = null;
};

window._saveEvRM = async () => {
  const data = window._currentEvRM;
  if (!data) return;
  const profesor = document.getElementById("ev-rm-profesor").value.trim();
  const actividadRealizada = document.getElementById("ev-rm-actividad").value.trim();
  const observacion = document.getElementById("ev-rm-obs").value.trim();
  const err = document.getElementById("ev-rm-error");
  err.classList.add("hidden");
  if (!profesor) { err.textContent = "Indica tu nombre."; err.classList.remove("hidden"); return; }
  if (!actividadRealizada) { err.textContent = "Indica la actividad realizada."; err.classList.remove("hidden"); return; }

  const btn = document.getElementById("ev-rm-save");
  btn.disabled = true;
  btn.textContent = "Guardando…";
  try {
    if (data.mode === "edit" && data.existing?.id) {
      await updateEvidenciaRM(data.existing.id, { profesor, actividadRealizada, observacion });
    } else {
      await addEvidenciaRM({
        plan: "rm", cursoId: data.cursoId, grupo: data.grupo, semana: data.semana,
        sesion: data.sesion, materia: data.materia, actividad: data.actividad, codigo: data.codigo,
        profesor, actividadRealizada, observacion,
      });
    }
    window._closeEvRMDialog();
  } catch (e) {
    console.error(e);
    err.textContent = "Error al guardar. Inténtalo de nuevo.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = data.mode === "edit" ? "Guardar cambios" : "Registrar";
  }
};

window._deleteEvRM = async () => {
  const data = window._currentEvRM;
  if (!data?.existing?.id) return;
  if (!confirm("¿Seguro que deseas eliminar esta evidencia?")) return;
  try {
    await deleteEvidenciaRM(data.existing.id);
    window._closeEvRMDialog();
  } catch (e) {
    console.error(e);
    alert("Error al eliminar.");
  }
};

window._savePerfil = async () => {
  const nombre = document.getElementById("perfil-nombre").value.trim();
  const departamento = document.getElementById("perfil-departamento").value;
  const err = document.getElementById("perfil-error");
  const success = document.getElementById("perfil-success");
  err.classList.add("hidden");
  success.classList.add("hidden");
  if (nombre.length < 3) { err.textContent = "Indica tu nombre completo."; err.classList.remove("hidden"); return; }
  if (!departamento) { err.textContent = "Selecciona tu departamento."; err.classList.remove("hidden"); return; }
  const btn = document.getElementById("perfil-save-btn");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Guardando…`;
  try {
    // Actualizar perfil en Firebase Auth
    if (state.user && state.user.displayName !== nombre) {
      await updateProfile(state.user, { displayName: nombre });
    }
    // Actualizar perfil en Firestore
    const updated = await updateUserProfile(state.user.uid, { displayName: nombre, department: departamento });
    state.userProfile = updated;
    success.textContent = "Perfil actualizado correctamente.";
    success.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios`;
    // Re-render para actualizar el nombre en la barra superior
    renderAppShell();
  } catch (e) {
    console.error(e);
    err.textContent = "Error al guardar el perfil. Inténtalo de nuevo.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios`;
  }
};

// Cambio de contraseña por el propio usuario (Mi Perfil).
// Firebase exige una sesión reciente: se reautentica con la contraseña actual
// (user.email es el de la cuenta Auth: sintético <usuario>@iesvdv.planes en las
// cuentas nuevas, correo real en las antiguas) y después se actualiza la contraseña.
window._saveMiPassword = async () => {
  const actual = document.getElementById("cp-actual")?.value || "";
  const nueva = document.getElementById("cp-nueva")?.value || "";
  const nueva2 = document.getElementById("cp-nueva2")?.value || "";
  const err = document.getElementById("cp-error");
  const success = document.getElementById("cp-success");
  const btn = document.getElementById("cp-save-btn");
  if (!err || !success || !btn) return;
  err.classList.add("hidden");
  success.classList.add("hidden");
  const showError = (m) => { err.textContent = m; err.classList.remove("hidden"); };

  const user = auth.currentUser || state.user;
  if (!user || !user.email) { showError("No hay una sesión activa. Vuelve a entrar en la aplicación."); return; }
  if (!actual) { showError("Escribe tu contraseña actual."); return; }
  if (nueva.length < 6) { showError("La nueva contraseña debe tener al menos 6 caracteres."); return; }
  if (nueva !== nueva2) { showError("Las contraseñas nuevas no coinciden."); return; }
  if (nueva === actual) { showError("La nueva contraseña debe ser distinta de la actual."); return; }

  btn.disabled = true;
  const btnHtml = btn.innerHTML;
  btn.innerHTML = "Cambiando…";
  try {
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, actual));
    await updatePassword(user, nueva);
    success.textContent = "Contraseña cambiada correctamente. Úsala la próxima vez que entres; tu sesión actual sigue abierta.";
    success.classList.remove("hidden");
    ["cp-actual", "cp-nueva", "cp-nueva2"].forEach((id) => { const el = document.getElementById(id); if (el) el.value = ""; });
  } catch (e) {
    console.error("[_saveMiPassword]", e.code || e.message);
    const map = {
      "auth/wrong-password": "La contraseña actual no es correcta.",
      "auth/invalid-credential": "La contraseña actual no es correcta.",
      "auth/invalid-login-credentials": "La contraseña actual no es correcta.",
      "auth/user-mismatch": "La sesión no corresponde a este usuario. Vuelve a entrar e inténtalo de nuevo.",
      "auth/user-not-found": "No se encontró la cuenta. Vuelve a entrar e inténtalo de nuevo.",
      "auth/weak-password": "La nueva contraseña es demasiado débil (mínimo 6 caracteres).",
      "auth/requires-recent-login": "Por seguridad, cierra sesión y vuelve a entrar; después podrás cambiar la contraseña.",
      "auth/too-many-requests": "Demasiados intentos. Espera un momento e inténtalo de nuevo.",
      "auth/network-request-failed": "Fallo de red. Comprueba tu conexión e inténtalo de nuevo.",
    };
    showError(map[e.code] || "No se pudo cambiar la contraseña: " + (e.code || e.message || "error"));
  } finally {
    btn.disabled = false;
    btn.innerHTML = btnHtml;
  }
};

window._showInformeModal = () => {

  // Recoger datos del formulario del informe
  const period = state.informeConfig.period;

  let fechaInicio, fechaFin, periodLabel;

// Estado del formulario de informes (inicializado en state.informeConfig)

window._setPeriod = (period) => {
  state.informeConfig.period = period;
  // Actualizar botones
  ["diario", "semanal", "mensual", "anual"].forEach(p => {
    const btn = document.getElementById(`btn-periodo-${p}`);

    if (p === period) {
      btn.className = "px-3 py-2.5 rounded-lg border-2 border-blue-500 bg-blue-50 text-blue-700 text-sm font-medium transition";
    } else {
      btn.className = "px-3 py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-medium transition";
    }
  });
  window._renderFechasContainer();
};

window._renderFechasContainer = () => {
  const container = document.getElementById("rpt-fechas-container");
  if (!container) return;
  const period = state.informeConfig.period;
  const curso = getCurrentCurso();
  const today = dateToISO(new Date());

  if (period === "diario") {
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Día *</label>
        <input id="rpt-fecha" type="date" value="${today}" min="${curso.start}" max="${curso.end}" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" />
      </div>
      <div class="flex items-end">
        <p class="text-xs text-slate-500">El informe incluirá todas las evidencias registradas ese día concreto.</p>
      </div>`;
  } else if (period === "semanal") {
    // Generar listado de semanas del curso
    const EVALS = getEvaluacionesForCurso(curso);
    const totalWeeks = EVALS.reduce((a, e) => a + e.weeks, 0);
    const weeks = [];
    for (let w = 1; w <= totalWeeks; w++) {
      const { start, end } = getWeekDates(w);
      weeks.push(`<option value="${w}">Semana ${w} · ${formatDateES(start)} → ${formatDateES(end)}</option>`);
    }
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Semana *</label>
        <select id="rpt-semana" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white">
          ${weeks.join("")}
        </select>
      </div>
      <div class="flex items-end">
        <p class="text-xs text-slate-500">Cada semana abarca de lunes a viernes del cronograma del plan.</p>
      </div>`;
  } else if (period === "mensual") {
    const months = [];
    const start = normalizeDate(curso.start);
    const end = normalizeDate(curso.end);
    const cur = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cur <= end) {
      const y = cur.getFullYear();
      const m = cur.getMonth();
      const monthName = cur.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
      const mStart = dateToISO(new Date(y, m, 1));
      const mEnd = dateToISO(new Date(y, m + 1, 0));
      months.push(`<option value="${mStart}|${mEnd}">${monthName.charAt(0).toUpperCase() + monthName.slice(1)}</option>`);
      cur.setMonth(cur.getMonth() + 1);
    }
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mes *</label>
        <select id="rpt-mes" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white">
          ${months.join("")}
        </select>
      </div>
      <div class="flex items-end">
        <p class="text-xs text-slate-500">El informe agregará todas las evidencias del mes natural seleccionado.</p>
      </div>`;
  } else if (period === "anual") {
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Curso escolar *</label>
        <select id="rpt-curso" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white">
          ${(state.cursos).map(c => `<option value="${c.id}" ${c.id === curso.id ? "selected" : ""}>${c.label || c.id} · ${formatDateES(new Date(c.start))} → ${formatDateES(new Date(c.end))}</option>`).join("")}
        </select>
      </div>
      <div class="flex items-end">
        <p class="text-xs text-slate-500">El informe anual cubre desde el 1 de septiembre hasta el 31 de agosto del curso seleccionado.</p>
      </div>`;
  }
};

window._generateInforme = () => {
  const plan = document.querySelector('input[name="rpt-plan"]:checked')?.value || "lector";
  const area = document.querySelector('input[name="rpt-area"]:checked')?.value || "";
  const period = state.informeConfig.period;
  const curso = getCurrentCurso();

  // Recoger fechas según periodo
  let fechaInicio, fechaFin, periodLabel;
  if (period === "diario") {
    const f = document.getElementById("rpt-fecha").value;
    if (!f) { alert("Selecciona un día."); return; }
    fechaInicio = f; fechaFin = f;
    periodLabel = `Día ${formatDateES(new Date(f))}`;
  } else if (period === "semanal") {
    const wnum = parseInt(document.getElementById("rpt-semana").value);
    const { start, end } = getWeekDates(wnum);
    fechaInicio = dateToISO(start); fechaFin = dateToISO(end);
    periodLabel = `Semana ${wnum} (${formatDateES(start)} → ${formatDateES(end)})`;
  } else if (period === "mensual") {
    const v = document.getElementById("rpt-mes").value;
    const [s, e] = v.split("|");
    fechaInicio = s; fechaFin = e;
    const d = new Date(s);
    periodLabel = d.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  } else if (period === "anual") {
    const cursoId = document.getElementById("rpt-curso").value;
    const c = (state.cursos).find(x => x.id === cursoId) || curso;
    fechaInicio = c.start; fechaFin = c.end;
    periodLabel = `Curso ${c.label || c.id}`;
  }

  // Filtrar evidencias por fecha
  const inRange = (iso) => iso >= fechaInicio && iso <= fechaFin;
  let evsLector = state.evidenciasLector.filter(e => e.fecha && inRange(e.fecha));
  let evsRM = state.evidenciasRM.filter(e => {
    // Para RM usamos la fecha de la semana (lunes)
    if (!e.semana) return false;
    const { start } = getWeekDates(e.semana);
    return inRange(dateToISO(start));
  });

  // Filtrar por área
  if (area) {
    // Lector pertenece al área SL: solo se incluye si el filtro es SL
    if (area !== LECTOR_AREA) evsLector = [];
    evsRM = evsRM.filter(e => MATERIA_TO_AREA[e.materia] === area);
  }

  // Generar PDF
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const adminName = state.userProfile?.displayName || state.user?.email || "Administrador";
  const now = new Date();
  const generatedLabel = now.toLocaleString("es-ES");

  // Cabecera
  doc.setFontSize(18); doc.setTextColor(30, 41, 59);
  doc.text("Informe de uso — Planes IES", 14, 18);
  doc.setFontSize(11); doc.setTextColor(100, 116, 139);
  doc.text(INSTITUTO.nombre, 14, 25);
  doc.text(`Generado por: ${adminName}`, 14, 31);
  doc.text(`Fecha de generación: ${generatedLabel}`, 14, 37);

  // Línea separadora
  doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.5);
  doc.line(14, 41, 196, 41);

  // Resumen
  doc.setFontSize(13); doc.setTextColor(30, 41, 59);
  doc.text(`Periodo: ${periodLabel}`, 14, 49);
  doc.setFontSize(10); doc.setTextColor(100, 116, 139);
  const areaLabel = area ? `${area} · ${AMBITOS[area].nombre}` : "Todas las áreas";
  doc.text(`Área de competencia: ${areaLabel}`, 14, 55);

  let yPos = 65;

  // Sección Plan Lector
  if (plan === "lector" || plan === "ambos") {
    doc.setFontSize(13); doc.setTextColor(37, 99, 235);
    doc.text("Plan Lector", 14, yPos);
    yPos += 6;
    doc.setFontSize(10); doc.setTextColor(30, 41, 59);
    doc.text(`Total evidencias: ${evsLector.length}`, 14, yPos);
    yPos += 5;

    if (evsLector.length > 0) {
      const rows = evsLector.map(e => [
        e.fecha || "—",
        e.grupo || "—",
        e.hora ? `${e.hora}ª` : "—",
        e.profesor || "—",
        e.tipologia || "—",
        e.tipoTexto || "—",
        (e.observacion || "").slice(0, 50),
      ]);
      doc.autoTable({
        head: [["Fecha", "Grupo", "Hora", "Profesor", "Tipología", "Tipo texto", "Obs."]],
        body: rows,
        startY: yPos,
        styles: { fontSize: 8, cellPadding: 1.5 },
        headStyles: { fillColor: [37, 99, 235] },
        columnStyles: { 6: { cellWidth: 50 } },
      });
      yPos = doc.lastAutoTable.finalY + 8;
    } else {
      doc.setTextColor(148, 163, 184);
      doc.text("No hay evidencias del Plan Lector en este periodo.", 14, yPos);
      yPos += 8;
    }
  }

  // Sección Plan RM
  if (plan === "rm" || plan === "ambos") {
    if (plan === "ambos") { doc.addPage(); yPos = 20; }
    doc.setFontSize(13); doc.setTextColor(124, 58, 237);
    doc.text("Plan de Razonamiento Matemático", 14, yPos);
    yPos += 6;
    doc.setFontSize(10); doc.setTextColor(30, 41, 59);
    doc.text(`Total evidencias: ${evsRM.length}`, 14, yPos);
    yPos += 5;

    if (evsRM.length > 0) {
      const rows = evsRM.map(e => {
        const { start } = getWeekDates(e.semana);
        return [
          `S${e.semana}`,
          dateToISO(start),
          e.grupo || "—",
          e.materia || "—",
          e.sesion ? `${e.sesion}` : "—",
          e.profesor || "—",
          (e.actividadRealizada || "").slice(0, 60),
        ];
      });
      doc.autoTable({
        head: [["Sem.", "Fecha", "Grupo", "Materia", "Ses.", "Profesor", "Actividad"]],
        body: rows,
        startY: yPos,
        styles: { fontSize: 8, cellPadding: 1.5 },
        headStyles: { fillColor: [124, 58, 237] },
        columnStyles: { 6: { cellWidth: 60 } },
      });
      yPos = doc.lastAutoTable.finalY + 8;
    } else {
      doc.setTextColor(148, 163, 184);
      doc.text("No hay evidencias del Plan RM en este periodo.", 14, yPos);
      yPos += 8;
    }
  }

  // Pie de página
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(148, 163, 184);
    doc.text(`${INSTITUTO.nombre} · ${INSTITUTO.localidad} · Curso ${curso.label || curso.id}`, 14, 290);
    doc.text(`Página ${i} de ${pageCount}`, 196, 290, { align: "right" });
  }

  const planLabel = plan === "ambos" ? "ambos_planes" : (plan === "lector" ? "plan_lector" : "plan_rm");
  const areaSuffix = area ? `_${area}` : "";
  doc.save(`informe_${planLabel}_${period}${areaSuffix}.pdf`);
};

const FIRESTORE_RULES_USUARIOS = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // Administrador: usuario con rol 'admin' en su perfil de Firestore.
    // El rol se concede o revoca desde el panel de Gestión de usuarios de la
    // aplicación (o creando la primera cuenta con el protocolo del login).
    function isAdmin() {
      return request.auth != null
        && exists(/databases/$(database)/documents/usuarios/$(request.auth.uid))
        && get(/databases/$(database)/documents/usuarios/$(request.auth.uid)).data.role == 'admin';
    }

    // Colección usuarios
    match /usuarios/{uid} {
      allow read: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow create: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow update: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow delete: if isAdmin();
    }

    // Mapeo nombre de usuario -> correo (permite iniciar sesión con usuario y contraseña)
    // La lectura es pública porque el login necesita resolver el nombre ANTES de autenticar.
    match /usernames/{name} {
      allow read: if true;
      allow create: if request.auth != null && (isAdmin() || request.resource.data.uid == request.auth.uid);
      allow update, delete: if request.auth != null && (isAdmin() || resource.data.uid == request.auth.uid);
    }

    // Evidencias Plan Lector
    match /evidencias_lector/{docId} {
      allow read, write: if request.auth != null;
    }
    // Evidencias Plan RM
    match /evidencias_rm/{docId} {
      allow read, write: if request.auth != null;
    }
    // Aportaciones «Feedback entre compañer@s» (v2.21): cualquier profesor
    // autenticado puede leer y registrar; editar/borrar está limitado en la
    // aplicación al autor de la aportación y a los administradores.
    match /aportaciones/{docId} {
      allow read, write: if request.auth != null;
    }
    // Cursos escolares
    match /cursos/{docId} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    // Asignación de profesores por curso (solo admin puede escribir)
    match /curso_profesores/{docId} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    // Configuración pública (p. ej. config_public/bootstrap con hasAdmin):
    // lectura libre SIN autenticar para que el login sepa si debe ofrecer
    // crear el primer administrador; escritura solo para administradores.
    match /config_public/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }
  }
}`;

// =============================================================================
// ORDENACIÓN DE USUARIOS POR APELLIDOS
// El displayName está en orden natural "Nombre Apellidos" (la importación Séneca
// invierte "APELLIDOS, NOMBRE"), así que ordenar por displayName ordena por nombre
// de pila. Estas funciones derivan la clave de apellidos de cada usuario:
//   1) campo "apellidos" guardado en el perfil (la importación Séneca lo escribe con
//      el valor exacto previo a la coma del campo Empleado/a — fiable incluso con
//      apellidos compuestos: "Ruiz de Santa Quiter García");
//   2) displayName con coma ("Apellidos, Nombre");
//   3) displayName en orden natural: se toman las DOS últimas palabras
//      ("Carlos López Márquez" -> "López Márquez"); con una sola, esa.
// Las partículas iniciales (de, del, la, los, las) no cuentan para ordenar:
// "Juan de la Fuente Leal" ordena bajo F, como en Séneca.
// =============================================================================
function _apellidosUsuario(u) {
  if (!u) return "";
  const stored = String(u.apellidos || "").trim();
  if (stored) return stored;
  const dn = String(u.displayName || "").trim();
  if (!dn) return "";
  const ci = dn.indexOf(",");
  if (ci > 0) return dn.slice(0, ci).trim();
  const parts = dn.split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "";
  if (parts.length === 1) return parts[0];
  return parts.slice(-2).join(" ");
}

function _claveApellidos(u) {
  const ap = _apellidosUsuario(u);
  const sinParticulas = _deaccentLower(ap).replace(/^(?:(?:de|del|la|los|las|y)\s+)+/i, "").trim();
  return sinParticulas || _deaccentLower(ap) || _deaccentLower(u?.displayName || "") || "zzzz";
}

// Comparador principal: apellidos -> nombre completo -> usuario de acceso
function _compareUsuariosPorApellidos(a, b) {
  const ka = _claveApellidos(a), kb = _claveApellidos(b);
  if (ka !== kb) return ka.localeCompare(kb, "es");
  const na = String(a?.displayName || a?.email || "").trim();
  const nb = String(b?.displayName || b?.email || "").trim();
  if (na !== nb) return na.localeCompare(nb, "es");
  return String(a?.username || "").localeCompare(String(b?.username || ""), "es");
}

// Usuarios que pasan los filtros de búsqueda y rol activos en el listado
// (compartido por la tabla y por las selecciones del modo de eliminación masiva)
function _usuariosVisiblesTabla() {
  const q = (document.getElementById("search-users")?.value || "").toLowerCase().trim();
  const fr = document.getElementById("filter-rol-users")?.value || "";

  const isAdminUser = esUsuarioAdmin;
  let users = [...state.usuarios];
  if (q) users = users.filter(u => (u.displayName || "").toLowerCase().includes(q) || (u.username || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q));
  if (fr === "admin") users = users.filter(isAdminUser);
  else if (fr === "profesor") users = users.filter(u => !isAdminUser(u));
  users.sort(_compareUsuariosPorApellidos);
  return users;
}

      btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> ¡Copiado!`;

    document.body.removeChild(ta);

};

window._repairUser = async () => {
  const uid = prompt(
    "REPARAR PERFIL DE USUARIO\n\n" +
    "Esta función crea un perfil en Firestore para un usuario que ya existe en Firebase Authentication pero no aparece en la lista.\n\n" +
    "Paso 1: Ve a Firebase Console → Authentication → Users\n" +
    "Paso 2: Copia el User UID del usuario (columna User UID)\n" +
    "Paso 3: Pégalo aquí abajo\n\n" +
    "User UID:"
  );
  if (!uid || !uid.trim()) return;
  const trimmedUid = uid.trim();

  const nombre = prompt("Nombre y apellidos del profesor/a:") || "";
  if (nombre.length < 3) { alert("El nombre debe tener al menos 3 caracteres."); return; }
  const email = prompt("Correo electrónico:") || "";
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Correo electrónico no válido."); return; }
  const usernameRaw = prompt("Nombre de usuario para el acceso (opcional; dejar vacío para usar la parte del correo anterior a @):") || "";
  const username = normalizeUsername(usernameRaw);
  if (username && !isValidUsername(username)) { alert("Nombre de usuario no válido (3-30 caracteres: letras, números, punto, guion o guion bajo)."); return; }
  const departamento = prompt(
    "Departamento (elige uno):\n\n" + DEPARTAMENTOS.map((d, i) => `${i + 1}. ${d}`).join("\n") + "\n\nEscribe el número:"
  );
  let deptValue = "";
  if (departamento) {
    const idx = parseInt(departamento, 10) - 1;
    if (idx >= 0 && idx < DEPARTAMENTOS.length) deptValue = DEPARTAMENTOS[idx];
  }
  if (!deptValue) { alert("Departamento no válido."); return; }
  const rol = confirm("¿Es administrador?\n\nAceptar = Sí, administrador\nCancelar = No, profesor/a") ? "admin" : "profesor";

  try {
    const unameRepair = username || localPartOf(email);
    const profile = {
      uid: trimmedUid,
      email,
      displayName: nombre,
      role: rol,
      department: deptValue,
      ...(unameRepair ? { username: unameRepair } : {}),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      createdBy: state.user?.uid || null,
    };
    const ref = doc(db, USUARIOS_COLLECTION, trimmedUid);
    await setDoc(ref, profile, { merge: true });
    if (unameRepair) await ensureUsernameMapping({ uid: trimmedUid, email, username: unameRepair });
    alert(`Perfil creado correctamente.\n\nUID: ${trimmedUid}\nNombre: ${nombre}\nUsuario de acceso: ${unameRepair || "(sin definir)"}\nCorreo: ${email}\nDepartamento: ${deptValue}\nRol: ${rol}`);
    refreshUsuariosNow();
  } catch (e) {
    console.error("[_repairUser] Error:", e);
    alert("Error al crear el perfil: " + (e.code || e.message) + "\n\nVerifica las reglas de Firestore (panel amarillo en Usuarios).");
  }
};

// =============================================================================
// MIGRACIÓN: crear el acceso por nombre de usuario (sin correo) para todos los
// usuarios listados. Genera la colección `usernames` a partir de los perfiles
// existentes, resolviendo colisiones con sufijos (-2, -3, ...).
// =============================================================================
window._crearAccesosUsuarios = async () => {
  const lista = state.usuarios.filter(u => u && (u.uid || u.id));
  if (lista.length === 0) {
    alert("No hay usuarios cargados en la lista. Pulsa 'Refrescar' e inténtalo de nuevo.");
    return;
  }
  if (!confirm(
    "Se creará un acceso por nombre de usuario (para iniciar sesión sin correo) para " +
    lista.length + " usuario(s).\n\n" +
    "El nombre se toma del campo 'username' del perfil si existe y, si no, de la parte del correo anterior a @. " +
    "Los nombres repetidos se resolverán añadiendo un sufijo (-2, -3…).\n\n¿Continuar?"
  )) return;

  let ok = 0, failed = 0;
  const details = [];
  const used = new Set();

  for (const u of lista) {
    const uid = u.uid || u.id;
    const email = u.email || "";
    let base = normalizeUsername(u.username) || localPartOf(email) || normalizeUsername(u.displayName || "").replace(/[^a-z0-9._-]+/g, ".");
    if (!base || !isValidUsername(base)) {
      failed++;
      details.push(`${email || uid}: sin nombre de usuario válido`);
      continue;
    }

    let candidate = base;
    try {
      // Si el nombre está libre o ya pertenece a este mismo uid, se usa tal cual
      const checkFree = async (name) => {
        if (used.has(name)) return false;
        const snap = await getDoc(doc(db, USERNAMES_COLLECTION, name));
        if (!snap.exists()) return true;
        const md = snap.data() || {};
        return !md.uid || md.uid === uid;
      };
      let free = await checkFree(candidate);
      let n = 2;
      while (!free && n <= 50) {
        candidate = `${base}-${n}`;
        free = await checkFree(candidate);
        n++;
      }
      if (!free) {
        failed++;
        details.push(`${email || uid}: no se encontró un nombre libre para "${base}"`);
        continue;
      }

      await setDoc(doc(db, USERNAMES_COLLECTION, candidate), {
        username: candidate,
        email,
        uid,
        updatedAt: Date.now(),
      }, { merge: true });
      used.add(candidate);
      // Guardar el nombre elegido en el perfil si es distinto del que tenía
      if (normalizeUsername(u.username) !== candidate) {
        try { await updateUserProfile(uid, { username: candidate }); } catch (e) {
          console.warn("[_crearAccesosUsuarios] No se pudo guardar el username en el perfil:", e.code || e.message);
        }
      }
      ok++;
    } catch (e) {
      failed++;
      details.push(`${email || uid}: ${e.code || e.message}`);
    }
  }

  let msg = `Accesos por nombre de usuario:\n\nListos: ${ok}\nErrores: ${failed}`;
  if (details.length > 0) {
    msg += "\n\nDetalle:\n" + details.slice(0, 15).join("\n");
    if (details.length > 15) msg += `\n...y ${details.length - 15} más`;
  }
  msg += "\n\nIMPORTANTE: para que el login por nombre de usuario funcione, publica las reglas de Firestore actualizadas (incluyen la colección 'usernames'). Están disponibles en el panel de reglas de esta misma pantalla.";
  alert(msg);
  refreshUsuariosNow();
};
