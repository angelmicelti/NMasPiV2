  if (!departamento) { err.textContent = "Selecciona tu departamento."; err.classList.remove("hidden"); return; }
  const btn = document.getElementById("perfil-save-btn");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Guardando…`;
  try {
    // Actualizar perfil en Firebase Auth
    if (state.user && state.user.displayName !== nombre) {
      await updateProfile(state.user, { displayName: nombre });
    }
    // Actualizar perfil en Firestore
    const updated = await updateUserProfile(state.user.uid, { displayName: nombre, department: departamento });

    success.textContent = "Perfil actualizado correctamente.";
    success.classList.remove("hidden");

    renderAppShell();

window._renderFechasContainer = () => {
  const container = document.getElementById("rpt-fechas-container");
  if (!container) return;
  const period = state.informeConfig.period;
  const curso = getCurrentCurso();
  const today = dateToISO(new Date());

  if (period === "diario") {
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Día *</label>
        <input id="rpt-fecha" type="date" value="${today}" min="${curso.start}" max="${curso.end}" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none" />
      </div>
      <div class="flex items-end">
        <p class="text-xs text-slate-500">El informe incluirá todas las evidencias registradas ese día concreto.</p>
      </div>`;
  } else if (period === "semanal") {
    // Generar listado de semanas del curso
    const EVALS = getEvaluacionesForCurso(curso);
    const totalWeeks = EVALS.reduce((a, e) => a + e.weeks, 0);
    const weeks = [];
    for (let w = 1; w <= totalWeeks; w++) {
      const { start, end } = getWeekDates(w);
      weeks.push(`<option value="${w}">Semana ${w} · ${formatDateES(start)} → ${formatDateES(end)}</option>`);
    }
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Semana *</label>
        <select id="rpt-semana" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white">
          ${weeks.join("")}
        </select>
      </div>
      <div class="flex items-end">
        <p class="text-xs text-slate-500">Cada semana abarca de lunes a viernes del cronograma del plan.</p>
      </div>`;
  } else if (period === "mensual") {
    const months = [];
    const start = normalizeDate(curso.start);
    const end = normalizeDate(curso.end);
    const cur = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cur <= end) {
      const y = cur.getFullYear();
      const m = cur.getMonth();
      const monthName = cur.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
      const mStart = dateToISO(new Date(y, m, 1));
      const mEnd = dateToISO(new Date(y, m + 1, 0));
      months.push(`<option value="${mStart}|${mEnd}">${monthName.charAt(0).toUpperCase() + monthName.slice(1)}</option>`);
      cur.setMonth(cur.getMonth() + 1);
    }
    container.innerHTML = `
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Mes *</label>
        <select id="rpt-mes" class="w-full h-11 px-3 rounded-lg border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none bg-white">
          ${months.join("")}
        </select>
      </div>
      <div class="flex items-end">

window._generateInforme = () => {
  const plan = document.querySelector('input[name="rpt-plan"]:checked')?.value || "lector";
  const area = document.querySelector('input[name="rpt-area"]:checked')?.value || "";
  const period = state.informeConfig.period;
  const curso = getCurrentCurso();

  // Recoger fechas según periodo
  let fechaInicio, fechaFin, periodLabel;
  if (period === "diario") {
    const f = document.getElementById("rpt-fecha").value;
    if (!f) { alert("Selecciona un día."); return; }
    fechaInicio = f; fechaFin = f;
    periodLabel = `Día ${formatDateES(new Date(f))}`;
  } else if (period === "semanal") {
    const wnum = parseInt(document.getElementById("rpt-semana").value);
    const { start, end } = getWeekDates(wnum);
    fechaInicio = dateToISO(start); fechaFin = dateToISO(end);
    periodLabel = `Semana ${wnum} (${formatDateES(start)} → ${formatDateES(end)})`;
  } else if (period === "mensual") {
    const v = document.getElementById("rpt-mes").value;
    const [s, e] = v.split("|");
    fechaInicio = s; fechaFin = e;
    const d = new Date(s);
    periodLabel = d.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  } else if (period === "anual") {
    const cursoId = document.getElementById("rpt-curso").value;
    const c = (state.cursos).find(x => x.id === cursoId) || curso;
    fechaInicio = c.start; fechaFin = c.end;
    periodLabel = `Curso ${c.label || c.id}`;
  }

  // Filtrar evidencias por fecha
  const inRange = (iso) => iso >= fechaInicio && iso <= fechaFin;
  let evsLector = state.evidenciasLector.filter(e => e.fecha && inRange(e.fecha));
  let evsRM = state.evidenciasRM.filter(e => {
    // Para RM usamos la fecha de la semana (lunes)
    if (!e.semana) return false;
    const { start } = getWeekDates(e.semana);
    return inRange(dateToISO(start));
  });

  // Filtrar por área
  if (area) {
    // Lector pertenece al área SL: solo se incluye si el filtro es SL
    if (area !== LECTOR_AREA) evsLector = [];
    evsRM = evsRM.filter(e => MATERIA_TO_AREA[e.materia] === area);
  }

  // Generar PDF
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const adminName = state.userProfile?.displayName || state.user?.email || "Administrador";
  const now = new Date();
  const generatedLabel = now.toLocaleString("es-ES");

  // Cabecera
  doc.setFontSize(18); doc.setTextColor(30, 41, 59);
  doc.text("Informe de uso — Planes IES", 14, 18);
  doc.setFontSize(11); doc.setTextColor(100, 116, 139);
  doc.text(INSTITUTO.nombre, 14, 25);
  doc.text(`Generado por: ${adminName}`, 14, 31);
  doc.text(`Fecha de generación: ${generatedLabel}`, 14, 37);

  // Línea separadora
  doc.setDrawColor(203, 213, 225); doc.setLineWidth(0.5);
  doc.line(14, 41, 196, 41);

  // Resumen
  doc.setFontSize(13); doc.setTextColor(30, 41, 59);
  doc.text(`Periodo: ${periodLabel}`, 14, 49);
  doc.setFontSize(10); doc.setTextColor(100, 116, 139);
  const areaLabel = area ? `${area} · ${AMBITOS[area].nombre}` : "Todas las áreas";
  doc.text(`Área de competencia: ${areaLabel}`, 14, 55);

  let yPos = 65;

  // Sección Plan Lector
  if (plan === "lector" || plan === "ambos") {
    doc.setFontSize(13); doc.setTextColor(37, 99, 235);
    doc.text("Plan Lector", 14, yPos);
    yPos += 6;
    doc.setFontSize(10); doc.setTextColor(30, 41, 59);
    doc.text(`Total evidencias: ${evsLector.length}`, 14, yPos);
    yPos += 5;

    if (evsLector.length > 0) {
      const rows = evsLector.map(e => [
        e.fecha || "—",
        e.grupo || "—",
        e.hora ? `${e.hora}ª` : "—",
        e.profesor || "—",
        e.tipologia || "—",
        e.tipoTexto || "—",
        (e.observacion || "").slice(0, 50),
      ]);
      doc.autoTable({
        head: [["Fecha", "Grupo", "Hora", "Profesor", "Tipología", "Tipo texto", "Obs."]],
        body: rows,
        startY: yPos,
        styles: { fontSize: 8, cellPadding: 1.5 },
        headStyles: { fillColor: [37, 99, 235] },
        columnStyles: { 6: { cellWidth: 50 } },
      });
      yPos = doc.lastAutoTable.finalY + 8;
    } else {
      doc.setTextColor(148, 163, 184);
      doc.text("No hay evidencias del Plan Lector en este periodo.", 14, yPos);
      yPos += 8;
    }
  }

  // Sección Plan RM
  if (plan === "rm" || plan === "ambos") {
    if (plan === "ambos") { doc.addPage(); yPos = 20; }
    doc.setFontSize(13); doc.setTextColor(124, 58, 237);
    doc.text("Plan de Razonamiento Matemático", 14, yPos);
    yPos += 6;
    doc.setFontSize(10); doc.setTextColor(30, 41, 59);
    doc.text(`Total evidencias: ${evsRM.length}`, 14, yPos);
    yPos += 5;

    if (evsRM.length > 0) {
      const rows = evsRM.map(e => {
        const { start } = getWeekDates(e.semana);
        return [
          `S${e.semana}`,
          dateToISO(start),
          e.grupo || "—",
          e.materia || "—",
          e.sesion ? `${e.sesion}` : "—",
          e.profesor || "—",
          (e.actividadRealizada || "").slice(0, 60),
        ];
      });
      doc.autoTable({
        head: [["Sem.", "Fecha", "Grupo", "Materia", "Ses.", "Profesor", "Actividad"]],
        body: rows,
        startY: yPos,
        styles: { fontSize: 8, cellPadding: 1.5 },
        headStyles: { fillColor: [124, 58, 237] },
        columnStyles: { 6: { cellWidth: 60 } },
      });
      yPos = doc.lastAutoTable.finalY + 8;
    } else {
      doc.setTextColor(148, 163, 184);
      doc.text("No hay evidencias del Plan RM en este periodo.", 14, yPos);
      yPos += 8;
    }
  }

  // Pie de página
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(148, 163, 184);
    doc.text(`${INSTITUTO.nombre} · ${INSTITUTO.localidad} · Curso ${curso.label || curso.id}`, 14, 290);
    doc.text(`Página ${i} de ${pageCount}`, 196, 290, { align: "right" });
  }

  const planLabel = plan === "ambos" ? "ambos_planes" : (plan === "lector" ? "plan_lector" : "plan_rm");
  const areaSuffix = area ? `_${area}` : "";
  doc.save(`informe_${planLabel}_${period}${areaSuffix}.pdf`);
};

const FIRESTORE_RULES_USUARIOS = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // Correos con privilegio de administrador
    function isBootstrapAdmin() {
      return request.auth.token.email in [
        'admin@iesvdv.es',
        'angelmicelti@gmail.com',
        'amilleo722@g.educaand.es'
      ];
    }
    // Usuario con rol admin en su perfil de Firestore
    function isAdminInProfile() {
      return request.auth != null
        && exists(/databases/$(database)/documents/usuarios/$(request.auth.uid))
        && get(/databases/$(database)/documents/usuarios/$(request.auth.uid)).data.role == 'admin';
    }
    function isAdmin() {
      return isBootstrapAdmin() || isAdminInProfile();
    }

    // Colección usuarios
    match /usuarios/{uid} {
      allow read: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow create: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow update: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow delete: if isAdmin();
    }

    // Mapeo nombre de usuario -> correo (permite iniciar sesión con usuario y contraseña)
    // La lectura es pública porque el login necesita resolver el nombre ANTES de autenticar.
    match /usernames/{name} {
      allow read: if true;
      allow create: if request.auth != null && (isAdmin() || request.resource.data.uid == request.auth.uid);
      allow update, delete: if request.auth != null && (isAdmin() || resource.data.uid == request.auth.uid);
    }

    // Evidencias Plan Lector
    match /evidencias_lector/{docId} {
      allow read, write: if request.auth != null;
    }
    // Evidencias Plan RM
    match /evidencias_rm/{docId} {
      allow read, write: if request.auth != null;
    }
    // Cursos escolares
    match /cursos/{docId} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    // Asignación de profesores por curso (solo admin puede escribir)
    match /curso_profesores/{docId} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    // Configuración pública (p. ej. config_public/bootstrap con hasAdmin):
    // lectura libre SIN autenticar para que el login sepa si debe ofrecer
    // crear el primer administrador; escritura solo para administradores.
    match /config_public/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }
  }
}`;

window._copyFirestoreRules = (btnElement) => {
  const code = document.getElementById("firestore-rules-code")?.textContent || FIRESTORE_RULES_USUARIOS;
  navigator.clipboard.writeText(code).then(() => {
    const btn = btnElement || document.querySelector('[data-action="copy-firestore-rules"]');
    if (btn) {
      const original = btn.innerHTML;
      btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> ¡Copiado!`;
      setTimeout(() => { btn.innerHTML = original; }, 2000);
    } else {
      alert("Reglas copiadas al portapapeles.");
    }
  }).catch(() => {
    // Fallback
    const ta = document.createElement("textarea");
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); alert("Reglas copiadas al portapapeles."); }
    catch (e) { alert("No se pudo copiar. Copia manualmente desde el cuadro."); }
    document.body.removeChild(ta);
  });
};

window._repairUser = async () => {
  const uid = prompt(
    "REPARAR PERFIL DE USUARIO\n\n" +
    "Esta función crea un perfil en Firestore para un usuario que ya existe en Firebase Authentication pero no aparece en la lista.\n\n" +
    "Paso 1: Ve a Firebase Console → Authentication → Users\n" +
    "Paso 2: Copia el User UID del usuario (columna User UID)\n" +
    "Paso 3: Pégalo aquí abajo\n\n" +
    "User UID:"
  );
  if (!uid || !uid.trim()) return;
  const trimmedUid = uid.trim();

  const nombre = prompt("Nombre y apellidos del profesor/a:") || "";
  if (nombre.length < 3) { alert("El nombre debe tener al menos 3 caracteres."); return; }
  const email = prompt("Correo electrónico:") || "";
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert("Correo electrónico no válido."); return; }
  const usernameRaw = prompt("Nombre de usuario para el acceso (opcional; dejar vacío para usar la parte del correo anterior a @):") || "";
  const username = normalizeUsername(usernameRaw);
  if (username && !isValidUsername(username)) { alert("Nombre de usuario no válido (3-30 caracteres: letras, números, punto, guion o guion bajo)."); return; }
  const departamento = prompt(
    "Departamento (elige uno):\n\n" + DEPARTAMENTOS.map((d, i) => `${i + 1}. ${d}`).join("\n") + "\n\nEscribe el número:"
  );
  let deptValue = "";
  if (departamento) {
    const idx = parseInt(departamento, 10) - 1;
    if (idx >= 0 && idx < DEPARTAMENTOS.length) deptValue = DEPARTAMENTOS[idx];
  }
  if (!deptValue) { alert("Departamento no válido."); return; }
  const rol = confirm("¿Es administrador?\n\nAceptar = Sí, administrador\nCancelar = No, profesor/a") ? "admin" : "profesor";

  try {
    const unameRepair = username || localPartOf(email);
    const profile = {
      uid: trimmedUid,
      email,
      displayName: nombre,
      role: rol,
      department: deptValue,
      ...(unameRepair ? { username: unameRepair } : {}),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      createdBy: state.user?.uid || null,
    };
    const ref = doc(db, USUARIOS_COLLECTION, trimmedUid);
    await setDoc(ref, profile, { merge: true });
    if (unameRepair) await ensureUsernameMapping({ uid: trimmedUid, email, username: unameRepair });
    alert(`Perfil creado correctamente.\n\nUID: ${trimmedUid}\nNombre: ${nombre}\nUsuario de acceso: ${unameRepair || "(sin definir)"}\nCorreo: ${email}\nDepartamento: ${deptValue}\nRol: ${rol}`);
    refreshUsuariosNow();
  } catch (e) {
    console.error("[_repairUser] Error:", e);
    alert("Error al crear el perfil: " + (e.code || e.message) + "\n\nVerifica las reglas de Firestore (panel amarillo en Usuarios).");
  }
};

// =============================================================================
// MIGRACIÓN: crear el acceso por nombre de usuario (sin correo) para todos los
// usuarios listados. Genera la colección `usernames` a partir de los perfiles
// existentes, resolviendo colisiones con sufijos (-2, -3, ...).
// =============================================================================
window._crearAccesosUsuarios = async () => {
  const lista = state.usuarios.filter(u => u && (u.uid || u.id));
  if (lista.length === 0) {
    alert("No hay usuarios cargados en la lista. Pulsa 'Refrescar' e inténtalo de nuevo.");
    return;
  }
  if (!confirm(
    "Se creará un acceso por nombre de usuario (para iniciar sesión sin correo) para " +
    lista.length + " usuario(s).\n\n" +
    "El nombre se toma del campo 'username' del perfil si existe y, si no, de la parte del correo anterior a @. " +
    "Los nombres repetidos se resolverán añadiendo un sufijo (-2, -3…).\n\n¿Continuar?"
  )) return;

  let ok = 0, failed = 0;
  const details = [];
  const used = new Set();

  for (const u of lista) {
    const uid = u.uid || u.id;
    const email = u.email || "";
    let base = normalizeUsername(u.username) || localPartOf(email) || normalizeUsername(u.displayName || "").replace(/[^a-z0-9._-]+/g, ".");
    if (!base || !isValidUsername(base)) {
      failed++;
      details.push(`${email || uid}: sin nombre de usuario válido`);
      continue;
    }

    let candidate = base;
    try {
      // Si el nombre está libre o ya pertenece a este mismo uid, se usa tal cual
      const checkFree = async (name) => {
        if (used.has(name)) return false;
        const snap = await getDoc(doc(db, USERNAMES_COLLECTION, name));
        if (!snap.exists()) return true;
        const md = snap.data() || {};
        return !md.uid || md.uid === uid;
      };
      let free = await checkFree(candidate);
      let n = 2;
      while (!free && n <= 50) {
        candidate = `${base}-${n}`;
        free = await checkFree(candidate);
        n++;
      }
      if (!free) {
        failed++;
        details.push(`${email || uid}: no se encontró un nombre libre para "${base}"`);
        continue;
      }

      await setDoc(doc(db, USERNAMES_COLLECTION, candidate), {
        username: candidate,
        email,
        uid,
        updatedAt: Date.now(),
      }, { merge: true });
      used.add(candidate);
      // Guardar el nombre elegido en el perfil si es distinto del que tenía
      if (normalizeUsername(u.username) !== candidate) {
        try { await updateUserProfile(uid, { username: candidate }); } catch (e) {
          console.warn("[_crearAccesosUsuarios] No se pudo guardar el username en el perfil:", e.code || e.message);
        }
      }
      ok++;
    } catch (e) {
      failed++;
      details.push(`${email || uid}: ${e.code || e.message}`);
    }
  }

  let msg = `Accesos por nombre de usuario:\n\nListos: ${ok}\nErrores: ${failed}`;
  if (details.length > 0) {
    msg += "\n\nDetalle:\n" + details.slice(0, 15).join("\n");
    if (details.length > 15) msg += `\n...y ${details.length - 15} más`;
  }
  msg += "\n\nIMPORTANTE: para que el login por nombre de usuario funcione, publica las reglas de Firestore actualizadas (incluyen la colección 'usernames'). Están disponibles en el panel de reglas de esta misma pantalla.";
  alert(msg);
  refreshUsuariosNow();
};

  const wsInstr = XLSX.utils.aoa_to_sheet(instrData);
  wsInstr["!cols"] = [{ wch: 80 }];
  XLSX.utils.book_append_sheet(wb, wsInstr, "Instrucciones");

  XLSX.writeFile(wb, "plantilla_usuarios.xlsx");
};

// =============================================================================
// IMPORTAR USUARIOS DESDE EXCEL (modelo LaLiao: crea nuevos y actualiza existentes)
// Soporta dos formatos, detectados automáticamente por los encabezados:
//   1) Plantilla propia:   Nombre | Usuario | Contraseña | Departamento | Rol
//   2) Séneca "Relación de Personal del Centro" (RelPerCen.xls): Empleado/a |
//      DNI/Pasaporte | Puesto | Fecha de toma de posesión | Fecha de cese |
//      Departamento | ... | Usuario IdEA | Cuenta Google/Microsoft | Coordinador
// =============================================================================
const _IMPORT_RANDOM_CHARS = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function _randomPassword(len = 10) {
  let pass = "";
  for (let i = 0; i < len; i++) pass += _IMPORT_RANDOM_CHARS.charAt(Math.floor(Math.random() * _IMPORT_RANDOM_CHARS.length));
  return pass;
}

// Minúsculas, sin acentos y sin signos de puntuación (comas/puntos -> espacios).
function _deaccentLower(s) {
  return String(s || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[.,;:\/]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

// Busca una columna del fichero de Séneca por fragmento del encabezado.
// Ej: _senecaCol(row, ["usuario idea"]) -> valor de "Usuario IdEA"
function _senecaCol(row, frags) {
  const keys = Object.keys(row);
  for (const frag of frags) {
    const k = keys.find(kk => _deaccentLower(kk).includes(frag));
    if (k !== undefined) return row[k];
  }
  return "";
}

// "Baena Espejo, María de las Mercedes" -> "María de las Mercedes Baena Espejo"
function _invertirEmpleado(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  const idx = s.indexOf(",");
  if (idx < 0) return s;
  return (s.slice(idx + 1).trim() + " " + s.slice(0, idx).trim()).trim();
}

// Acepta "dd/mm/yyyy" (texto) o número de serie de Excel.
function _parseFechaDMY(s) {
  if (typeof s === "number" && isFinite(s)) {
    const d = new Date(Math.round((s - 25569) * 86400000));
    return isNaN(d) ? null : d;
  }
  const m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.exec(String(s || "").trim());
  if (!m) return null;
  let y = parseInt(m[3], 10);
  if (y < 100) y += 2000;
  const d = new Date(y, parseInt(m[2], 10) - 1, parseInt(m[1], 10));
  return isNaN(d) ? null : d;
}

function _formatDMY(d) {
  if (!d) return "";
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
}

// Empareja un departamento del fichero con uno del centro:
//   1) coincidencia exacta (sin acentos ni puntuación): "Matematicas" -> "Matemáticas"
//   2) prefijo: "Lengua Castellana y Literatura" -> "Lengua Castellana"
//   3) primera palabra (única candidata): "Geografía, Historia y Religión" -> "Geografía e Historia"
function _matchDeptByPrefix(raw) {
  const n = _deaccentLower(raw);
  if (!n) return "";
  let hit = DEPARTAMENTOS.find(d => _deaccentLower(d) === n);
  if (hit) return hit;
  hit = DEPARTAMENTOS.find(d => n.startsWith(_deaccentLower(d)));
  if (hit) return hit;
  const firstTok = n.split(" ")[0];
  if (firstTok && firstTok.length >= 4) {
    const cands = DEPARTAMENTOS.filter(d => _deaccentLower(d).split(" ")[0] === firstTok);
    if (cands.length === 1) return cands[0];
  }
  return "";
}

// Departamento del fichero de Séneca; si no encaja con ninguno, se intenta con el puesto
// ("Idiomas" no basta, pero "Inglés P.E.S." / "Frances P.E.S." / "Música P.E.S." sí).
function _mapSenecaDepartamento(dept, puesto) {
  return _matchDeptByPrefix(dept) || _matchDeptByPrefix(puesto) || "";
}

// ¿Es el fichero de Séneca "Relación de Personal del Centro"?
function _isSenecaRelPerCen(rows) {
  const first = rows[0] || {};
  const keys = Object.keys(first).map(k => _deaccentLower(k));
  const has = (frag) => keys.some(k => k.includes(frag));
  return has("empleado") || has("usuario idea");
}

// Convierte las filas del RelPerCen en usuarios de la app.
// Devuelve { usuarios: [{nombre, username, pass, rol, departamento, _fila}], omitidos: [motivos] }
function _mapSenecaRows(rows, { skipCesePasado, passInicial }) {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const usuarios = [];
  const omitidos = [];
  rows.forEach((r, i) => {
    const fila = i + 2; // +1 encabezado, +1 para numeración humana
    const empleado = String(_senecaCol(r, ["empleado"])).trim();
    if (!empleado) { omitidos.push(`Fila ${fila}: omitida (Empleado/a vacío)`); return; }
    const nombre = _invertirEmpleado(empleado);
    let username = normalizeUsername(String(_senecaCol(r, ["usuario idea"]) || ""));
    if (username && !isValidUsername(username)) username = "";
    if (!username) username = suggestUsernameFromNombre(nombre);
    if (!username || !isValidUsername(username)) { omitidos.push(`Fila ${fila} (${nombre}): omitida, sin Usuario IdEA válido`); return; }
    const cese = _parseFechaDMY(_senecaCol(r, ["cese"]));
    if (cese && cese < hoy) {
      if (skipCesePasado) { omitidos.push(`Fila ${fila} (${nombre}): omitida, cese el ${_formatDMY(cese)}`); return; }
    }
    const departamento = _mapSenecaDepartamento(String(_senecaCol(r, ["departamento"])), String(_senecaCol(r, ["puesto"])));
    usuarios.push({
      nombre,
      username,
      pass: passInicial || _randomPassword(10),
      rol: "profesor",
      departamento,
      _fila: fila,
    });
  });
  return { usuarios, omitidos };
}

// Ganchos de depuración/pruebas (no interfieren con la app).
window._senecaDebug = {
  isSeneca: _isSenecaRelPerCen,
  mapRows: _mapSenecaRows,

  invertir: _invertirEmpleado,

window._copyImportCreds = async (btn) => {
  const text = window._importCredsText || "";
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* sin más */ }
    ta.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = "✓ Copiadas";
    btn.disabled = true;
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2000);
  }
};

window._importUsuariosExcel = async () => {
  const fileInput = document.getElementById("iuFile");
  const resultDiv = document.getElementById("iuResult");
  if (!fileInput || !resultDiv) return;
  if (!fileInput.files.length) { resultDiv.innerHTML = '<div class="text-red-600 text-sm">Selecciona un archivo Excel primero.</div>'; return; }
  if (typeof XLSX === "undefined") { resultDiv.innerHTML = '<div class="text-red-600 text-sm">Error: librería XLSX no cargada.</div>'; return; }

  resultDiv.innerHTML = '<div class="text-blue-600 text-sm">Procesando archivo…</div>';

  try {
    const file = fileInput.files[0];
    const data = new Uint8Array(await file.arrayBuffer());
    const wb = XLSX.read(data, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    if (!ws) { resultDiv.innerHTML = '<div class="text-red-600 text-sm">El archivo no tiene hojas.</div>'; return; }
    const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
    if (rows.length === 0) { resultDiv.innerHTML = '<div class="text-red-600 text-sm">El archivo no tiene filas de datos.</div>'; return; }

    const credenciales = []; // {username, pass} de los usuarios NUEVOS creados (solo formato Séneca)
    let usuarios;
    let omitidos = [];

    // Detectar formato: plantilla propia vs Séneca "Relación de Personal del Centro"
    if (_isSenecaRelPerCen(rows)) {
      const passInicial = String(document.getElementById("iuPass")?.value || "").trim();
      if (passInicial && passInicial.length < 6) {
        resultDiv.innerHTML = '<div class="text-red-600 text-sm">La contraseña inicial debe tener al menos 6 caracteres (o déjala vacía para generar una aleatoria distinta por usuario).</div>';
        return;
      }
      const skipCese = !!document.getElementById("iuSkipCese")?.checked;
      const mapped = _mapSenecaRows(rows, { skipCesePasado: skipCese, passInicial });
      usuarios = mapped.usuarios;
      omitidos = mapped.omitidos;
      if (usuarios.length === 0) {
        resultDiv.innerHTML = `<div class="text-red-600 text-sm"><strong>No se encontró personal importable en el fichero de Séneca.</strong><br>${omitidos.map(escapeHtml).join("<br>") || "Comprueba que es la «Relación de Personal del Centro» y que tiene filas de datos."}</div>`;
        return;
      }
    } else {
      const findCol = (row, names) => {
        const keys = Object.keys(row);
        for (const name of names) {
          const found = keys.find(k => k.toLowerCase().trim() === name.toLowerCase());
          if (found !== undefined) return row[found];
        }
        return "";
      };

      usuarios = rows.map(r => ({
        nombre: String(findCol(r, ["Nombre", "Nombre y apellidos", "Nombre y Apellidos"])).trim(),
        username: normalizeUsername(String(findCol(r, ["Usuario", "usuario", "user"]))),
        pass: String(findCol(r, ["Contraseña", "Password", "contraseña", "password"])).trim(),
        rol: String(findCol(r, ["Rol", "rol", "role"])).trim().toLowerCase() || "profesor",
        departamento: String(findCol(r, ["Departamento", "departamento", "Depto"])).trim(),
      })).filter(u => u.nombre && u.username && u.pass);

      if (usuarios.length === 0) {
        resultDiv.innerHTML = '<div class="text-red-600 text-sm">No se encontraron usuarios válidos. Revisa las columnas Nombre, Usuario y Contraseña.</div>';
        return;
      }
    }

    // Validación previa
    const errores = [];
    const seen = new Set();
    usuarios.forEach((u, i) => {
      if (u.nombre.length < 3) errores.push(`Fila ${i + 2}: nombre demasiado corto`);
      if (!isValidUsername(u.username)) errores.push(`Fila ${i + 2}: usuario "${u.username}" no válido (3-30 caracteres: minúsculas, números, punto, guion o guion bajo)`);
      if (u.pass.length < 6) errores.push(`Fila ${i + 2}: contraseña demasiado corta`);
      if (u.rol && !["profesor", "admin"].includes(u.rol)) errores.push(`Fila ${i + 2}: rol "${u.rol}" no válido (profesor o admin)`);
      if (u.departamento && !DEPARTAMENTOS.includes(u.departamento)) errores.push(`Fila ${i + 2}: departamento "${u.departamento}" no pertenece al centro`);
      if (seen.has(u.username)) errores.push(`Fila ${i + 2}: usuario "${u.username}" duplicado en el archivo`);
      seen.add(u.username);
    });
    if (errores.length > 0) {
      resultDiv.innerHTML = `<div class="text-red-600 text-sm"><strong>Errores en el archivo:</strong><br>${errores.slice(0, 20).join("<br>")}${errores.length > 20 ? `<br>…y ${errores.length - 20} más` : ""}</div>`;
      return;
    }

    // Separar nuevos y existentes (por nombre de usuario)
    const findByUsername = (uname) => state.usuarios.find(u =>
      (u.username && normalizeUsername(u.username) === uname) ||
      (!u.username && localPartOf(u.email || "") === uname)
    );
    const toCreate = usuarios.filter(u => !findByUsername(u.username));
    const toUpdate = usuarios.filter(u => !!findByUsername(u.username));

    let creados = 0, actualizados = 0, sinCambios = 0, fallidos = 0;
    const log = [];

    for (let i = 0; i < toCreate.length; i++) {
      const u = toCreate[i];
      resultDiv.innerHTML = `<div class="text-blue-600 text-sm">Creando ${i + 1}/${toCreate.length}: ${escapeHtml(u.username)}…</div>`;
      try {
        await createUsuarioByAdmin({ nombre: u.nombre, username: u.username, departamento: u.departamento, rol: u.rol, password: u.pass });
        creados++;
        log.push(`✓ NUEVO: ${u.username} (${u.nombre})`);
        credenciales.push({ username: u.username, pass: u.pass });
      } catch (e) {
        fallidos++;
        log.push(`✗ ${u.username}: ${e.message || e.code || "error"}`);
      }
    }

    for (let i = 0; i < toUpdate.length; i++) {
      const u = toUpdate[i];
      resultDiv.innerHTML = `<div class="text-blue-600 text-sm">Actualizando ${i + 1}/${toUpdate.length}: ${escapeHtml(u.username)}…</div>`;
      try {
        const existing = findByUsername(u.username);
        const existingUid = existing.uid || existing.id;
        const updates = {};
        const cambios = [];
        if ((existing.displayName || "") !== u.nombre) { updates.displayName = u.nombre; cambios.push("nombre"); }
        if ((existing.role || "profesor") !== u.rol) { updates.role = u.rol; cambios.push("rol"); }
        if ((existing.department || "") !== u.departamento) { updates.department = u.departamento; cambios.push("departamento"); }
        if (!existing.username) { updates.username = u.username; cambios.push("usuario de acceso"); }
        if (cambios.length > 0) {
          await updateUserProfile(existingUid, updates);
          if (!existing.username) {
            await ensureUsernameMapping({ uid: existingUid, email: existing.email || usernameToEmail(u.username), username: u.username });
          }
          actualizados++;
          log.push(`↻ ACTUALIZADO: ${u.username} (${cambios.join(", ")})`);
        } else {
          sinCambios++;
          log.push(`= SIN CAMBIOS: ${u.username}`);
        }
      } catch (e) {
        fallidos++;
        log.push(`✗ ${u.username}: ${e.message || e.code || "error"}`);
      }
    }

    refreshUsuariosNow();
    window._importCredsText = credenciales.map(c => `${c.username} — ${c.pass}`).join("\n");
    resultDiv.innerHTML = `
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm">
        <strong class="text-emerald-700">✓ ${creados} nuevos</strong>
        ${actualizados > 0 ? ` · <strong class="text-blue-700">↻ ${actualizados} actualizados</strong>` : ""}
        ${sinCambios > 0 ? ` · <strong class="text-slate-500">= ${sinCambios} sin cambios</strong>` : ""}
        ${fallidos > 0 ? ` · <strong class="text-red-600">✗ ${fallidos} fallos</strong>` : ""}
        <br><br><strong>Detalle:</strong><br>
        ${log.map(l => escapeHtml(l)).join("<br>")}
      </div>
      ${omitidos.length > 0 ? `
      <div class="mt-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg p-2 leading-relaxed">
        <strong>Filas omitidas:</strong><br>${omitidos.map(escapeHtml).join("<br>")}
      </div>` : ""}
      ${credenciales.length > 0 ? `
      <div class="mt-2 bg-amber-50 border border-amber-200 rounded-lg p-3">
        <strong class="text-amber-800 text-sm">Contraseñas de los ${credenciales.length} usuarios nuevos</strong>
        <div class="text-xs text-slate-600 mt-0.5">Cópialas o guárdalas ahora: solo se muestran esta vez. Comunícaselas a cada persona para su primer acceso.</div>
        <div class="mt-2 font-mono text-xs bg-white border border-amber-200 rounded p-2 leading-relaxed max-h-48 overflow-auto">${credenciales.map(c => `${escapeHtml(c.username)} — ${escapeHtml(c.pass)}`).join("<br>")}</div>
        <button data-action="copy-import-creds" class="mt-2 px-3 py-1.5 rounded-md border border-amber-300 bg-white hover:bg-amber-100 text-xs font-medium">Copiar credenciales</button>
      </div>` : ""}`;
  } catch (e) {
    console.error("[_importUsuariosExcel] Error:", e);
    resultDiv.innerHTML = `<div class="text-red-600 text-sm">Error al procesar el archivo: ${escapeHtml(e.message || String(e))}</div>`;
  }
};

window._saveEditUser = async () => {
  const uid = document.getElementById("edituser-uid").value;
  const nombre = document.getElementById("edituser-nombre").value.trim();
  const departamento = document.getElementById("edituser-departamento").value;
  const rol = document.querySelector('input[name="edituser-rol"]:checked')?.value || "profesor";
  const err = document.getElementById("edituser-error");
  err.classList.add("hidden");

  const u = state.usuarios.find(x => (x.uid || x.id) === uid);
  if (!u) { err.textContent = "No se encontró el usuario."; err.classList.remove("hidden"); return; }
  if (nombre.length < 3) { err.textContent = "Indica el nombre completo del profesor/a."; err.classList.remove("hidden"); return; }
  if (!departamento) { err.textContent = "Selecciona el departamento."; err.classList.remove("hidden"); return; }

  // Protección del último administrador
  const isAdminU = u.role === "admin" || isBootstrapAdminEmail(u.email);
  const adminCount = state.usuarios.filter(x => x.role === "admin" || isBootstrapAdminEmail(x.email)).length;
  if (isAdminU && adminCount <= 1 && rol !== "admin") {
    err.textContent = "Es el único administrador del centro. Promueve a otro administrador antes de degradarlo.";
    err.classList.remove("hidden");
    return;
  }

  const btn = document.getElementById("edituser-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Guardando…`;

  try {
    await updateUserProfile(uid, { displayName: nombre, department: departamento, role: rol });
    window._closeEditUserDialog();
    const idx = state.usuarios.findIndex(x => (x.uid === uid || x.id === uid));
    if (idx >= 0) state.usuarios[idx] = { ...state.usuarios[idx], displayName: nombre, department: departamento, role: rol, updatedAt: Date.now() };
    if (isAdminU && rol !== "admin") await markAdminExists();
    refreshUsuariosNow();
    // Si el admin se edita a sí mismo, refrescar la cabecera
    if (uid === state.user?.uid) {
      state.userProfile = { ...(state.userProfile || {}), displayName: nombre, department: departamento, role: rol };
      renderAppShell();
    }
  } catch (e) {
    console.error("[_saveEditUser] Error:", e);
    err.textContent = "Error al guardar: " + (e.code || e.message) + ". Verifica las reglas de Firestore.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios`;
  }
};

window._genTempPass = () => {
  // Genera una contraseña aleatoria de 10 caracteres alfanuméricos
  const chars = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let pass = "";
  for (let i = 0; i < 10; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
  const targets = ["nuPass", "nuPass2", "rp-pass", "rp-pass2"];
  targets.forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.value = pass;
  });
};

// Crear usuario desde el formulario en línea de la sección Usuarios
window._saveNewUsuario = async () => {
  const nombre = document.getElementById("nuNombre")?.value.trim() || "";
  const username = normalizeUsername(document.getElementById("nuUser")?.value);
  const departamento = document.getElementById("nuDepto")?.value || "";
  const rol = document.getElementById("nuRol")?.value || "profesor";
  const password = document.getElementById("nuPass")?.value || "";
  const password2 = document.getElementById("nuPass2")?.value || "";
  const err = document.getElementById("nu-error");
  err.classList.add("hidden");
  const showError = (m) => { err.textContent = m; err.classList.remove("hidden"); };

  if (nombre.length < 3) { showError("Indica el nombre completo del profesor/a."); return; }
  if (!username) { showError("Indica el nombre de usuario con el que entrará (ej: mgarcia)."); return; }
  if (!isValidUsername(username)) { showError("El nombre de usuario no es válido (3-30 caracteres: letras minúsculas, números, punto, guion o guion bajo)."); return; }
  if (!departamento) { showError("Selecciona el departamento."); return; }
  if (password.length < 6) { showError("La contraseña debe tener al menos 6 caracteres."); return; }
  if (password !== password2) { showError("Las contraseñas no coinciden."); return; }

  // Comprobar disponibilidad del nombre de usuario (lista local + mapeo en Firestore)
  if (state.usuarios.some(u =>
    (u.username && normalizeUsername(u.username) === username) ||
    (!u.username && localPartOf(u.email || "") === username))) {
    showError(`El nombre de usuario "${username}" ya está en uso. Elige otro.`);
    return;
  }
  try {
    const taken = await getDoc(doc(db, USERNAMES_COLLECTION, username));
    if (taken.exists()) {
      showError(`El nombre de usuario "${username}" ya está en uso. Elige otro.`);
      return;
    }
  } catch (e) {
    console.warn("[_saveNewUsuario] No se pudo comprobar la disponibilidad:", e.code || e.message);
  }

  const btn = document.getElementById("nu-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Creando…`;

  try {
    await createUsuarioByAdmin({ nombre, username, departamento, rol, password });
    // Limpiar formulario
    ["nuNombre", "nuUser", "nuPass", "nuPass2"].forEach(id => { const el = document.getElementById(id); if (el) { el.value = ""; el.dataset.touched = ""; } });
    document.getElementById("nuDepto").value = "";
    document.getElementById("nuRol").value = "profesor";
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear usuario`;
    setTimeout(() => {
      alert(`Usuario creado correctamente.\n\nNombre: ${nombre}\nUsuario de acceso: ${username}\nDepartamento: ${departamento}\nRol: ${rol === "admin" ? "Administrador" : "Profesor/a"}\nContraseña: ${password}\n\nComunica estos datos al profesor/a por un canal seguro.`);
    }, 100);
    refreshUsuariosNow();
    setTimeout(() => refreshUsuariosNow(), 1500);
  } catch (e) {
    console.error("[_saveNewUsuario] Error:", e);
    const map = {
      "auth/email-already-in-use": "Ese nombre de usuario ya está en uso. Elige otro.",
      "auth/weak-password": "La contraseña es demasiado débil (mínimo 6 caracteres).",
      "auth/network-request-failed": "Sin conexión. Revisa tu red.",
      "auth/operation-not-allowed": "Firebase Authentication no tiene habilitado Email/Password.",
      "permission-denied": "Se creó la cuenta pero no se pudo guardar el perfil (revisa las reglas de Firestore).",
    };
    showError(e.code ? (map[e.code] || `Error: ${e.message}`) : (e.message || "Error desconocido"));
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear usuario`;
  }
};

window._setCursoActivo = (cursoId) => {
  if (!cursoId || cursoId === "auto") {
    state.forcedCursoId = null;
    try { localStorage.removeItem("forcedCursoId"); } catch (e) {}
  } else {
    state.forcedCursoId = cursoId;
    try { localStorage.setItem("forcedCursoId", cursoId); } catch (e) {}
  }
  // Forzar re-render completo de la shell
  // Usar setTimeout(0) para asegurar que el state se actualiza antes del render
  setTimeout(() => {
    renderAppShell();
  }, 0);
};

window._importProfesores = async (destinoId, origenId) => {
  if (!confirm(`¿Importar el profesorado del curso ${origenId} al curso ${destinoId}?\n\nEsto añadirá a todos los profesores asignados en ${origenId} al curso ${destinoId}.`)) return;
  try {
    const profesoresOrigen = state.profesoresPorCurso[origenId] || [];
    if (profesoresOrigen.length === 0) {
      alert(`El curso ${origenId} no tiene profesores asignados. No hay nada que importar.`);
      return;
    }
    // Combinar con los existentes en destino (sin duplicados)
    const profesoresDestino = state.profesoresPorCurso[destinoId] || [];
    const combined = Array.from(new Set([...profesoresDestino, ...profesoresOrigen]));
    // Guardar en Firestore
    await setDoc(doc(db, "curso_profesores", destinoId), {
      cursoId: destinoId,
      profesores: combined,
      updatedAt: Date.now(),
    }, { merge: true });
    state.profesoresPorCurso[destinoId] = combined;
    alert(`Importados ${profesoresOrigen.length} profesor(es) de ${origenId} a ${destinoId}.\n\nTotal profesores en ${destinoId}: ${combined.length}`);
    renderMain();
  } catch (e) {
    console.error(e);
    alert(`Error al importar profesores: ${e.message || e.code || "desconocido"}`);
  }
};

          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>

window._saveCursoProfesores = async () => {
  const err = document.getElementById("curso-prof-error");
  err.classList.add("hidden");
  const holder = document.getElementById("curso-prof-curso-id-holder");
  const cursoId = holder?.dataset.cursoId;
  if (!cursoId) { err.textContent = "No se pudo determinar el curso."; err.classList.remove("hidden"); return; }

  const checked = Array.from(document.querySelectorAll('#curso-prof-list input[type="checkbox"]:checked'))
    .map(cb => cb.dataset.ref).filter(Boolean);
  const manual = String(document.getElementById("curso-prof-manual")?.value || "")
    .split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
  const list = Array.from(new Set([...checked, ...manual]));

  const btn = document.getElementById("curso-prof-save");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Guardando…`;
  try {
    await setDoc(doc(db, "curso_profesores", cursoId), {
      cursoId,
      profesores: list,
      updatedAt: Date.now(),
    }, { merge: true });
    // Actualizar el estado local al instante (la suscripción lo confirmará)
    state.profesoresPorCurso[cursoId] = list;
    window._closeCursoProfesoresDialog();
    renderMain();
    setTimeout(() => alert(`Profesorado del curso ${cursoId} actualizado (${list.length} asignado/s).`), 80);
  } catch (e) {
    console.error("[_saveCursoProfesores] Error:", e);
    err.textContent = "Error al guardar: " + (e.code || e.message) + ". Comprueba las reglas de Firestore para 'curso_profesores'.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar asignación`;
  }
};

window._createCurso = async () => {
  const yearStr = document.getElementById("curso-year").value;
  const year = parseInt(yearStr);
  const err = document.getElementById("curso-error");
  err.classList.add("hidden");
  if (!year || year < 2025 || year > 2099) {
    err.textContent = "Introduce un año válido entre 2025 y 2099.";
    err.classList.remove("hidden");
    return;
  }
  const label = `${year}-${year + 1}`;
  if (state.cursos.some(c => c.id === label)) {
    err.textContent = `El curso ${label} ya existe.`;
    err.classList.remove("hidden");
    return;
  }
  const { start, end } = getSchoolYearBounds(label);
  const planStart = computePlanStartForYear(label);
  const planEndD = normalizeDate(planStart);
  planEndD.setDate(planEndD.getDate() + 36 * 7 + 4);
  const planEnd = dateToISO(planEndD);
  const evaluaciones = generateEvaluacionesForCurso({ planStart, planEnd });

  const btn = document.getElementById("curso-create-btn");
  btn.disabled = true;
  btn.innerHTML = `<svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="60"/></svg> Creando…`;
  try {
    await createCurso({ id: label, label, start, end, planStart, planEnd, evaluaciones });
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear curso`;
    renderMain();
  } catch (e) {
    console.error(e);
    err.textContent = "Error al crear el curso. Inténtalo de nuevo.";
    err.classList.remove("hidden");
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Crear curso`;
  }
};

window._deleteCurso = async (id) => {
  if (!confirm(`¿Seguro que deseas eliminar el curso ${id}? Esta acción no se puede deshacer.`)) return;
  try {
    await deleteCurso(id);
    renderMain();
  } catch (e) {
    console.error(e);
    alert("Error al eliminar el curso.");
  }
};

        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-slate-600 leading-relaxed">
          Al cambiar las fechas de inicio o fin, las <strong>semanas se recalculan automáticamente</strong> (criterio del centro: la semana de la fecha de inicio cuenta como la 1ª). Después puedes ajustar las semanas a mano si lo necesitas.
        </div>

        <div id="cal-summary" class="text-sm"></div>
        <div id="cal-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"></div>
      </div>

      <div class="p-4 border-t border-slate-200 flex justify-end gap-2 sticky bottom-0 bg-white rounded-b-2xl">
        <button data-action="close-calendario-dialog" class="px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-medium">Cancelar</button>
        <button data-action="save-calendario" class="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white text-sm font-semibold flex items-center gap-1.5">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar calendario
        </button>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  window._calRenderRows();
  window._calUpdateSummary();

  // Delegación de eventos: recalcular semanas al cambiar fechas, sincronizar el borrador
  overlay.addEventListener("input", (e) => {
    const t = e.target;
    if (!t.id) return;
    const mStart = t.id.match(/^cal-ev-start-(\d+)$/);
    const mEnd = t.id.match(/^cal-ev-end-(\d+)$/);
    if (mStart || mEnd) {
      const i = parseInt((mStart || mEnd)[1], 10);
      const s = document.getElementById(`cal-ev-start-${i}`)?.value || "";
      const en = document.getElementById(`cal-ev-end-${i}`)?.value || "";
      const auto = computeWeeksFromRange(s, en);
      if (auto > 0) {
        const wInput = document.getElementById(`cal-ev-weeks-${i}`);
        if (wInput) wInput.value = auto;
        if (window._calDraft?.evals[i]) window._calDraft.evals[i].weeks = auto;
      }
    }
    window._calSyncFromDOM();
    window._calUpdateSummary();
  });
};

// Pinta las filas de evaluaciones a partir del borrador
window._calRenderRows = () => {
  const box = document.getElementById("cal-rows");
  if (!box || !window._calDraft) return;
  const canRemove = window._calDraft.evals.length > 1;
  box.innerHTML = window._calDraft.evals.map((ev, i) => `
    <div class="bg-white border border-slate-200 rounded-xl p-3">
      <div class="flex items-center justify-between gap-2 mb-2">
        <span class="text-xs font-bold text-indigo-700">Evaluación ${i + 1}</span>
        <button data-action="cal-remove-ev" data-idx="${i}" ${canRemove ? "" : "disabled"} class="text-[11px] px-2 py-1 rounded-md border ${canRemove ? "border-red-200 bg-red-50 text-red-600 hover:bg-red-100" : "border-slate-200 bg-slate-50 text-slate-300 cursor-not-allowed"} transition">Quitar</button>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-[1fr_auto_auto_auto] gap-2 items-end">
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Nombre</label>
          <input id="cal-ev-name-${i}" type="text" value="${escapeHtml(ev.name || "")}" placeholder="Ej: Primera Evaluación" class="w-full h-10 px-3 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Inicio</label>
          <input id="cal-ev-start-${i}" type="date" value="${escapeHtml(ev.start || "")}" class="w-full sm:w-[150px] h-10 px-2 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Fin</label>
          <input id="cal-ev-end-${i}" type="date" value="${escapeHtml(ev.end || "")}" class="w-full sm:w-[150px] h-10 px-2 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Semanas</label>
          <input id="cal-ev-weeks-${i}" type="number" min="1" max="60" value="${parseInt(ev.weeks, 10) || 1}" class="w-full sm:w-[90px] h-10 px-2 rounded-lg border border-slate-300 focus:border-indigo-500 outline-none text-sm font-semibold" />
        </div>
      </div>
    </div>`).join("");
};

// Lee los valores actuales del formulario y los guarda en el borrador
window._calSyncFromDOM = () => {
  const d = window._calDraft;
  if (!d) return;
  const ps = document.getElementById("cal-plan-start")?.value;
  const pe = document.getElementById("cal-plan-end")?.value;
  if (ps !== undefined) d.planStart = ps;
  if (pe !== undefined) d.planEnd = pe;
  d.evals.forEach((ev, i) => {
    ev.name = document.getElementById(`cal-ev-name-${i}`)?.value ?? ev.name;
    ev.start = document.getElementById(`cal-ev-start-${i}`)?.value ?? ev.start;
    ev.end = document.getElementById(`cal-ev-end-${i}`)?.value ?? ev.end;
    const w = parseInt(document.getElementById(`cal-ev-weeks-${i}`)?.value, 10);
    if (Number.isFinite(w) && w >= 1) ev.weeks = w;
  });
};

// Validación: devuelve una lista de errores (bloquean el guardado) y de avisos (informativos)
window._calValidate = () => {
  const d = window._calDraft;
  const errors = [];
  const warnings = [];
  if (!d) return { errors: ["El diálogo no está inicializado."], warnings };
  if (!d.planStart || !d.planEnd) errors.push("Indica las fechas del plan del curso.");
  else if (normalizeDate(d.planEnd) < normalizeDate(d.planStart)) errors.push("El fin del plan no puede ser anterior a su inicio.");

  const evals = d.evals;
  if (evals.length === 0) errors.push("Debe haber al menos una evaluación.");
  evals.forEach((ev, i) => {
    const label = ev.name?.trim() || `Evaluación ${i + 1}`;
    if (!ev.start || !ev.end) errors.push(`${label}: faltan fechas de inicio o fin.`);
    else if (normalizeDate(ev.end) < normalizeDate(ev.start)) errors.push(`${label}: la fecha de fin es anterior a la de inicio.`);
    if (!(parseInt(ev.weeks, 10) >= 1)) errors.push(`${label}: las semanas deben ser 1 o más.`);
  });

  // Solapamientos (ordenadas por fecha de inicio)
  const sorted = evals.map((ev, i) => ({ ...ev, i })).filter(ev => ev.start && ev.end).sort((a, b) => normalizeDate(a.start) - normalizeDate(b.start));
  for (let k = 1; k < sorted.length; k++) {
    const prev = sorted[k - 1], cur = sorted[k];
    if (normalizeDate(cur.start) <= normalizeDate(prev.end)) {
      errors.push(`«${prev.name?.trim() || `Evaluación ${prev.i + 1}`}» y «${cur.name?.trim() || `Evaluación ${cur.i + 1}`}» se solapan en el calendario.`);
    }
  }

  // Avisos no bloqueantes
  if (d.planStart) {
    const ps = normalizeDate(d.planStart);
    if (!isNaN(ps.getTime()) && ps.getDay() !== 1) warnings.push("El inicio del plan no cae en lunes: las semanas correrán de ese día en adelante (se recomienda lunes).");
  }
  return { errors, warnings: warnings.filter(Boolean) };
};

// Resumen en vivo: total de semanas y estado de validación
window._calUpdateSummary = () => {
  const box = document.getElementById("cal-summary");
  if (!box || !window._calDraft) return;
  window._calSyncFromDOM();
  const d = window._calDraft;
  const total = totalWeeksOfEvals(d.evals);
  const { errors, warnings } = window._calValidate();
  const chips = d.evals.map((ev, i) => {
    const w = parseInt(ev.weeks, 10) || 0;
    const ok = ev.start && ev.end && normalizeDate(ev.end) >= normalizeDate(ev.start);
    return `<span class="text-[11px] px-2 py-0.5 rounded-full ${ok ? "bg-white border border-indigo-200 text-slate-700" : "bg-red-50 border border-red-200 text-red-600"}">${escapeHtml(ev.name?.trim() || `Evaluación ${i + 1}`)}: ${w} sem</span>`;
  }).join(" ");
  box.innerHTML = `
    <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 space-y-1.5">
      <p class="text-sm font-semibold text-slate-800">Total del plan: <span class="text-indigo-700">${total} semanas</span></p>
      <div class="flex flex-wrap gap-1.5">${chips}</div>
      ${warnings.map(w => `<p class="text-[11px] text-amber-700">⚠️ ${escapeHtml(w)}</p>`).join("")}
      ${errors.length ? `<ul class="list-disc pl-5 text-[11px] text-red-600 space-y-0.5">${errors.map(e => `<li>${escapeHtml(e)}</li>`).join("")}</ul>` : `<p class="text-[11px] text-emerald-700 font-medium">✓ El calendario es coherente y se puede guardar.</p>`}
    </div>`;
  return { errors, warnings };
};

window._calAddEv = () => {
  const d = window._calDraft;
  if (!d) return;
  window._calSyncFromDOM();
  // Nueva evaluación a continuación de la última (misma duración que la anterior)
  const last = d.evals[d.evals.length - 1];
  let start = "";
  if (last?.end) {
    const s = normalizeDate(last.end);
    s.setDate(s.getDate() + 3); // pequeño hueco, mismo criterio que el generador por defecto
    start = dateToISO(s);
  }
  const weeks = Math.max(1, parseInt(last?.weeks, 10) || 11);
  let end = "";
  if (start) {
    const e = normalizeDate(start);
    e.setDate(e.getDate() + Math.max(0, (weeks - 1) * 7));
    end = dateToISO(e);
  }
  d.evals.push({ name: `Evaluación ${d.evals.length + 1}`, start, end, weeks });
  window._calRenderRows();
  window._calUpdateSummary();
};

window._calRemoveEv = (idx) => {
  const d = window._calDraft;
  if (!d || d.evals.length <= 1) return;
  window._calSyncFromDOM();
  d.evals.splice(idx, 1);
  window._calRenderRows();
  window._calUpdateSummary();
};

window._calResetDefault = () => {
  const d = window._calDraft;
  if (!d) return;
  window._calSyncFromDOM();
  const planStart = d.planStart || computePlanStartForYear(d.cursoId);
  if (!planStart) { alert("No se pudo determinar el inicio del plan."); return; }
  d.planStart = planStart;
  const peInput = document.getElementById("cal-plan-start");
  if (peInput) peInput.value = planStart;
  d.evals = generateEvaluacionesForCurso({ planStart }).map(e => ({ ...e }));
  window._calRenderRows();
  window._calUpdateSummary();
};

window._closeCalendarioDialog = () => {
  document.getElementById("calendario-dialog")?.remove();
  window._calDraft = null;
};

window._saveCalendario = async () => {
  const d = window._calDraft;
  if (!d) return;
  window._calSyncFromDOM();
  const { errors } = window._calValidate();
  const errBox = document.getElementById("cal-error");
  if (errors.length) {
    errBox.textContent = "No se puede guardar: " + errors.join(" ");
    errBox.classList.remove("hidden");
    return;
  }
  errBox.classList.add("hidden");

  // Aviso si el inicio del plan no es lunes (no bloquea)
  const ps = normalizeDate(d.planStart);
  if (!isNaN(ps.getTime()) && ps.getDay() !== 1) {
    if (!confirm("El inicio del plan no cae en lunes. ¿Guardar de todos modos?")) return;
  }

  // Nombres por defecto si se dejaron vacíos
  const evaluaciones = d.evals.map((ev, i) => ({
    name: ev.name?.trim() || `Evaluación ${i + 1}`,
    start: ev.start,
    end: ev.end,
    weeks: parseInt(ev.weeks, 10) || 1,
  }));

  try {
    // setDoc con merge: conserva start/end del curso escolar, createdAt, etc.
    await setDoc(doc(db, CURSOS_COLLECTION, d.cursoId), {
      planStart: d.planStart,
      planEnd: d.planEnd,
      evaluaciones,
      updatedAt: Date.now(),
    }, { merge: true });
    // Actualizar la copia local mientras llega la suscripción
    const local = state.cursos.find(c => c.id === d.cursoId);
    if (local) { local.planStart = d.planStart; local.planEnd = d.planEnd; local.evaluaciones = evaluaciones; }
    window._closeCalendarioDialog();
    renderMain();
  } catch (e) {
    console.error("[saveCalendario] Error:", e);
    errBox.textContent = "Error al guardar en Firestore: " + (e.code || e.message) + ". Revisa las reglas de la colección " + CURSOS_COLLECTION + ".";
    errBox.classList.remove("hidden");
  }
};

// -----------------------------------------------------------------------------
// 24. ATTACH HANDLERS (placeholder para handlers adicionales)
// -----------------------------------------------------------------------------
function attachHandlers() {
  // Inicializar el contenedor de fechas del informe si estamos en esa vista
  if (state.view.name === "informes") {
    window._renderFechasContainer();
    // Cancelar timeout previo para evitar listeners duplicados
    if (window._informesTimeout) clearTimeout(window._informesTimeout);
    window._informesTimeout = setTimeout(() => {
      window._renderInformePreview();
      // Añadir listeners para actualizar vista previa cuando cambien los inputs
      document.querySelectorAll('#rpt-fechas-container input, #rpt-fechas-container select').forEach(el => {
        el.addEventListener("change", () => window._renderInformePreview());
      });
      document.querySelectorAll('input[name="rpt-plan"], input[name="rpt-area"]').forEach(el => {
        el.addEventListener("change", () => window._renderInformePreview());
      });
    }, 100);
  }
  // Poblar la tabla de usuarios (la vista solo devuelve el HTML; las filas se
  // insertan aquí, después de montar la vista en el DOM). Sin esto, el listado
  // aparecería vacío aunque hubiera usuarios registrados.
  if (state.view.name === "gestion-usuarios") {
    window._renderUsersTable && window._renderUsersTable();
  }
}

// =============================================================================
// INICIALIZACIÓN
// =============================================================================
// Restaurar curso forzado desde localStorage (si el admin lo estableció)
try {
  const saved = localStorage.getItem("forcedCursoId");
  if (saved) state.forcedCursoId = saved;
} catch (e) { console.warn("No se pudo leer forcedCursoId:", e); }

// Auth state observer
onAuthStateChanged(auth, async (user) => {
  // Capturar el usuario local para evitar race conditions
  const localUser = user;
  state.user = localUser;
  if (localUser) {
    try {
      const profile = await ensureUserProfile(localUser);
      // Verificar que el usuario no haya cambiado durante el await
      if (state.user !== localUser) return;
      state.userProfile = profile;
    } catch (e) {
      if (state.user !== localUser) return;
      console.error("Error cargando perfil:", e);
      state.userProfile = {
        id: localUser.uid, uid: localUser.uid, email: localUser.email || "",
        displayName: localUser.displayName || "Profesor/a", role: "profesor", department: "",
      };
    }
  } else {
    state.userProfile = null;
  }
  state.loading = false;
  setupGlobalSync();
  render();
});

// NOTA: Las suscripciones a Firestore se configuran en setupGlobalSync() dentro del
// onAuthStateChanged anterior. Esto garantiza que se re-crean cada vez que el usuario
// inicia sesión, con los permisos correctos.

// Service Worker externo (sw.js)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(reg => {
        if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
      })
      .catch(err => console.warn("[SW] Registro fallido:", err));
  });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!window._swReloaded) {
      window._swReloaded = true;
      window.location.reload();
    }
  });
}

// Render inicial
console.info(`[nmaspi] Gestión de usuarios v${APP_VERSION} — alta y acceso solo con usuario y contraseña.`);
render();
</script>
